<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iMade Admin</title>
  <link rel="icon" href="/icon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a14; color: #c4c4d4; min-height: 100vh; }

    /* Login screen */
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #0f0f1a; border: 1px solid #1e1e35; border-radius: 12px; padding: 32px; width: 360px; }
    .login-box h1 { font-size: 20px; font-weight: 700; color: #e2e2f0; margin-bottom: 4px; }
    .login-box p { font-size: 12px; color: #6b7280; margin-bottom: 20px; }
    .login-box .field { margin-bottom: 14px; }
    .login-box .field label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; margin-bottom: 4px; }
    .login-box .field input { width: 100%; background: #0c0a1a; color: #e2e2f0; border: 1px solid #2a2a40; padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }
    .login-box .field input:focus { border-color: #818cf8; }
    .login-box .login-btn { width: 100%; background: #818cf8; color: #0f0f1a; border: none; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 4px; }
    .login-box .login-btn:hover { opacity: 0.9; }
    .login-box .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error { color: #ef4444; font-size: 12px; margin-top: 8px; }

    /* Dashboard */
    .dashboard { display: none; }
    .header { padding: 24px 32px 0; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 18px; font-weight: 700; color: #e2e2f0; letter-spacing: -0.02em; }
    .header .stats { font-size: 12px; color: #6b7280; }
    .header .right { display: flex; align-items: center; gap: 16px; }
    .header .server-url { font-size: 11px; color: #4b5563; font-family: monospace; }
    .header .disconnect { font-size: 11px; color: #ef4444; cursor: pointer; background: none; border: none; }
    .header .disconnect:hover { text-decoration: underline; }

    /* Tabs */
    .tab-bar { display: flex; gap: 2px; padding: 16px 32px 0; border-bottom: 1px solid #1e1e35; }
    .tab-btn { background: transparent; border: none; border-bottom: 2px solid transparent; padding: 10px 18px; color: #6b6b80; font-size: 13px; cursor: pointer; white-space: nowrap; transition: color 0.15s, border-color 0.15s; }
    .tab-btn:hover { color: #a0a0b0; }
    .tab-btn.active { color: #e2e8f0; border-bottom-color: #818cf8; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .content { max-width: 960px; margin: 0 auto; padding: 24px 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 14px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; border-bottom: 1px solid #1e1e35; background: #0f0f1a; }
    th.num { text-align: center; }
    td { padding: 10px 14px; border-bottom: 1px solid #141425; }
    td.num { text-align: center; font-family: 'SF Mono', Monaco, monospace; font-size: 12px; }
    tr.user-row { cursor: pointer; transition: background 0.15s; }
    tr.user-row:hover { background: #12121f; }
    tr.user-row.expanded { background: #1a1a2e; }
    .badge { display: inline-block; margin-left: 6px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #818cf8; background: rgba(129,140,248,0.12); padding: 2px 6px; border-radius: 4px; }
    .badge-trial { color: #f59e0b; background: rgba(245,158,11,0.12); }
    .badge-full { color: #22c55e; background: rgba(34,197,94,0.12); }
    .badge-verified { color: #22c55e; background: rgba(34,197,94,0.12); }
    .badge-unverified { color: #ef4444; background: rgba(239,68,68,0.12); }
    .plan-toggle { border: none; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; transition: opacity 0.15s; }
    .plan-toggle:hover { opacity: 0.8; }
    .plan-toggle-trial { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .plan-toggle-full { background: rgba(34,197,94,0.15); color: #22c55e; }
    .role-toggle { border: none; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; transition: opacity 0.15s; }
    .role-toggle:hover { opacity: 0.8; }
    .role-toggle-user { background: rgba(107,114,128,0.15); color: #6b7280; }
    .role-toggle-admin { background: rgba(129,140,248,0.15); color: #818cf8; }
    .actions { display: flex; gap: 6px; }
    .btn { border: none; padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.8; }
    .btn-edit { background: rgba(129,140,248,0.15); color: #818cf8; }
    .btn-delete { background: rgba(239,68,68,0.15); color: #ef4444; }
    .btn-save { background: #818cf8; color: #0f0f1a; }
    .btn-cancel { background: none; color: #6b7280; border: 1px solid #2a2a40; }
    .edit-row td, .confirm-row td { padding: 12px 14px; background: #12121f; border-top: none; }
    .edit-form { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; }
    .field input { background: #0c0a1a; color: #e2e2f0; border: 1px solid #2a2a40; padding: 6px 10px; border-radius: 4px; font-size: 13px; outline: none; width: 180px; }
    .field input:focus { border-color: #818cf8; }
    .confirm-msg { color: #ef4444; font-size: 13px; }
    .confirm-msg strong { color: #f87171; }
    .songs-panel { background: #0c0a1a; border-top: 1px solid #1e1e35; max-height: 420px; overflow-y: auto; }
    .songs-panel table { font-size: 12px; }
    .songs-panel th { font-size: 9px; padding: 6px 12px; background: #0c0a1a; color: #4b5563; }
    .songs-panel td { padding: 5px 12px; font-size: 12px; color: #9ca3af; border-bottom: 1px solid #1a1a2e; }
    .toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
    .btn-refresh { background: none; border: 1px solid #2a2a40; color: #6b7280; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn-refresh:hover { border-color: #818cf8; color: #818cf8; }
    .btn-refresh.spinning svg { animation: spin 0.6s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .btn-add { background: #818cf8; color: #0f0f1a; border: none; padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-add:hover { opacity: 0.9; }
    .add-form-wrap { background: #0f0f1a; border: 1px solid #1e1e35; border-radius: 8px; padding: 20px; margin-bottom: 16px; display: none; }
    .add-form-wrap.open { display: block; }
    .add-form-wrap h3 { font-size: 13px; font-weight: 700; color: #e2e2f0; margin-bottom: 12px; }
    .add-form { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .add-error { color: #ef4444; font-size: 12px; margin-top: 8px; }
    .loading { display: flex; align-items: center; justify-content: center; min-height: 200px; color: #6b7280; font-size: 13px; }
    .error { color: #ef4444; font-size: 13px; text-align: center; padding: 12px; }
    .empty { color: #6b7280; font-size: 12px; padding: 12px; }
    .table-wrap { border-radius: 8px; border: 1px solid #1e1e35; overflow: hidden; }
    .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2e; border-top: 1px solid #818cf8; padding: 12px 24px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; z-index: 100; transform: translateY(100%); transition: transform 0.2s ease; }
    .save-bar.visible { transform: translateY(0); }
    .save-bar .save-msg { flex: 1; font-size: 12px; color: #818cf8; font-weight: 600; }
    .save-bar .btn-bar-save { background: #818cf8; color: #0f0f1a; border: none; padding: 8px 20px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .save-bar .btn-bar-save:hover { opacity: 0.9; }
    .save-bar .btn-bar-cancel { background: none; color: #6b7280; border: 1px solid #2a2a40; padding: 8px 20px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .save-bar .btn-bar-cancel:hover { border-color: #6b7280; color: #c4c4d4; }
    .toggle-changed { outline: 2px solid #818cf8; outline-offset: 1px; }

    /* Search bar */
    .search-input { background: #0c0a1a; color: #e2e2f0; border: 1px solid #2a2a40; padding: 8px 14px; border-radius: 6px; font-size: 12px; outline: none; width: 220px; transition: border-color 0.15s; }
    .search-input:focus { border-color: #818cf8; }
    .search-input::placeholder { color: #4b5563; }

    /* User detail page */
    .user-detail { display: none; }
    .user-detail.active { display: block; }
    .back-btn { background: none; border: 1px solid #2a2a40; color: #6b7280; padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
    .back-btn:hover { border-color: #818cf8; color: #818cf8; }
    .detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .detail-user-info { display: flex; align-items: center; gap: 16px; }
    .detail-avatar { width: 48px; height: 48px; border-radius: 50%; background: #1a1a2e; border: 2px solid #2a2a45; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #818cf8; }
    .detail-name { font-size: 20px; font-weight: 700; color: #e2e2f0; }
    .detail-meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: #0f0f1a; border: 1px solid #1e1e35; border-radius: 10px; padding: 16px 20px; }
    .stat-card .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; margin-bottom: 6px; }
    .stat-card .value { font-size: 24px; font-weight: 700; color: #e2e2f0; font-family: 'SF Mono', Monaco, monospace; }
    .stat-card .sub { font-size: 11px; color: #4b5563; margin-top: 4px; }
    .detail-section { margin-bottom: 24px; }
    .detail-section h3 { font-size: 13px; font-weight: 700; color: #e2e2f0; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
    .genre-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .genre-tag { background: #1a1a2e; border: 1px solid #2a2a45; border-radius: 6px; padding: 4px 12px; font-size: 12px; color: #9ca3af; }
    .genre-tag .count { color: #6b7280; margin-left: 4px; }
    .detail-songs-search { margin-bottom: 12px; }
    .elo-bar { width: 60px; height: 6px; background: #1a1a2e; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 6px; }
    .elo-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

    /* Activity tab */
    .action-badge { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 4px; }
    .action-badge-login { color: #22c55e; background: rgba(34,197,94,0.12); }
    .action-badge-logout { color: #6b7280; background: rgba(107,114,128,0.12); }
    .action-badge-register { color: #818cf8; background: rgba(129,140,248,0.12); }
    .action-badge-song_create, .action-badge-song_bulk_upload { color: #f59e0b; background: rgba(245,158,11,0.12); }
    .action-badge-song_delete { color: #ef4444; background: rgba(239,68,68,0.12); }
    .action-badge-username_change { color: #818cf8; background: rgba(129,140,248,0.12); }
    .action-badge-password_reset, .action-badge-password_reset_requested { color: #f59e0b; background: rgba(245,158,11,0.12); }
    .action-badge-email_verified { color: #22c55e; background: rgba(34,197,94,0.12); }
    .activity-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .activity-filter { background: #0c0a1a; color: #e2e2f0; border: 1px solid #2a2a40; padding: 7px 10px; border-radius: 6px; font-size: 12px; outline: none; }
    .activity-filter:focus { border-color: #818cf8; }
    .btn-load-more { display: block; width: 100%; background: none; border: 1px solid #2a2a40; color: #6b7280; padding: 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 12px; transition: all 0.15s; }
    .btn-load-more:hover { border-color: #818cf8; color: #818cf8; }

    /* Environment switcher */
    .env-switcher { display: inline-flex; align-items: center; gap: 2px; margin-left: 10px; vertical-align: middle; background: #0c0a1a; border: 1px solid #1e1e35; border-radius: 6px; padding: 2px; }
    .env-btn { border: none; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; transition: all 0.15s; background: transparent; color: #6b7280; }
    .env-btn:hover { color: #e2e2f0; }
    .env-btn.active-local { background: #818cf8; color: #0a0a14; }
    .env-btn.active-prod { background: #22c55e; color: #0a0a14; }

  </style>
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen" id="login-screen">
    <div class="login-box">
      <h1>iMade Admin</h1>
      <p>Connect to your iMade server.</p>
      <div class="field">
        <label>Server URL</label>
        <input id="login-url" value="http://localhost:3000" placeholder="http://localhost:3000" />
      </div>
      <div class="field">
        <label>Admin Token</label>
        <input id="login-token" type="password" placeholder="Paste token from server console" />
      </div>
      <button class="login-btn" id="login-btn">Connect</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="header">
      <div>
        <h1>iMade Admin <span id="version-badge" style="font-size:11px;font-weight:600;color:#818cf8;background:rgba(129,140,248,0.12);padding:2px 8px;border-radius:4px;margin-left:8px;vertical-align:middle;display:none"></span>
          <span class="env-switcher" id="env-switcher">
            <button class="env-btn" id="env-local" data-env="local">Local</button>
            <button class="env-btn" id="env-prod" data-env="prod">Prod</button>
          </span>
        </h1>
        <div class="stats" id="stats"></div>
      </div>
      <div class="right">
        <span class="server-url" id="server-url"></span>
        <button class="disconnect" id="disconnect-btn">Disconnect</button>
      </div>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="users">Users</button>
      <button class="tab-btn" data-tab="activity">Activity</button>
    </div>

    <!-- Users tab -->
    <div class="tab-panel active" id="tab-users">
      <div class="content">
        <div class="toolbar">
          <input type="text" name="fake-url" tabindex="-1" style="position:absolute;opacity:0;width:0;height:0;padding:0;border:0;pointer-events:none" />
          <input type="password" name="fake-pw" tabindex="-1" style="position:absolute;opacity:0;width:0;height:0;padding:0;border:0;pointer-events:none" />
          <input class="search-input" id="user-search" type="search" placeholder="Search users..." autocomplete="off" />
          <button class="btn-refresh" id="refresh-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Refresh</button>
          <button class="btn-add" id="add-user-btn">+ Add User</button>
        </div>
        <div class="add-form-wrap" id="add-form-wrap">
          <h3>Create New User</h3>
          <form autocomplete="off" onsubmit="return false"><div class="add-form">
            <div class="field"><label>Username</label><input id="add-username" placeholder="min 2 characters" autocomplete="off" /></div>
            <div class="field"><label>Password</label><input id="add-password" type="password" placeholder="min 4 characters" autocomplete="new-password" /></div>
            <button type="button" class="btn btn-save" id="add-save-btn">Create</button>
            <button type="button" class="btn btn-cancel" id="add-cancel-btn">Cancel</button>
          </div></form>
          <div class="add-error" id="add-error"></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Plan</th>
                <th>Role</th>
                <th class="num">Songs</th>
                <th class="num">Comparisons</th>
                <th class="num">Playlists</th>
                <th>Joined</th>
              </tr>
            </thead>
            <tbody id="user-table"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- User detail view (replaces tab content) -->
    <div class="user-detail" id="user-detail">
      <div class="content" id="detail-content"></div>
    </div>

    <!-- Activity tab -->
    <div class="tab-panel" id="tab-activity">
      <div class="content" id="activity-content"></div>
    </div>

    <div class="save-bar" id="save-bar">
      <span class="save-msg" id="save-msg"></span>
      <button class="btn-bar-cancel" id="bar-cancel-btn">Cancel</button>
      <button class="btn-bar-save" id="bar-save-btn">Save Changes</button>
    </div>
  </div>

  <script>
    let API = '';
    let TOKEN = '';
    let users = [];
    let expandedUser = null;
    let songCache = {};
    let emailCache = {};
    let pendingChanges = {}; // { userId: { plan?, role? } }
    let searchQuery = '';
    let viewingUser = null; // user id for detail page
    let detailSongSearch = '';

    // Environment config
    const ENVIRONMENTS = {
      local: { url: 'http://localhost:3000', label: 'Local' },
      prod: { url: 'https://app.imade.one', label: 'Prod' },
    };
    let currentEnv = null;

    function detectEnv(url) {
      for (const [key, env] of Object.entries(ENVIRONMENTS)) {
        if (url === env.url || url === env.url + '/') return key;
      }
      return null;
    }

    function updateEnvUI() {
      const localBtn = document.getElementById('env-local');
      const prodBtn = document.getElementById('env-prod');
      const env = detectEnv(API);
      localBtn.className = 'env-btn' + (env === 'local' ? ' active-local' : '');
      prodBtn.className = 'env-btn' + (env === 'prod' ? ' active-prod' : '');
      currentEnv = env;
    }

    async function switchEnv(envKey) {
      if (currentEnv === envKey) return;
      const env = ENVIRONMENTS[envKey];
      // Local admin must be accessed directly (HTTPS→HTTP blocked by browsers)
      if (envKey === 'local' && location.origin !== env.url) {
        window.location.href = env.url + '/admin/';
        return;
      }
      const saved = localStorage.getItem('imade_admin_tokens');
      let tokens = {};
      try { tokens = JSON.parse(saved) || {}; } catch {}
      let token = tokens[envKey];
      if (envKey === 'local') {
        token = '__session__';
      }
      if (!token) {
        const t = prompt(`Enter admin token for ${env.label} (${env.url}):`);
        if (!t) return;
        try {
          const r = await fetch(env.url + '/api/admin/verify', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + t },
          });
          if (!r.ok) { alert('Invalid token'); return; }
          tokens[envKey] = t;
          localStorage.setItem('imade_admin_tokens', JSON.stringify(tokens));
          token = t;
        } catch (e) { alert('Connection failed: ' + e.message); return; }
      }
      API = env.url;
      TOKEN = token;
      sessionStorage.setItem('imade_admin', JSON.stringify({ url: API, token: TOKEN }));
      users = []; songCache = {}; emailCache = {}; expandedUser = null; editingUser = null;
      confirmingDelete = null; pendingChanges = {}; viewingUser = null;
      activityInitialized = false; activityLogs = []; activityOffset = 0; activityFilter = ''; activitySearch = '';
      document.getElementById('server-url').textContent = API;
      updateEnvUI();
      showDashboard();
      loadUsers();
      // Reload activity if that tab is active
      const activeTab = document.querySelector('.tab-btn.active');
      if (activeTab && activeTab.dataset.tab === 'activity') initActivity();
    }

    document.getElementById('env-local').addEventListener('click', () => switchEnv('local'));
    document.getElementById('env-prod').addEventListener('click', () => switchEnv('prod'));

    // --- Tab switching ---
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'activity') initActivity();
      });
    });

    // Auto-connect when served locally (same-origin, session auth)
    const isLocal = location.pathname.startsWith('/admin');
    if (isLocal) {
      API = location.origin;
      TOKEN = '__session__';
      showDashboard();
      loadUsers();
    } else {
      // Restore saved session (remote access)
      let restored = false;
      const saved = sessionStorage.getItem('imade_admin');
      if (saved) {
        try {
          const s = JSON.parse(saved);
          API = s.url; TOKEN = s.token;
          restored = true;
        } catch {}
      }
      // Fall back to localStorage tokens (persists across sessions)
      if (!restored) {
        try {
          const tokens = JSON.parse(localStorage.getItem('imade_admin_tokens')) || {};
          if (tokens.prod) {
            API = ENVIRONMENTS.prod.url; TOKEN = tokens.prod;
            restored = true;
          }
        } catch {}
      }
      if (restored) {
        showDashboard();
        loadUsers();
      }
    }

    // Login
    document.getElementById('login-btn').addEventListener('click', async () => {
      const url = document.getElementById('login-url').value.trim().replace(/\/+$/, '');
      const token = document.getElementById('login-token').value.trim();
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      errEl.textContent = '';
      if (!url || !token) { errEl.textContent = 'Both fields are required.'; return; }

      btn.disabled = true;
      btn.textContent = 'Connecting...';
      try {
        const r = await fetch(url + '/api/admin/verify', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
        });
        if (!r.ok) throw new Error('Invalid token or server unreachable');
        API = url; TOKEN = token;
        sessionStorage.setItem('imade_admin', JSON.stringify({ url, token }));
        showDashboard();
        loadUsers();
      } catch (e) {
        errEl.textContent = e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Connect';
      }
    });

    // Enter key on token field
    document.getElementById('login-token').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });

    // Disconnect
    document.getElementById('disconnect-btn').addEventListener('click', () => {
      sessionStorage.removeItem('imade_admin');
      API = ''; TOKEN = '';
      users = []; songCache = {}; emailCache = {}; expandedUser = null; editingUser = null; confirmingDelete = null;
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
    });

    function showDashboard() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('server-url').textContent = API;
      updateEnvUI();
      // Save token for env switching
      const env = detectEnv(API);
      if (env && TOKEN && TOKEN !== '__session__') {
        let tokens = {};
        try { tokens = JSON.parse(localStorage.getItem('imade_admin_tokens')) || {}; } catch {}
        tokens[env] = TOKEN;
        localStorage.setItem('imade_admin_tokens', JSON.stringify(tokens));
      }
      // Fetch and display version
      apiFetch('/api/update-check').then(d => {
        if (d && d.current) {
          const badge = document.getElementById('version-badge');
          badge.textContent = 'v' + d.current;
          badge.style.display = 'inline';
        }
      }).catch(() => {});
    }

    async function apiFetch(path, opts = {}) {
      const headers = { ...(opts.headers || {}) };
      if (TOKEN && TOKEN !== '__session__') headers['Authorization'] = 'Bearer ' + TOKEN;
      const r = await fetch(API + path, { ...opts, headers, credentials: 'same-origin' });
      if (r.status === 403) {
        sessionStorage.removeItem('imade_admin');
        location.reload();
        throw new Error('Session expired');
      }
      if (!r.ok) {
        const text = await r.text();
        let msg; try { msg = JSON.parse(text).error; } catch {}
        throw new Error(msg || `Request failed (${r.status})`);
      }
      return r.json();
    }

    async function loadUsers() {
      try {
        users = await apiFetch('/api/admin/users');
        render();
      } catch (e) {
        document.getElementById('user-table').innerHTML =
          `<tr><td colspan="9" class="error">${esc(e.message)}</td></tr>`;
      }
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function formatDate(d) {
      if (!d) return '\u2014';
      return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function render() {
      const totalSongs = users.reduce((s, u) => s + u.song_count, 0);
      const totalComps = users.reduce((s, u) => s + u.comparison_count, 0);
      document.getElementById('stats').textContent =
        `${users.length} users \u00b7 ${totalSongs} songs \u00b7 ${totalComps} comparisons`;

      const tbody = document.getElementById('user-table');
      let html = '';

      const q = searchQuery.toLowerCase().trim();
      const filtered = q ? users.filter(u =>
        u.username.toLowerCase().includes(q) ||
        String(u.id).includes(q) ||
        (u.plan || 'trial').includes(q) ||
        (u.role || 'user').includes(q) ||
        (u.email || '').toLowerCase().includes(q)
      ) : users;

      filtered.forEach((u, idx) => {
        const isExpanded = expandedUser === u.id;
        const pending = pendingChanges[u.id] || {};
        const plan = pending.plan !== undefined ? pending.plan : (u.plan || 'trial');
        const role = pending.role !== undefined ? pending.role : (u.role || 'user');
        const planChanged = pending.plan !== undefined;
        const roleChanged = pending.role !== undefined;
        const planClass = plan === 'full' ? 'plan-toggle-full' : 'plan-toggle-trial';
        html += `<tr class="user-row ${isExpanded ? 'expanded' : ''}" data-expand="${u.id}">
          <td>${idx}</td>
          <td><strong>${esc(u.username)}</strong>${u.email_verified ? '<span class="badge badge-verified">verified</span>' : u.email ? '<span class="badge badge-unverified">unverified</span>' : ''}</td>
          <td><button class="plan-toggle ${planClass}${planChanged ? ' toggle-changed' : ''}" data-toggle-plan="${u.id}" data-current-plan="${plan}">${plan === 'full' ? 'Full' : 'Trial'}</button></td>
          <td>${u.id === 1 ? '<span class="role-toggle role-toggle-admin" style="cursor:default;opacity:0.5">Admin</span>' : `<button class="role-toggle ${role === 'admin' ? 'role-toggle-admin' : 'role-toggle-user'}${roleChanged ? ' toggle-changed' : ''}" data-toggle-role="${u.id}" data-current-role="${role}">${role === 'admin' ? 'Admin' : 'User'}</button>`}</td>
          <td class="num">${u.song_count}</td>
          <td class="num">${u.comparison_count}</td>
          <td class="num">${u.playlist_count}</td>
          <td>${formatDate(u.created_at)}</td>
        </tr>`;

      });

      tbody.innerHTML = html;


      // Update save bar visibility
      const changeCount = Object.keys(pendingChanges).length;
      const bar = document.getElementById('save-bar');
      const msg = document.getElementById('save-msg');
      if (changeCount > 0) {
        const names = Object.keys(pendingChanges).map(id => {
          const u = users.find(u => u.id === parseInt(id));
          return u ? u.username : 'user';
        });
        msg.textContent = `Unsaved changes for ${names.join(', ')}`;
        bar.classList.add('visible');
      } else {
        bar.classList.remove('visible');
      }
    }

    document.addEventListener('click', async (e) => {
      const t = e.target;

      const expandRow = t.closest('[data-expand]');
      if (expandRow && !t.closest('button')) {
        const id = parseInt(expandRow.dataset.expand);
        showUserDetail(id);
        return;
      }

      if (t.dataset.togglePlan) {
        const id = parseInt(t.dataset.togglePlan);
        const current = t.dataset.currentPlan || 'trial';
        const newPlan = current === 'trial' ? 'full' : 'trial';
        const orig = users.find(u => u.id === id);
        if (!pendingChanges[id]) pendingChanges[id] = {};
        if (newPlan === (orig?.plan || 'trial')) { delete pendingChanges[id].plan; } else { pendingChanges[id].plan = newPlan; }
        if (Object.keys(pendingChanges[id]).length === 0) delete pendingChanges[id];
        render();
        return;
      }

      if (t.dataset.toggleRole) {
        const id = parseInt(t.dataset.toggleRole);
        const current = t.dataset.currentRole || 'user';
        const newRole = current === 'user' ? 'admin' : 'user';
        const orig = users.find(u => u.id === id);
        if (!pendingChanges[id]) pendingChanges[id] = {};
        if (newRole === (orig?.role || 'user')) { delete pendingChanges[id].role; } else { pendingChanges[id].role = newRole; }
        if (Object.keys(pendingChanges[id]).length === 0) delete pendingChanges[id];
        render();
        return;
      }
    });

    // Save bar — persist all pending changes
    document.getElementById('bar-save-btn').addEventListener('click', async () => {
      const btn = document.getElementById('bar-save-btn');
      btn.disabled = true; btn.textContent = 'Saving...';
      try {
        for (const [id, changes] of Object.entries(pendingChanges)) {
          users = await apiFetch(`/api/admin/users/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(changes),
          });
        }
        pendingChanges = {};
        render();
      } catch (e) { alert(e.message); }
      btn.disabled = false; btn.textContent = 'Save Changes';
    });

    // Save bar — cancel all pending changes
    document.getElementById('bar-cancel-btn').addEventListener('click', () => {
      pendingChanges = {};
      render();
    });

    // Refresh
    document.getElementById('refresh-btn').addEventListener('click', async () => {
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spinning');
      songCache = {}; emailCache = {};
      pendingChanges = {};
      await loadUsers();
      btn.classList.remove('spinning');
    });

    // Add User
    document.getElementById('add-user-btn').addEventListener('click', () => {
      const wrap = document.getElementById('add-form-wrap');
      wrap.classList.toggle('open');
      if (wrap.classList.contains('open')) document.getElementById('add-username').focus();
      document.getElementById('add-error').textContent = '';
    });
    document.getElementById('add-cancel-btn').addEventListener('click', () => {
      document.getElementById('add-form-wrap').classList.remove('open');
      document.getElementById('add-username').value = '';
      document.getElementById('add-password').value = '';
      document.getElementById('add-error').textContent = '';
    });
    document.getElementById('add-save-btn').addEventListener('click', async () => {
      const username = document.getElementById('add-username').value.trim();
      const password = document.getElementById('add-password').value;
      const errEl = document.getElementById('add-error');
      errEl.textContent = '';
      if (!username || !password) { errEl.textContent = 'Both fields are required.'; return; }
      try {
        users = await apiFetch('/api/admin/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        document.getElementById('add-form-wrap').classList.remove('open');
        document.getElementById('add-username').value = '';
        document.getElementById('add-password').value = '';
        render();
      } catch (e) { errEl.textContent = e.message; }
    });
    document.getElementById('add-password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('add-save-btn').click();
    });

    // User search
    document.getElementById('user-search').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });
    document.getElementById('user-search').addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.target.value = ''; searchQuery = ''; render(); }
    });
    // Poll to clear browser autofill (Chrome sets value without firing events)
    setInterval(() => {
      const s = document.getElementById('user-search');
      if (s && /^https?:\/\//.test(s.value)) { s.value = ''; searchQuery = ''; render(); }
    }, 200);

    // ===================== USER DETAIL VIEW =====================

    async function showUserDetail(id) {
      viewingUser = id;
      detailSongSearch = '';
      // Hide tabs + tab bar, show detail view
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelector('.tab-bar').style.display = 'none';
      document.getElementById('user-detail').classList.add('active');
      // Load songs and emails if not cached
      if (!songCache[id] || !emailCache[id]) {
        renderUserDetail(); // show loading state
        const [songs, emails] = await Promise.all([
          songCache[id] ? songCache[id] : apiFetch(`/api/admin/users/${id}/songs`).catch(() => []),
          emailCache[id] ? emailCache[id] : apiFetch(`/api/admin/users/${id}/emails`).catch(() => []),
        ]);
        songCache[id] = songs;
        emailCache[id] = emails;
      }
      renderUserDetail();
    }

    function hideUserDetail() {
      viewingUser = null;
      document.getElementById('user-detail').classList.remove('active');
      document.querySelector('.tab-bar').style.display = 'flex';
      // Re-activate the users tab
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-tab="users"]').classList.add('active');
      document.getElementById('tab-users').classList.add('active');
    }

    function renderUserDetail() {
      const el = document.getElementById('detail-content');
      const u = users.find(x => x.id === viewingUser);
      if (!u) { el.innerHTML = '<div class="error">User not found</div>'; return; }

      const songs = songCache[u.id];
      const plan = u.plan || 'trial';
      const role = u.role || 'user';

      // Compute stats from songs
      let avgElo = 0, maxElo = 0, minElo = 1000, topSong = null, genreCounts = {};
      if (songs && songs.length > 0) {
        let eloSum = 0;
        songs.forEach(s => {
          eloSum += s.elo;
          if (s.elo > maxElo) { maxElo = s.elo; topSong = s; }
          if (s.elo < minElo) minElo = s.elo;
          const g = s.genre || 'Ungenred';
          genreCounts[g] = (genreCounts[g] || 0) + 1;
        });
        avgElo = Math.round(eloSum / songs.length);
      }

      let html = `<div style="margin-bottom:20px">
        <button class="back-btn" id="detail-back">\u2190 Back to Users</button>
      </div>`;

      // Header
      html += `<div class="detail-header">
        <div class="detail-user-info">
          <div class="detail-avatar">${esc(u.username.charAt(0).toUpperCase())}</div>
          <div>
            <div class="detail-name">${esc(u.username)}
              <span class="badge ${plan === 'full' ? 'badge-full' : 'badge-trial'}">${plan}</span>
              ${u.email_verified ? '<span class="badge badge-verified">verified</span>' : u.email ? '<span class="badge badge-unverified">unverified</span>' : ''}
            </div>
            <div class="detail-meta">ID: ${u.id}${u.email ? ' \u00b7 ' + esc(u.email) : ''} \u00b7 Joined ${formatDate(u.created_at)}</div>
          </div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn-refresh" id="detail-export">Export Data</button>
          <label class="btn-refresh" id="detail-import-label" style="cursor:pointer">Import Data
            <input type="file" accept=".json" id="detail-import-input" style="display:none" />
          </label>
        </div>
      </div>`;

      // Stat cards
      html += `<div class="stat-cards">
        <div class="stat-card">
          <div class="label">Songs</div>
          <div class="value">${u.song_count}</div>
          ${songs && songs.length > 0 ? `<div class="sub">Avg Elo: ${avgElo}</div>` : ''}
        </div>
        <div class="stat-card">
          <div class="label">Comparisons</div>
          <div class="value">${u.comparison_count}</div>
          ${u.song_count > 0 ? `<div class="sub">${(u.comparison_count / u.song_count).toFixed(1)} per song</div>` : ''}
        </div>
        <div class="stat-card">
          <div class="label">Playlists</div>
          <div class="value">${u.playlist_count}</div>
        </div>
        <div class="stat-card">
          <div class="label">Elo Range</div>
          <div class="value">${songs && songs.length > 0 ? minElo + '\u2013' + maxElo : '\u2014'}</div>
          ${topSong ? `<div class="sub">Top: ${esc(topSong.title)}</div>` : ''}
        </div>
      </div>`;

      // Account section
      html += `<div class="detail-section">
        <h3>Account</h3>
        <div style="background:#0f0f1a;border:1px solid #1e1e35;border-radius:10px;padding:20px">
          <form autocomplete="off" onsubmit="return false">
          <div style="display:flex;flex-direction:column;gap:14px;max-width:360px">
            <div class="field"><label>Username</label><input id="detail-edit-username" value="${esc(u.username)}" autocomplete="off" /></div>
            <div class="field"><label>Email</label><input id="detail-edit-email" value="${esc(u.email || '')}" placeholder="user@example.com" autocomplete="off" /></div>
            <div class="field"><label>New Password</label><input id="detail-edit-password" type="password" placeholder="Leave empty to keep" autocomplete="new-password" /></div>
            <div style="display:flex;gap:8px;margin-top:4px">
              <button class="btn btn-save" id="detail-save-account">Save</button>
              ${u.id !== 1 ? '<button class="btn btn-delete" id="detail-delete-user">Delete User</button>' : ''}
            </div>
            <div id="detail-account-msg" style="font-size:12px;display:none"></div>
          </div>
          </form>
        </div>
      </div>`;

      // Genres breakdown
      if (songs && songs.length > 0) {
        const sortedGenres = Object.entries(genreCounts).sort((a, b) => b[1] - a[1]);
        html += `<div class="detail-section">
          <h3>Genres</h3>
          <div class="genre-tags">
            ${sortedGenres.map(([g, c]) => `<span class="genre-tag">${esc(g)}<span class="count">${c}</span></span>`).join('')}
          </div>
        </div>`;
      }

      // Emails sent
      const emails = emailCache[u.id];
      if (emails && emails.length > 0) {
        html += `<div class="detail-section">
          <h3>Emails Sent (${emails.length})</h3>
          <div class="table-wrap"><table><thead><tr>
            <th>Date</th><th>Type</th><th>Status</th>
          </tr></thead><tbody>`;
        emails.forEach(em => {
          const typeLabel = em.type === 'verify' ? 'Verification' : em.type === 'reset' ? 'Password Reset' : esc(em.type);
          const typeBadge = em.type === 'verify'
            ? '<span class="action-badge action-badge-register">' + typeLabel + '</span>'
            : '<span class="action-badge action-badge-login">' + typeLabel + '</span>';
          const status = em.used ? '<span style="color:#22c55e">Used</span>' : (em.expires_at < Date.now() ? '<span style="color:#6b7280">Expired</span>' : '<span style="color:#f59e0b">Pending</span>');
          html += `<tr>
            <td>${formatDateTime(em.created_at)}</td>
            <td>${typeBadge}</td>
            <td>${status}</td>
          </tr>`;
        });
        html += '</tbody></table></div></div>';
      }

      // Songs table
      html += `<div class="detail-section">
        <h3>Songs (${songs ? songs.length : '...'})</h3>`;

      if (!songs) {
        html += '<div class="loading">Loading songs...</div>';
      } else if (songs.length === 0) {
        html += '<div class="empty">No songs yet</div>';
      } else {
        html += `<div class="detail-songs-search">
          <input class="search-input" id="detail-song-search" type="search" placeholder="Search songs..." value="${esc(detailSongSearch)}" autocomplete="off" />
        </div>`;

        const q = detailSongSearch.toLowerCase().trim();
        let filtered = songs;
        if (q) {
          filtered = songs.filter(s =>
            s.title.toLowerCase().includes(q) ||
            (s.genre || '').toLowerCase().includes(q) ||
            (s.date || '').includes(q)
          );
        }

        html += '<div class="table-wrap"><table><thead><tr>';
        html += '<th class="num">#</th><th>Title</th><th>Genre</th><th class="num">Elo</th><th>Date</th><th>Notes</th>';
        html += '</tr></thead><tbody>';

        filtered.forEach((s, i) => {
          const eloColor = s.elo >= 600 ? '#22c55e' : s.elo >= 500 ? '#e2e2f0' : s.elo >= 400 ? '#f59e0b' : '#ef4444';
          const eloPct = Math.min(100, Math.max(0, s.elo / 10));
          html += `<tr>
            <td class="num" style="color:#4b5563">${i + 1}</td>
            <td><strong style="color:#e2e2f0">${esc(s.title)}</strong></td>
            <td>${s.genre ? esc(s.genre) : '<span style="color:#4b5563">\u2014</span>'}</td>
            <td class="num" style="color:${eloColor}">${s.elo}
              <div class="elo-bar"><div class="elo-bar-fill" style="width:${eloPct}%;background:${eloColor}"></div></div>
            </td>
            <td>${esc(s.date || '\u2014')}</td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#6b7280;font-size:11px">${s.notes ? esc(s.notes) : ''}</td>
          </tr>`;
        });

        if (q && filtered.length === 0) {
          html += '<tr><td colspan="6" class="empty">No songs match your search</td></tr>';
        }

        html += '</tbody></table></div>';
      }

      html += '</div>';

      el.innerHTML = html;

      // Bind events
      document.getElementById('detail-back')?.addEventListener('click', hideUserDetail);
      document.getElementById('detail-song-search')?.addEventListener('input', (e) => {
        detailSongSearch = e.target.value;
        renderUserDetail();
        const input = document.getElementById('detail-song-search');
        if (input) { input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
      });
      document.getElementById('detail-export')?.addEventListener('click', async () => {
        const btn = document.getElementById('detail-export');
        btn.textContent = 'Exporting...'; btn.disabled = true;
        try {
          const data = await apiFetch(`/api/admin/users/${u.id}/export`);
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'imade-' + u.username.toLowerCase().replace(/[^a-z0-9]/g, '-') + '-' + new Date().toISOString().slice(0, 10) + '.json';
          a.click();
          URL.revokeObjectURL(url);
        } catch (e) { alert('Export failed: ' + e.message); }
        btn.textContent = 'Export Data'; btn.disabled = false;
      });
      document.getElementById('detail-import-input')?.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const label = document.getElementById('detail-import-label');
        label.textContent = 'Importing...';
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (!confirm(`Import data for ${u.username}? This will replace all their existing songs, comparisons, genres, playlists, and listen times.`)) {
            label.innerHTML = 'Import Data<input type="file" accept=".json" id="detail-import-input" style="display:none" />';
            return;
          }
          await apiFetch(`/api/admin/users/${u.id}/import`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          // Reload user data
          delete songCache[u.id];
          users = await apiFetch('/api/admin/users');
          songCache[u.id] = await apiFetch(`/api/admin/users/${u.id}/songs`);
          renderUserDetail();
          alert('Import complete');
        } catch (e) { alert('Import failed: ' + e.message); }
        label.innerHTML = 'Import Data<input type="file" accept=".json" id="detail-import-input" style="display:none" />';
      });
      // Account save
      document.getElementById('detail-save-account')?.addEventListener('click', async () => {
        const btn = document.getElementById('detail-save-account');
        const msgEl = document.getElementById('detail-account-msg');
        const username = document.getElementById('detail-edit-username')?.value.trim();
        const emailVal = document.getElementById('detail-edit-email')?.value.trim();
        const password = document.getElementById('detail-edit-password')?.value.trim();
        const body = {};
        if (username && username !== u.username) body.username = username;
        if (emailVal !== (u.email || '')) body.email = emailVal;
        if (password) body.password = password;
        if (Object.keys(body).length === 0) {
          msgEl.style.display = 'block'; msgEl.style.color = '#6b7280'; msgEl.textContent = 'No changes to save.';
          setTimeout(() => msgEl.style.display = 'none', 2000);
          return;
        }
        btn.disabled = true; btn.textContent = 'Saving...';
        try {
          users = await apiFetch(`/api/admin/users/${u.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          delete emailCache[u.id];
          renderUserDetail();
        } catch (e) {
          msgEl.style.display = 'block'; msgEl.style.color = '#ef4444'; msgEl.textContent = e.message;
          btn.disabled = false; btn.textContent = 'Save';
        }
      });
      // Account delete
      document.getElementById('detail-delete-user')?.addEventListener('click', async () => {
        if (!confirm(`Delete ${u.username} and all their data? This cannot be undone.`)) return;
        try {
          users = await apiFetch(`/api/admin/users/${u.id}`, { method: 'DELETE' });
          delete songCache[u.id];
          delete emailCache[u.id];
          hideUserDetail();
          render();
        } catch (e) { alert(e.message); }
      });
    }

    // ===================== ACTIVITY TAB =====================

    let activityLogs = [];
    let activityTotal = 0;
    let activityOffset = 0;
    let activityFilter = '';
    let activityInitialized = false;

    function initActivity() {
      if (!activityInitialized) {
        activityInitialized = true;
        loadActivity(true);
      }
    }

    async function loadActivity(reset) {
      if (reset) { activityLogs = []; activityOffset = 0; }
      const el = document.getElementById('activity-content');
      if (activityLogs.length === 0) el.innerHTML = '<div class="loading">Loading activity...</div>';
      try {
        const data = await apiFetch(`/api/admin/activity?limit=50&offset=${activityOffset}`);
        if (reset) { activityLogs = data.logs; } else { activityLogs = activityLogs.concat(data.logs); }
        activityTotal = data.total;
        activityOffset = activityLogs.length;
        renderActivity();
      } catch (e) {
        el.innerHTML = `<div class="error">${esc(e.message)}</div>`;
      }
    }

    let expandedActivity = null;

    function formatDateTime(d) {
      if (!d) return '\u2014';
      return new Date(d + 'Z').toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/Chicago' });
    }

    function deviceBadge(ua) {
      if (!ua) return '<span style="color:#4b5563">\u2014</span>';
      const isMobile = /Mobile|Android|iPhone|iPad/i.test(ua);
      return isMobile
        ? '<span style="color:#f59e0b;font-size:10px;font-weight:600">Mobile</span>'
        : '<span style="color:#6b7280;font-size:10px">Desktop</span>';
    }

    function actionBadge(action) {
      const labels = {
        login: 'Login', logout: 'Logout', register: 'Register',
        song_create: 'Upload', song_bulk_upload: 'Upload',
        song_edit: 'Edit Song', song_delete: 'Delete Song',
        username_change: 'Username', password_reset: 'Password Reset',
        password_reset_requested: 'Reset Requested', email_verified: 'Email Verified'
      };
      const label = labels[action] || action;
      return `<span class="action-badge action-badge-${esc(action)}">${esc(label)}</span>`;
    }

    let activitySearch = '';

    function renderActivity() {
      const el = document.getElementById('activity-content');
      const actions = [...new Set(activityLogs.map(l => l.action))].sort();
      let filtered = activityFilter ? activityLogs.filter(l => l.action === activityFilter) : activityLogs;
      if (activitySearch) {
        const q = activitySearch.toLowerCase();
        filtered = filtered.filter(l =>
          (l.username || '').toLowerCase().includes(q) ||
          (l.detail || '').toLowerCase().includes(q) ||
          (l.action || '').toLowerCase().includes(q) ||
          (l.ip || '').includes(q)
        );
      }

      let html = `<div class="activity-toolbar">
        <input class="search-input" id="activity-search" type="search" placeholder="Search activity..." autocomplete="off" value="${esc(activitySearch)}" />
        <select class="activity-filter" id="activity-action-filter">
          <option value="">All actions</option>
          ${actions.map(a => `<option value="${esc(a)}" ${activityFilter === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}
        </select>
        <button class="btn-refresh" id="activity-refresh"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Refresh</button>
        <span style="font-size:11px;color:#4b5563;margin-left:auto">${activityTotal} total events</span>
      </div>`;

      html += '<div class="table-wrap"><table><thead><tr><th>Timestamp</th><th>User</th><th>Action</th><th>Detail</th><th>Device</th><th>IP</th></tr></thead><tbody>';

      // Group consecutive uploads or deletes from the same user within 60s
      const grouped = [];
      for (const log of filtered) {
        const isGroupable = log.action === 'song_create' || log.action === 'song_bulk_upload' || log.action === 'song_delete';
        const prev = grouped[grouped.length - 1];
        if (isGroupable && prev && prev.isGroupable && prev.action === log.action && prev.user_id === log.user_id &&
            Math.abs(new Date(prev.created_at).getTime() - new Date(log.created_at).getTime()) < 60000) {
          prev.entries.push(log);
        } else {
          grouped.push({ ...log, isGroupable, entries: [log] });
        }
      }

      if (grouped.length === 0) {
        html += '<tr><td colspan="6" class="empty">No activity logged yet</td></tr>';
      } else {
        for (const group of grouped) {
          if (group.isGroupable && group.entries.length > 1) {
            const allTitles = [];
            for (const entry of group.entries) {
              const detail = entry.detail || '';
              if (group.action === 'song_delete') {
                if (detail) allTitles.push(detail);
              } else {
                const parts = detail.split(': ');
                if (parts.length > 1) allTitles.push(...parts.slice(1).join(': ').split(', '));
                else if (parts[0]) allTitles.push(parts[0]);
              }
            }
            const count = allTitles.length || group.entries.length;
            const verb = group.action === 'song_delete' ? 'deleted' : 'uploaded';
            const isExpanded = expandedActivity === group.id;
            html += `<tr style="cursor:pointer" data-activity-expand="${group.id}">
              <td>${formatDateTime(group.created_at)}</td>
              <td>${group.username ? '<strong>' + esc(group.username) + '</strong>' : '<span style="color:#4b5563">deleted</span>'}</td>
              <td>${actionBadge(group.action)}</td>
              <td>${verb} ${count} song${count !== 1 ? 's' : ''}</td>
              <td>${deviceBadge(group.ua)}</td>
              <td style="font-family:monospace;font-size:11px;color:#6b7280">${group.ip ? esc(group.ip) : '\u2014'}</td>
            </tr>`;
            if (isExpanded && allTitles.length > 0) {
              html += `<tr><td colspan="6" style="padding:8px 14px 12px;background:#0c0a1a;border-top:none">
                <div style="font-size:12px;color:#6b7280">${allTitles.map(t => '<div style="padding:2px 0;color:#9ca3af">' + esc(t) + '</div>').join('')}</div>
              </td></tr>`;
            }
          } else {
            const log = group;
            html += `<tr>
              <td>${formatDateTime(log.created_at)}</td>
              <td>${log.username ? '<strong>' + esc(log.username) + '</strong>' : '<span style="color:#4b5563">deleted</span>'}</td>
              <td>${actionBadge(log.action)}</td>
              <td>${log.detail ? esc(log.detail) : '<span style="color:#4b5563">\u2014</span>'}</td>
              <td>${deviceBadge(log.ua)}</td>
              <td style="font-family:monospace;font-size:11px;color:#6b7280">${log.ip ? esc(log.ip) : '\u2014'}</td>
            </tr>`;
          }
        }
      }

      html += '</tbody></table></div>';

      if (activityOffset < activityTotal) {
        html += '<button class="btn-load-more" id="activity-load-more">Load More</button>';
      }

      el.innerHTML = html;

      document.getElementById('activity-search')?.addEventListener('input', (e) => {
        activitySearch = e.target.value;
        renderActivity();
      });
      el.querySelectorAll('[data-activity-expand]').forEach(row => {
        row.addEventListener('click', () => {
          const id = parseInt(row.dataset.activityExpand);
          expandedActivity = expandedActivity === id ? null : id;
          renderActivity();
        });
      });
      document.getElementById('activity-action-filter')?.addEventListener('change', (e) => {
        activityFilter = e.target.value;
        renderActivity();
      });
      document.getElementById('activity-refresh')?.addEventListener('click', () => loadActivity(true));
      document.getElementById('activity-load-more')?.addEventListener('click', () => loadActivity(false));
    }

  </script>
</body>
</html>
