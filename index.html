        <h3 style={{margin:"0 0 10px",color:"#e2e8f0",fontSize:18,fontWeight:400,textAlign:"center"}}>{song.title}</h3>
        {song.genre && <div style={{textAlign:"center",marginBottom:10}}><span style={{background:"#4338ca15",color:"#818cf8",padding:"2px 10px",borderRadius:16,fontSize:10,textTransform:"uppercase"}}>{song.genre}</span></div>}
        {song.audioFile && <AudioPlayer src={song.audioFile} compact />}
      </div>
      <button onClick={onPick} disabled={picking}
        style={{width:"100%",marginTop:10,padding:"12px",borderRadius:12,background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",color:"#fff",fontSize:14,cursor:picking?"default":"pointer",fontWeight:600,opacity:picking?0.5:1}}>
        Select
      </button>
    </div>
  );

  const lastComp = comparisons.length > 0 ? comparisons[comparisons.length - 1] : null;

  return (
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginBottom:12}}>
        {lastComp && <button onClick={undoLast} disabled={undoing} style={{background:"none",border:"1px solid #2a2a45",borderRadius:8,padding:"8px 16px",color:"#8a8aa0",fontSize:12,cursor:undoing?"default":"pointer"}}>{undoing?"...":"undo"}</button>}
      </div>
      {currentPair ? (
        <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:12,alignItems:"center"}}>
          {renderCard(currentPair[0], ()=>pick(currentPair[0].id, currentPair[1].id))}
          <div style={{textAlign:"center"}}><span style={{fontSize:24,color:"#f59e0b"}}>vs</span></div>
          {renderCard(currentPair[1], ()=>pick(currentPair[1].id, currentPair[0].id))}
        </div>
      ) : (
        <div style={{textAlign:"center",padding:60}}>
          <div style={{fontSize:36,marginBottom:12}}>✓</div>
          <p style={{color:"#22c55e",fontSize:16}}>All pairs compared!</p>
        </div>
      )}
    </div>
  );
}

// Quick Rate Mode - swipe/tap to rate songs fast
function QuickMode({ songs, standings, compMap, compCount, submitComparison, onRefresh, showToast, stopAudio, onSessionAdvance, sessionMode }) {
  const SESSION_QUICK_LIMIT = 5;
  const [current, setCurrent] = useState(null);
  const [processing, setProcessing] = useState(false);
  const [ratedIds, setRatedIds] = useState(new Set());
  const [sessionDone, setSessionDone] = useState(false);

  const getNextSong = useCallback((rated) => {
    // In session mode, stop after limit
    if (sessionMode && rated.size >= SESSION_QUICK_LIMIT) return null;
    const unrated = standings.filter(s => !rated.has(s.id));
    if (unrated.length === 0) return null;
    const unranked = unrated.filter(s => (compCount[s.id] || 0) < 3);
    // In session mode, only serve unranked songs
    if (sessionMode && unranked.length === 0) return null;
    const pool = unranked.length > 0 ? unranked : unrated;
    return pool[Math.floor(Math.random() * pool.length)];
  }, [standings, compCount, sessionMode]);

  useEffect(() => {
    if (!current && !sessionDone) {
      const next = getNextSong(ratedIds);
      if (next) setCurrent(next);
      else setSessionDone(true);
    }
  }, [current, sessionDone, getNextSong, ratedIds]);

  const rate = async (rating) => {
    if (!current || processing) return;
    setProcessing(true);
    stopAudio();
    const sorted = [...standings].sort((a,b) => b.elo - a.elo);
    const targetPct = rating === "top" ? 0.15 : rating === "good" ? 0.38 : rating === "mid" ? 0.62 : rating === "low" ? 0.82 : 0.95;
    const refIdx = Math.min(sorted.length - 1, Math.floor(sorted.length * targetPct));
    const refSong = sorted[refIdx];
    if (refSong && refSong.id !== current.id) {
      const winner = rating === "top" || rating === "good" ? current.id : refSong.id;
      const loser = winner === current.id ? refSong.id : current.id;
      await submitComparison(winner, loser, "quick");
    }
    await onRefresh();
    const newRated = new Set(ratedIds);
    newRated.add(current.id);
    setRatedIds(newRated);
    const next = getNextSong(newRated);
    if (next) setCurrent(next);
    else { setCurrent(null); setSessionDone(true); }
    setProcessing(false);
  };

  const resetSession = () => {
    setRatedIds(new Set());
    setSessionDone(false);
    setCurrent(null);
  };

  const remaining = standings.filter(s => !ratedIds.has(s.id)).length;
  const unrankedRemaining = standings.filter(s => !ratedIds.has(s.id) && (compCount[s.id] || 0) < 3).length;

  // Auto-advance in session mode when done (deferred to avoid setState-on-unmount)
  useEffect(() => {
    if (sessionDone && sessionMode && onSessionAdvance) {
      const t = setTimeout(onSessionAdvance, 0);
      return () => clearTimeout(t);
    }
  }, [sessionDone, sessionMode, onSessionAdvance]);

  if (sessionDone) {
    if (sessionMode) return <div style={{textAlign:"center",padding:40,color:"#6b7280"}}>Moving on...</div>;

    return (
      <div style={{textAlign:"center",padding:40}}>
        <span style={{fontSize:36}}>✅</span>
        <p style={{color:"#e2e8f0",fontSize:18,fontWeight:600,margin:"12px 0 4px"}}>All songs rated</p>
        <p style={{color:"#6b6b80",fontSize:13,margin:"0 0 16px"}}>You've quick-rated every song.</p>
        <button onClick={resetSession}
          style={{padding:"12px 24px",borderRadius:10,background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer"}}>
          Start fresh round
        </button>
      </div>
    );
  }

  if (!current) return <div style={{textAlign:"center",padding:40,color:"#6b7280"}}>Loading...</div>;

  return (
    <div style={{maxWidth:400,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{color:"#6b6b80",fontSize:11}}>
          {sessionMode
            ? ratedIds.size + "/" + SESSION_QUICK_LIMIT + " this round"
            : (unrankedRemaining > 0 ? unrankedRemaining + " new" : "") + (unrankedRemaining > 0 && remaining > unrankedRemaining ? " · " : "") + (remaining > unrankedRemaining ? (remaining - unrankedRemaining) + " ranked" : "") + " remaining"
          }
        </span>
        <span style={{color:"#6b6b80",fontSize:11}}>{ratedIds.size} rated</span>
      </div>
      <div style={{background:"#14142a",border:"1px solid #2a2a45",borderRadius:16,padding:24,marginBottom:16}}>
        <h3 style={{margin:"0 0 12px",color:"#e2e8f0",fontSize:20,fontWeight:500,textAlign:"center"}}>{current.title}</h3>
        {current.genre && <div style={{textAlign:"center",marginBottom:12}}><span style={{background:"#4338ca15",color:"#818cf8",padding:"3px 12px",borderRadius:16,fontSize:11,textTransform:"uppercase"}}>{current.genre}</span></div>}
        {current.audioFile && <AudioPlayer src={current.audioFile} />}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6}}>
        {[{id:"bad",label:"💀",sub:"Bad",color:"#ef4444"},{id:"low",label:"👎",sub:"Low",color:"#f97316"},{id:"mid",label:"😐",sub:"Mid",color:"#f59e0b"},{id:"good",label:"👍",sub:"Good",color:"#818cf8"},{id:"top",label:"🔥",sub:"Top",color:"#22c55e"}].map(r => (
          <button key={r.id} onClick={()=>rate(r.id)} disabled={processing}
            style={{padding:"12px 4px",borderRadius:10,background:"#0d0d1a",border:"2px solid "+r.color+"40",color:r.color,fontSize:11,fontWeight:600,cursor:processing?"default":"pointer",opacity:processing?0.5:1,transition:"all 0.15s",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor=r.color;e.currentTarget.style.background=r.color+"15"}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor=r.color+"40";e.currentTarget.style.background="#0d0d1a"}}>
            <span style={{fontSize:16}}>{r.label}</span>{r.sub}
          </button>
        ))}
      </div>
    </div>
  );
}

// Tier Sort Mode - drag songs into S/A/B/C/D/E tiers
function TierMode({ songs, standings, compMap, compCount, submitComparison, onRefresh, showToast, onSessionAdvance, sessionMode }) {
  const [pool, setPool] = useState([]);
  const [tiers, setTiers] = useState({ S: [], A: [], B: [], C: [], D: [], E: [] });
  const [submitting, setSubmitting] = useState(false);
  const [usedIds, setUsedIds] = useState(new Set());
  const [sessionDone, setSessionDone] = useState(false);
  const { play, toggle, stop, playingSrc, isPlaying, subscribe } = useGlobalAudio();
  const [, forceAudioUpdate] = useState(0);
  useEffect(() => subscribe(() => forceAudioUpdate(n => n + 1)), [subscribe]);

  const getBatch = useCallback((used) => {
    const available = standings.filter(s => !used.has(s.id));
    if (available.length === 0) return [];
    const unranked = available.filter(s => (compCount[s.id] || 0) < 3);
    // In session mode, only serve unranked songs
    if (sessionMode && unranked.length === 0) return [];
    const source = unranked.length > 0 ? unranked : available;
    const shuffled = [...source].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, Math.min(8, shuffled.length));
  }, [standings, compCount, sessionMode]);

  useEffect(() => {
    const batch = getBatch(usedIds);
    if (batch.length > 0) {
      setPool(batch);
      setTiers({ S: [], A: [], B: [], C: [], D: [], E: [] });
      setSessionDone(false);
    } else {
      setSessionDone(true);
    }
  }, [standings.length]);

  const playSong = (song) => {
    if (!song.audioFile) return;
    toggle(song.audioFile);
  };

  const moveSong = (song, toTier) => {
    setPool(p => p.filter(s => s.id !== song.id));
    Object.keys(tiers).forEach(t => setTiers(prev => ({...prev, [t]: prev[t].filter(s => s.id !== song.id)})));
    if (toTier) setTiers(prev => ({...prev, [toTier]: [...prev[toTier], song]}));
    else setPool(p => [...p, song]);
  };

  const submitTiers = async () => {
    try {
    setSubmitting(true);
    const tierOrder = ["S", "A", "B", "C", "D", "E"];
    const allSorted = tierOrder.flatMap(t => tiers[t]);
    let submitted = 0;
    for (let i = 0; i < allSorted.length; i++) {
      for (let j = i + 1; j < allSorted.length; j++) {
        if (allSorted[i].id === allSorted[j].id) continue;
        const key = [allSorted[i].id, allSorted[j].id].sort().join("|");
        if (!compMap[key]) {
          await submitComparison(allSorted[i].id, allSorted[j].id, "tier");
          submitted++;
        }
      }
    }
    await onRefresh();
    showToast("Generated " + submitted + " comparisons");

    const newUsed = new Set(usedIds);
    [...pool, ...Object.values(tiers).flat()].forEach(s => newUsed.add(s.id));
    setUsedIds(newUsed);

    // In session mode, one batch is enough — advance
    if (sessionMode) {
      setPool([]);
      setTiers({ S: [], A: [], B: [], C: [], D: [], E: [] });
      setSessionDone(true);
      setSubmitting(false);
      return;
    }

    const nextBatch = getBatch(newUsed);
    if (nextBatch.length > 0) {
      setPool(nextBatch);
      setTiers({ S: [], A: [], B: [], C: [], D: [], E: [] });
    } else {
      setPool([]);
      setTiers({ S: [], A: [], B: [], C: [], D: [], E: [] });
      setSessionDone(true);
    }
    setSubmitting(false);
    } catch(err) { console.error("submitTiers error:", err); setSubmitting(false); showToast("Error: " + err.message); }
  };

  const loadNewBatch = () => {
    const newUsed = new Set(usedIds);
    [...pool, ...Object.values(tiers).flat()].forEach(s => newUsed.add(s.id));
    setUsedIds(newUsed);
    stop();
    const batch = getBatch(newUsed);
    if (batch.length > 0) {
      setPool(batch);
      setTiers({ S: [], A: [], B: [], C: [], D: [], E: [] });
    } else {
      setSessionDone(true);
    }
  };

  const resetSession = () => {
    setUsedIds(new Set());
    const batch = getBatch(new Set());
    setPool(batch);
    setTiers({ S: [], A: [], B: [], C: [], D: [], E: [] });
    setSessionDone(false);
  };

  const tierColors = { S: "#22c55e", A: "#818cf8", B: "#3b82f6", C: "#f59e0b", D: "#f97316", E: "#ef4444" };
  const tierLabels = { S: "Best", A: "Great", B: "Good", C: "Meh", D: "Poor", E: "Worst" };
  const totalPlaced = Object.values(tiers).reduce((s, t) => s + t.length, 0);
  const availableCount = standings.filter(s => !usedIds.has(s.id)).length;
  const unrankedCount = standings.filter(s => !usedIds.has(s.id) && (compCount[s.id] || 0) < 3).length;

  // Auto-advance in session mode when done (deferred to avoid setState-on-unmount)
  useEffect(() => {
    if (sessionDone && sessionMode && onSessionAdvance) {
      const t = setTimeout(onSessionAdvance, 0);
      return () => clearTimeout(t);
    }
  }, [sessionDone, sessionMode, onSessionAdvance]);

  if (sessionDone) {
    if (sessionMode) return <div style={{textAlign:"center",padding:40,color:"#6b7280"}}>Moving on...</div>;

    return (
      <div style={{textAlign:"center",padding:40}}>
        <span style={{fontSize:36}}>✅</span>
        <p style={{color:"#e2e8f0",fontSize:18,fontWeight:600,margin:"12px 0 4px"}}>All songs sorted</p>
        <p style={{color:"#6b6b80",fontSize:13,margin:"0 0 16px"}}>Every song has been through tier sort.</p>
        <button onClick={resetSession}
          style={{padding:"12px 24px",borderRadius:10,background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer"}}>
          Start fresh round
        </button>
      </div>
    );
  }

  const renderChip = (s, bgColor, borderColor) => {
    const isChipPlaying = isPlaying && playingSrc === s.audioFile;
    return (
      <div key={s.id} draggable
        onDragStart={e => { e.dataTransfer.setData("songId", s.id); }}
        onClick={e => { e.stopPropagation(); playSong(s); }}
        onDragEnd={e => { e.stopPropagation(); }}
        style={{background:bgColor,border:"1px solid "+borderColor,borderRadius:8,padding:"6px 12px",cursor:s.audioFile?"pointer":"grab",fontSize:12,color:"#e2e8f0",display:"flex",alignItems:"center",gap:6,userSelect:"none",WebkitUserDrag:"element"}}>
        {s.audioFile && <span style={{fontSize:10,opacity:isChipPlaying?1:0.5}}>{isChipPlaying?"⏸":"▶"}</span>}
        {s.title}
      </div>
    );
  };

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{color:"#6b6b80",fontSize:11}}>
          {sessionMode
            ? pool.length + " song" + (pool.length !== 1 ? "s" : "") + " to sort"
            : (availableCount - pool.length) + " remaining" + (unrankedCount > 0 ? " (" + unrankedCount + " new)" : "")
          }
        </span>
      </div>

      <div onDragOver={e=>e.preventDefault()} onDrop={e=>{const id=e.dataTransfer.getData("songId");const song=Object.values(tiers).flat().find(s=>s.id===id);if(song)moveSong(song,null);}}
        style={{background:"#0d0d1a",border:"1px solid #1e1e35",borderRadius:12,padding:12,marginBottom:12,minHeight:60}}>
        <div style={{color:"#5a5a70",fontSize:10,marginBottom:8}}>UNSORTED</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {pool.map(s => renderChip(s, "#14142a", "#2a2a45"))}
        </div>
      </div>

      {Object.entries(tierColors).map(([tier, color]) => (
        <div key={tier} onDragOver={e=>e.preventDefault()} onDrop={e=>{const id=e.dataTransfer.getData("songId");const song=[...pool,...Object.values(tiers).flat()].find(s=>s.id===id);if(song)moveSong(song,tier);}}
          style={{display:"flex",gap:8,alignItems:"stretch",marginBottom:6}}>
          <div style={{width:40,background:color,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:16,flexDirection:"column",gap:0}}>
            <span>{tier}</span>
          </div>
          <div style={{flex:1,background:"#14142a",border:"1px solid #2a2a45",borderRadius:8,padding:8,minHeight:40,display:"flex",flexWrap:"wrap",gap:6,alignContent:"flex-start"}}>
            {tiers[tier].length === 0 && <span style={{color:"#3a3a50",fontSize:10,padding:"4px 8px"}}>{tierLabels[tier]}</span>}
            {tiers[tier].map(s => renderChip(s, color+"20", color+"40"))}
          </div>
        </div>
      ))}
      <button onClick={submitTiers} disabled={pool.length > 0 || totalPlaced < 2 || submitting}
        style={{width:"100%",marginTop:12,padding:"16px",borderRadius:12,background:pool.length===0&&totalPlaced>=2?"linear-gradient(135deg,#4338ca,#6366f1)":"#1a1a2e",border:"none",color:pool.length===0&&totalPlaced>=2?"#fff":"#5a5a70",fontSize:16,fontWeight:700,cursor:pool.length===0&&totalPlaced>=2?"pointer":"default",opacity:submitting?0.5:1,boxShadow:pool.length===0&&totalPlaced>=2?"0 4px 20px rgba(99,102,241,0.3)":"none"}}>
        {submitting ? "Submitting..." : pool.length > 0 ? "Sort all songs to submit" : "Submit (" + totalPlaced + " songs)"}
      </button>
    </div>
  );
}

// Bracket Mode - tournament elimination with visual bracket
function BracketMode({ songs, standings, compMap, submitComparison, onRefresh, showToast, stopAudio, onBracketComplete, bracketSize }) {
  const bSize = bracketSize || 8;
  const [bracket, setBracket] = useState([]);
  const [round, setRound] = useState(0);
  const [matchIdx, setMatchIdx] = useState(0);
  const [winner, setWinner] = useState(null);
  const [processing, setProcessing] = useState(false);
  const [results, setResults] = useState([]);

  const startBracket = useCallback(() => {
    // Prioritize unranked songs, fill remaining slots with ranked songs
    const unranked = standings.filter(s => s.totalComparisons < 3);
    const ranked = standings.filter(s => s.totalComparisons >= 3);
    let pool = [];
    if (unranked.length >= bSize) {
      pool = [...unranked].sort(() => Math.random() - 0.5).slice(0, bSize);
    } else if (unranked.length > 0) {
      const shuffledRanked = [...ranked].sort(() => Math.random() - 0.5);
      pool = [...unranked, ...shuffledRanked.slice(0, bSize - unranked.length)];
      pool.sort(() => Math.random() - 0.5);
    } else {
      pool = [...ranked].sort(() => Math.random() - 0.5).slice(0, bSize);
    }
    // Ensure pool is a power of 2 (trim if needed)
    const validSize = [4, 8, 16].filter(n => n <= pool.length).pop() || 4;
    pool = pool.slice(0, validSize);
    setBracket([pool]);
    setRound(0);
    setMatchIdx(0);
    setWinner(null);
    setResults([]);
  }, [standings, bSize]);

  useEffect(() => { if (bracket.length === 0) startBracket(); }, [startBracket]);

  const currentRound = bracket[round] || [];
  const match = currentRound.length >= 2 ? [currentRound[matchIdx * 2], currentRound[matchIdx * 2 + 1]] : null;
  const matchesInRound = Math.floor(currentRound.length / 2);

  const pick = async (winnerId) => {
    if (!match || processing) return;
    setProcessing(true);
    stopAudio();
    const loserId = match[0].id === winnerId ? match[1].id : match[0].id;
    // Don't rotate mode during bracket - pass false
    await submitComparison(winnerId, loserId, "bracket");
    await onRefresh();

    const winnerSong = match.find(s => s.id === winnerId);
    setResults(r => [...r, { round, match: matchIdx, winner: winnerSong, loser: match.find(s => s.id === loserId) }]);

    const nextRound = bracket[round + 1] || [];
    const newBracket = [...bracket];
    newBracket[round + 1] = [...nextRound, winnerSong];
    setBracket(newBracket);

    if (matchIdx + 1 < matchesInRound) {
      setMatchIdx(matchIdx + 1);
    } else if (newBracket[round + 1].length >= 2) {
      setRound(round + 1);
      setMatchIdx(0);
    } else {
      setWinner(winnerSong);
      // Bracket complete - now rotate mode
      if (onBracketComplete) onBracketComplete();
    }
    setProcessing(false);
  };

  const initial = bracket[0] || [];
  const actualSize = initial.length;
  const numRounds = Math.log2(actualSize) || 0;
  const roundLabels = actualSize === 4 ? ["Semis", "Final"]
    : actualSize === 8 ? ["Quarters", "Semis", "Final"]
    : actualSize === 16 ? ["R1", "Quarters", "Semis", "Final"]
    : ["Round"];

  // Generic visual bracket display
  const BracketVisual = () => {
    if (actualSize < 4) return null;
    // Match box height: ~44px (6+3+11+3+11+6 padding + 2 lines + border)
    const matchH = 46;
    const firstRoundGap = 8;
    // Total height driven by first round
    const firstRoundMatches = actualSize / 2;
    const totalH = firstRoundMatches * matchH + (firstRoundMatches - 1) * firstRoundGap;

    const MatchBox = ({ s1, s2, res, isActive }) => (
      <div style={{padding:"6px 8px",background:"#14142a",borderRadius:6,border:isActive?"2px solid #f59e0b":"1px solid #2a2a45",height:matchH,boxSizing:"border-box",display:"flex",flexDirection:"column",justifyContent:"center"}}>
        <div style={{color:res?.winner?.id===s1?.id?"#22c55e":res?.loser?.id===s1?.id?"#ef4444":s1?"#c0c0d0":"#3a3a50",fontSize:11,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",marginBottom:3,lineHeight:"14px"}}>{s1?.title||"—"}</div>
        <div style={{color:res?.winner?.id===s2?.id?"#22c55e":res?.loser?.id===s2?.id?"#ef4444":s2?"#c0c0d0":"#3a3a50",fontSize:11,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",lineHeight:"14px"}}>{s2?.title||"—"}</div>
      </div>
    );

    return (
    <div style={{background:"#0d0d1a",borderRadius:12,padding:16,marginBottom:20,border:"1px solid #1e1e35",overflowX:"auto"}}>
      <div style={{display:"flex",gap:6,minWidth:actualSize > 8 ? 700 : undefined}}>
        {Array.from({ length: numRounds }, (_, r) => {
          const matchesThisRound = actualSize / Math.pow(2, r + 1);
          const advancers = bracket[r] || [];
          return (
            <div key={r} style={{flex:1,minWidth:0,display:"flex",flexDirection:"column"}}>
              <div style={{color:"#5a5a70",fontSize:10,marginBottom:6,fontWeight:600,textAlign:"center"}}>{roundLabels[r] || ("R" + (r+1))}</div>
              <div style={{display:"flex",flexDirection:"column",justifyContent:"space-around",height:totalH}}>
                {Array.from({ length: matchesThisRound }, (_, m) => {
                  const s1 = advancers[m * 2], s2 = advancers[m * 2 + 1];
                  const res = results.find(x => x.round === r && x.match === m);
                  const isActive = round === r && matchIdx === m && !winner;
                  return <MatchBox key={m} s1={s1} s2={s2} res={res} isActive={isActive} />;
                })}
              </div>
            </div>
          );
        })}
        {/* Champion */}
        <div style={{flex:0.7,minWidth:0,display:"flex",flexDirection:"column"}}>
          <div style={{color:"#5a5a70",fontSize:10,marginBottom:6,fontWeight:600,textAlign:"center"}}>🏆</div>
          <div style={{display:"flex",flexDirection:"column",justifyContent:"center",height:totalH}}>
            <div style={{padding:"6px 8px",background:winner?"#f59e0b20":"#14142a",borderRadius:6,border:winner?"2px solid #f59e0b":"1px solid #2a2a45",textAlign:"center"}}>
              <div style={{color:winner?"#f59e0b":"#3a3a50",fontSize:12,fontWeight:700}}>{winner?.title||"?"}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    );
  };

  const renderCard = (song, onPick) => (
    <div>
      <div style={{background:"#14142a",border:"1px solid #2a2a45",borderRadius:16,padding:20}}>
        <h3 style={{margin:"0 0 10px",color:"#e2e8f0",fontSize:18,fontWeight:400,textAlign:"center"}}>{song.title}</h3>
        {song.genre && <div style={{textAlign:"center",marginBottom:10}}><span style={{background:"#4338ca15",color:"#818cf8",padding:"2px 10px",borderRadius:16,fontSize:10,textTransform:"uppercase"}}>{song.genre}</span></div>}
        {song.audioFile && <AudioPlayer src={song.audioFile} compact />}
      </div>
      <button onClick={onPick} disabled={processing}
        style={{width:"100%",marginTop:10,padding:"12px",borderRadius:12,background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",color:"#fff",fontSize:14,cursor:processing?"default":"pointer",fontWeight:600,opacity:processing?0.5:1}}>
        Select
      </button>
    </div>
  );

  if (winner) {
    const bracketComparisons = actualSize - 1;
    return (
      <div>
        <BracketVisual />
        <div style={{textAlign:"center",padding:20}}>
          <div style={{fontSize:48,marginBottom:16}}>🏆</div>
          <h3 style={{color:"#f59e0b",fontSize:20,marginBottom:8}}>{winner.title}</h3>
          <p style={{color:"#8a8aa0",fontSize:14,marginBottom:8}}>Tournament Champion!</p>
          <p style={{color:"#6b6b80",fontSize:12,marginBottom:24}}>≈ {bracketComparisons} classic comparisons</p>
          <button onClick={startBracket} style={{background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",borderRadius:10,padding:"12px 24px",color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer"}}>New Bracket</button>
        </div>
      </div>
    );
  }

  if (!match) return <div style={{textAlign:"center",padding:40,color:"#6b7280"}}>Loading bracket...</div>;

  return (
    <div>
      <BracketVisual />
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <span style={{color:"#f59e0b",fontSize:13,fontWeight:600}}>{roundLabels[round] || ("Round " + (round+1))} — Match {matchIdx + 1}/{matchesInRound}</span>
        <button onClick={startBracket} style={{background:"none",border:"1px solid #2a2a45",borderRadius:8,padding:"6px 12px",color:"#6b7280",fontSize:11,cursor:"pointer"}}>restart</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:12,alignItems:"center"}}>
        {renderCard(match[0], ()=>pick(match[0].id))}
        <div style={{textAlign:"center",padding:"0 4px"}}><span style={{fontSize:24,color:"#f59e0b"}}>vs</span></div>
        {renderCard(match[1], ()=>pick(match[1].id))}
      </div>
    </div>
  );
}

// ========== TAB: Rankings (drag to reorder) ==========
function RankingsTab({ songs, comparisons, onRefresh, showToast, lastUpdateCompCount, setLastUpdateCompCount, setPlayerQueue, setPlayerQueueIdx, switchTab, showVariance, showWinLoss, rowDensity }) {
  const ranking = useRanking(songs, comparisons);
  const tournament = ranking; // alias for compatibility
  const [filterGenre, setFilterGenre] = useState("All");
  const [dragId, setDragId] = useState(null);
  const [dragOverIdx, setDragOverIdx] = useState(null);
  const [saving, setSaving] = useState(false);
  const { play } = useGlobalAudio();
  const [searchQuery, setSearchQuery] = useState("");
  const [propagating, setPropagating] = useState(false);
  const dragMouseY = useRef(0);
  const scrollIntervalRef = useRef(null);

  const startAutoScroll = () => {
    if (scrollIntervalRef.current) return;
    const trackMouse = (e) => { dragMouseY.current = e.clientY; };
    document.addEventListener("dragover", trackMouse);
    scrollIntervalRef.current = setInterval(() => {
      const y = dragMouseY.current;
      const threshold = 120;
      const maxSpeed = 20;
      if (y < threshold) {
        const speed = maxSpeed * (1 - y / threshold);
        window.scrollBy(0, -speed);
      } else if (y > window.innerHeight - threshold) {
        const speed = maxSpeed * (1 - (window.innerHeight - y) / threshold);
        window.scrollBy(0, speed);
      }
    }, 16);
    scrollIntervalRef.current._trackMouse = trackMouse;
  };

  const stopAutoScroll = () => {
    if (scrollIntervalRef.current) {
      if (scrollIntervalRef.current._trackMouse) document.removeEventListener("dragover", scrollIntervalRef.current._trackMouse);
      clearInterval(scrollIntervalRef.current);
      scrollIntervalRef.current = null;
    }
  };

  const handleDragStart = (songId) => { setDragId(songId); startAutoScroll(); };
  const handleDragOver = (e, idx) => { e.preventDefault(); setDragOverIdx(idx); dragMouseY.current = e.clientY; };
  const handleDragEnd = () => { setDragId(null); setDragOverIdx(null); stopAutoScroll(); };

  useEffect(() => () => stopAutoScroll(), []);

  // Propagation: retroactively adjust ratings based on how opponents have changed
  const runPropagation = async () => {
    if (!ranking.eloSnapshots || ranking.eloSnapshots.length === 0) return;
    setPropagating(true);

    const PROP_RATE = 0.15;
    const finalElo = ranking.finalElo;
    const adjustments = {};

    // For each comparison, check how much the opponent's final elo differs
    // from their elo at the time of that comparison
    ranking.eloSnapshots.forEach(snap => {
      const { songA, songB, winner, eloA, eloB } = snap;
      const loser = winner === songA ? songB : songA;

      // How much has the loser's elo changed since this comparison?
      const loserEloAtTime = winner === songA ? eloB : eloA;
      const loserEloNow = finalElo[loser] || 500;
      const loserDelta = loserEloNow - loserEloAtTime;

      // How much has the winner's elo changed since this comparison?
      const winnerEloAtTime = winner === songA ? eloA : eloB;
      const winnerEloNow = finalElo[winner] || 500;
      const winnerDelta = winnerEloNow - winnerEloAtTime;

      // Winner: if the loser turned out stronger (rose), the win is worth more → boost
      // if the loser turned out weaker (dropped), the win is worth less → penalty
      adjustments[winner] = (adjustments[winner] || 0) + loserDelta * PROP_RATE;

      // Loser: if the winner turned out stronger (rose), the loss is less bad → boost
      // if the winner turned out weaker (dropped), the loss is worse → penalty
      adjustments[loser] = (adjustments[loser] || 0) + winnerDelta * PROP_RATE;
    });

    // Apply adjustments by saving as baseElo offsets
    const saves = [];
    for (const [songId, adj] of Object.entries(adjustments)) {
      if (Math.abs(adj) < 0.5) continue;
      const song = songs.find(s => s.id === songId);
      if (!song) continue;
      const currentElo = finalElo[songId] || 500;
      const newElo = Math.round(currentElo + adj);
      const fd = new FormData();
      fd.append("baseElo", String(newElo));
      saves.push(api.put("/api/songs/" + songId, fd));
    }

    await Promise.all(saves);
    await onRefresh();
    setPropagating(false);
    setLastUpdateCompCount(comparisons.length);

    // Count how many were affected
    const affected = Object.values(adjustments).filter(a => Math.abs(a) >= 0.5).length;
    const avgShift = affected > 0 ? Math.round(Object.values(adjustments).reduce((s, a) => s + Math.abs(a), 0) / affected) : 0;
    showToast("Updated " + affected + " songs (avg ±" + avgShift + " Elo)");
  };

  const handleDrop = async (e, dropIdx) => {
    e.preventDefault();
    if (!dragId || saving) { handleDragEnd(); return; }
    const dragStanding = tournament.standings.find(s => s.id === dragId);
    if (!dragStanding) { handleDragEnd(); return; }
    const dragCurrentIdx = filtered.findIndex(s => s.id === dragId);
    if (dragCurrentIdx === -1 || dragCurrentIdx === dropIdx || dragCurrentIdx === dropIdx - 1) { handleDragEnd(); return; }

    // Insert between dropIdx-1 and dropIdx
    let targetElo;
    const above = dropIdx > 0 ? filtered[dropIdx - 1] : null;
    const below = dropIdx < filtered.length ? filtered[dropIdx] : null;
    const realAbove = above && above.id === dragId ? (dropIdx > 1 ? filtered[dropIdx - 2] : null) : above;
    const realBelow = below && below.id === dragId ? (dropIdx + 1 < filtered.length ? filtered[dropIdx + 1] : null) : below;

    if (realAbove && realBelow) {
      targetElo = Math.round((realAbove.elo + realBelow.elo) / 2);
    } else if (realAbove) {
      targetElo = realAbove.elo - 15;
    } else if (realBelow) {
      targetElo = realBelow.elo + 15;
    } else {
      handleDragEnd(); return;
    }

    setSaving(true);

    // Determine which songs were passed and nudge their Elo
    const movedUp = dropIdx < dragCurrentIdx; // dragged to a higher rank (lower index)
    const passedStart = movedUp ? dropIdx : dragCurrentIdx + 1;
    const passedEnd = movedUp ? dragCurrentIdx : dropIdx;
    const passedSongs = filtered.slice(passedStart, passedEnd).filter(s => s.id !== dragId);

    // Nudge: 3 Elo per passed song, in the opposite direction of the drag
    const nudge = movedUp ? -3 : 3;
    const updates = [];
    for (const ps of passedSongs) {
      const newElo = Math.max(0, Math.min(1000, ps.elo + nudge));
      if (newElo !== ps.elo) {
        const fd = new FormData();
        fd.append("baseElo", String(newElo));
        updates.push(api.put("/api/songs/" + ps.id, fd));
      }
    }

    // Update dragged song
    const fd = new FormData();
    fd.append("baseElo", String(targetElo));
    updates.push(api.put("/api/songs/" + dragId, fd));

    await Promise.all(updates);
    await onRefresh();
    setSaving(false);
    handleDragEnd();
  };

  if (comparisons.length === 0) return (
    <div style={{textAlign:"center",padding:80}}>
      <p style={{color:"#6b7280",fontSize:18}}>No comparisons yet</p>
      <p style={{color:"#6b6b80",fontSize:14,marginTop:4}}>Head to Compare to start ranking your songs</p>
    </div>
  );

  const hasNoGenreSongs = songs.some(s => !s.genre);
  const usedGenres = ["All", ...(hasNoGenreSongs ? ["No Genre"] : []), ...new Set(songs.map(s=>s.genre).filter(Boolean))];
  const allFiltered = filterGenre === "All" ? tournament.standings 
    : filterGenre === "No Genre" ? tournament.standings.filter(s => !s.genre)
    : tournament.standings.filter(s => s.genre === filterGenre);
  const filtered = allFiltered.filter(s => s.totalComparisons > 0);
  const unrankedInFilter = allFiltered.filter(s => s.totalComparisons === 0).length;
  const now = Date.now();
  const getStaleDays = (ts) => ts ? Math.floor((now - ts) / 86400000) : Infinity;
  const unrankedCount = tournament.unrankedCount || 0;

  const renderRankRow = (s, i) => {
    const isDragging = dragId === s.id;
    const showInsertAbove = dragOverIdx === i && dragId && dragId !== s.id;
    const staleDays = getStaleDays(s.lastComparedAt);
    const isStale = staleDays > 14;
    return (
      <div key={s.id} id={"rank-" + s.id} style={{position:"relative"}}>
        {showInsertAbove && (
          <div style={{position:"absolute",top:-2,left:0,right:0,height:3,background:"#818cf8",borderRadius:2,zIndex:5,boxShadow:"0 0 8px rgba(129,140,248,0.5)"}} />
        )}
        <div draggable onDragStart={()=>handleDragStart(s.id)} onDragOver={e=>handleDragOver(e,i)} onDrop={e=>handleDrop(e,i)} onDragEnd={handleDragEnd}
          style={{background:isDragging?"#1c1c3a":"#14142a",border:"1px solid #1e1e35",borderRadius:rowDensity==="compact"?6:10,padding:rowDensity==="compact"?"4px 10px":"10px 14px",opacity:isDragging?0.3:1,cursor:"grab",display:"flex",flexDirection:"column",gap:rowDensity==="compact"?2:6,transition:"opacity 0.15s"}}>
          <div style={{display:"flex",alignItems:"center",gap:rowDensity==="compact"?6:8}}>
            <span style={{color:"#2a2a40",fontSize:rowDensity==="compact"?10:12,cursor:"grab",flexShrink:0,userSelect:"none",letterSpacing:1}}>⋮⋮</span>
            <span style={{fontSize:rowDensity==="compact"?11:13,color:i+1<=3?"#f59e0b":"#6b6b80",fontWeight:700,minWidth:rowDensity==="compact"?22:28,textAlign:"right"}}>{i+1}</span>
            <span style={{flex:1,color:"#e2e8f0",fontSize:rowDensity==="compact"?12:14,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.title}</span>
            {s.genre && <span style={{color:"#818cf8",fontSize:rowDensity==="compact"?9:10,textTransform:"uppercase",letterSpacing:"0.05em",flexShrink:0,background:"#4338ca15",padding:rowDensity==="compact"?"1px 6px":"2px 8px",borderRadius:8}}>{s.genre}</span>}
            {isStale && <span title={staleDays+" days since last comparison"} style={{color:"#f59e0b",fontSize:9,flexShrink:0}}>stale</span>}
            <span style={{color:"#818cf8",fontSize:rowDensity==="compact"?10:11,fontWeight:600,flexShrink:0}}>{s.elo}{showVariance && s.eloMin !== s.eloMax && <span style={{color:"#5a5a70",fontSize:9,fontWeight:400}}> ±{Math.round((s.eloMax - s.eloMin) / 10)}</span>}</span>
            {showWinLoss && <span style={{color:"#5a5a70",fontSize:rowDensity==="compact"?9:10,flexShrink:0}}>{s.wins}W {s.losses}L</span>}
          </div>
          {rowDensity !== "compact" && s.audioFile && <AudioPlayer src={s.audioFile} compact />}
        </div>
      </div>
    );
  };

  return (
    <div>
      {unrankedCount > 0 && (
        <div onClick={()=>switchTab("battle")} style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,padding:"12px 16px",background:"#1a1525",border:"1px solid #2a2a45",borderRadius:10,cursor:"pointer",transition:"border-color 0.2s"}}
          onMouseEnter={e=>e.currentTarget.style.borderColor="#f59e0b"} onMouseLeave={e=>e.currentTarget.style.borderColor="#2a2a45"}>
          <span style={{color:"#f59e0b",fontSize:28,fontWeight:700,lineHeight:1}}>{unrankedCount}</span>
          <span style={{color:"#6b7280",fontSize:13}}>song{unrankedCount!==1?"s":""} not yet ranked</span>
          <span style={{color:"#818cf8",fontSize:11,marginLeft:4}}>rank now →</span>
        </div>
      )}

      {/* Auto-propagate every 10 comparisons */}
      {(() => {
        const compsSinceUpdate = comparisons.length - lastUpdateCompCount;
        React.useEffect(() => {
          if (compsSinceUpdate >= 10 && !propagating && comparisons.length > 0) {
            runPropagation();
          }
        }, [compsSinceUpdate]);
        return null;
      })()}

      <div style={{display:"flex",gap:16,alignItems:"flex-start"}}>
        {/* Sidebar */}
        <div style={{position:"sticky",top:80,width:170,flexShrink:0,display:"flex",flexDirection:"column",gap:10,paddingTop:8,zIndex:10}}>
          <div style={{position:"relative"}}>
            <span style={{position:"absolute",left:10,top:10,color:"#6b6b80",fontSize:12,pointerEvents:"none",zIndex:1}}>⌕</span>
            <input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="search..."
              style={{width:"100%",background:"#14142a",border:"1px solid #2a2a45",borderRadius:10,padding:"9px 10px 9px 28px",color:"#e2e8f0",fontSize:12,outline:"none",transition:"border-color 0.2s, box-shadow 0.2s"}}
              onFocus={e=>{e.target.style.borderColor="#4338ca";e.target.style.boxShadow="0 0 0 3px rgba(67,56,202,0.15)"}}
              onBlur={e=>{e.target.style.borderColor="#2a2a45";e.target.style.boxShadow="none"}} />
          </div>

          <div style={{color:"#8a8aa0",fontSize:10,textTransform:"uppercase",letterSpacing:"0.06em",marginTop:4}}>Genre</div>
          <select value={filterGenre} onChange={e=>setFilterGenre(e.target.value)} style={{background:filterGenre !== "All" ? "#4338ca20" : "#14142a",border:"1px solid "+(filterGenre !== "All" ? "#818cf8" : "#2a2a45"),borderRadius:10,padding:"9px 10px",color:filterGenre !== "All" ? "#818cf8" : "#e2e8f0",fontSize:12,cursor:"pointer",appearance:"none",width:"100%",fontWeight:filterGenre !== "All" ? 600 : 400}}>
            {usedGenres.map(g=><option key={g} value={g}>{g==="All"?"Any":g==="No Genre"?"No genre":g}</option>)}
          </select>

          {saving && <span style={{color:"#818cf8",fontSize:11,marginTop:8}}>saving...</span>}
          <div style={{color:"#5a5a70",fontSize:10,marginTop:4}}>{filtered.length} song{filtered.length !== 1 ? "s" : ""}</div>
        </div>

        {/* Song list */}
        <div style={{flex:1,minWidth:0}}>
          {/* Action bar */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",marginBottom:10,gap:6}}>
            <button onClick={() => {
              const playable = filtered.filter(s => s.audioFile);
              if (playable.length === 0) return;
              const shuffled = [...playable].sort(() => Math.random() - 0.5);
              setPlayerQueue(shuffled);
              setPlayerQueueIdx(0);
              play(shuffled[0].audioFile);
              switchTab("player");
            }}
              style={{background:"none",border:"1px solid #2a2a45",borderRadius:8,padding:"6px 12px",color:"#8a8aa0",fontSize:11,cursor:"pointer"}}
              onMouseEnter={e=>e.target.style.borderColor="#4338ca"} onMouseLeave={e=>e.target.style.borderColor="#2a2a45"}>
              shuffle
            </button>
            <button onClick={() => {
              const playable = filtered.filter(s => s.audioFile);
              if (playable.length === 0) return;
              setPlayerQueue([...playable]);
              setPlayerQueueIdx(0);
              play(playable[0].audioFile);
              switchTab("player");
            }}
              style={{background:"none",border:"1px solid #2a2a45",borderRadius:8,padding:"6px 12px",color:"#8a8aa0",fontSize:11,cursor:"pointer"}}
              onMouseEnter={e=>e.target.style.borderColor="#4338ca"} onMouseLeave={e=>e.target.style.borderColor="#2a2a45"}>
              ▶ play
            </button>
          </div>
          {/* Search results dropdown */}
          {searchQuery && (() => {
            const q = searchQuery.toLowerCase();
            const matches = filtered.map((s, i) => ({ s, rank: i + 1 })).filter(({ s }) => s.title.toLowerCase().includes(q));
            if (matches.length === 0) return <div style={{color:"#6b6b80",fontSize:12,padding:"8px 0",marginBottom:8}}>No matches</div>;
            return (
              <div style={{background:"#14142a",border:"1px solid #1e1e35",borderRadius:8,marginBottom:12,maxHeight:200,overflowY:"auto"}}>
                {matches.slice(0, 10).map(({ s, rank }) => (
                  <div key={s.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderBottom:"1px solid #1e1e35",cursor:"pointer"}}
                    onClick={() => { setSearchQuery(""); const el = document.getElementById("rank-" + s.id); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); }}
                    onMouseEnter={e=>e.currentTarget.style.background="#1e1e35"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <span style={{color:rank<=3?"#f59e0b":"#6b6b80",fontWeight:700,fontSize:13,minWidth:28,textAlign:"right"}}>#{rank}</span>
                    <span style={{flex:1,color:"#e2e8f0",fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.title}</span>
                    {s.genre && <span style={{color:"#818cf8",fontSize:9,textTransform:"uppercase"}}>{s.genre}</span>}
                    <span style={{color:"#818cf8",fontSize:11,fontWeight:600}}>{s.elo}</span>
                  </div>
                ))}
                {matches.length > 10 && <div style={{color:"#6b6b80",fontSize:11,padding:"6px 12px"}}>+{matches.length - 10} more</div>}
              </div>
            );
          })()}

          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {filtered.map((s, i) => renderRankRow(s, i))}
          </div>
          <ScrollToTop />
        </div>
      </div>
    </div>
  );
}

// ========== TAB: Stats ==========
function StatsTab({ songs, comparisons, listenTimes, onStartFocusedSession, setPlayerQueue, setPlayerQueueIdx, switchTab }) {
  const ranking = useRanking(songs, comparisons);
  const { standings } = ranking;
  const tournament = ranking; // alias
  const [statsSubTab, setStatsSubTab] = useState("improvement");
  const chartRef = useRef(null);
  const chartAudio = useGlobalAudio();
  const [chartZoom, setChartZoom] = useState(1);
  const [chartPan, setChartPan] = useState(0);
  const [chartTooltip, setChartTooltip] = useState(null);
  const [showFitLine, setShowFitLine] = useState(false);
  const [chartGenre, setChartGenre] = useState("");
  const [hoveredBucket, setHoveredBucket] = useState(null);
  const chartPointsRef = useRef([]);
  const fitLineRef = useRef(null);
  const chartViewRef = useRef({ fullMinDate: 0, fullMaxDate: 1, pad: { left: 50, right: 20 }, plotW: 100 });

  // Chart drag selection
  const [dragStart, setDragStart] = useState(null);
  const [dragEnd, setDragEnd] = useState(null);
  const [selectedSongs, setSelectedSongs] = useState(null);
  const [isDragging, setIsDragging] = useState(false);
  const isDraggingRef = useRef(false);
  const dragStartRef = useRef(null);

  // Non-passive wheel handler to prevent page scroll and zoom toward cursor
  useEffect(() => {
    const canvas = chartRef.current;
    if (!canvas) return;
    const handler = (e) => {
      e.preventDefault();
      e.stopPropagation();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const view = chartViewRef.current;

      if (e.shiftKey) {
        // Shift+scroll = pan
        setChartPan(p => Math.max(0, Math.min(1, p + e.deltaY * 0.002)));
      } else {
        // Scroll = zoom toward cursor
        const zoomIn = e.deltaY < 0;
        const factor = zoomIn ? 1.18 : 0.85;

        // Where is the cursor in the date range? (0..1 within plot area)
        const cursorFrac = Math.max(0, Math.min(1, (mx - view.pad.left) / view.plotW));

        setChartZoom(oldZoom => {
          const newZoom = Math.max(1, Math.min(20, oldZoom * factor));
          if (newZoom === 1) { setChartPan(0); return 1; }
          // Adjust pan so the date under cursor stays in place
          const oldVisibleFrac = 1 / oldZoom;
          const newVisibleFrac = 1 / newZoom;
          setChartPan(oldPan => {
            const oldStart = oldZoom > 1 ? oldPan * (1 - oldVisibleFrac) : 0;
            const cursorDateFrac = oldStart + cursorFrac * oldVisibleFrac;
            const newStart = cursorDateFrac - cursorFrac * newVisibleFrac;
            const maxStart = 1 - newVisibleFrac;
            return maxStart > 0 ? Math.max(0, Math.min(1, newStart / maxStart)) : 0;
          });
          return newZoom;
        });
      }
    };
    canvas.addEventListener("wheel", handler, { passive: false });
    return () => canvas.removeEventListener("wheel", handler);
  }, [stats]);

  const stats = useMemo(() => {
    if (comparisons.length === 0) return null;

    // Genre distribution
    const genreCounts = {};
    songs.forEach(s => { const g = s.genre || "untagged"; genreCounts[g] = (genreCounts[g] || 0) + 1; });

    // Average Elo by genre
    const genreElo = {};
    const genreEloCount = {};
    standings.forEach(s => {
      const g = s.genre || "untagged";
      genreElo[g] = (genreElo[g] || 0) + s.elo;
      genreEloCount[g] = (genreEloCount[g] || 0) + 1;
    });
    const avgEloByGenre = Object.keys(genreElo).map(g => ({
      genre: g, avgElo: Math.round(genreElo[g] / genreEloCount[g]), count: genreEloCount[g],
    })).sort((a, b) => b.avgElo - a.avgElo);


    // Date vs Elo data points (all songs with dates)
    const dateEloPoints = standings
      .filter(s => s.date)
      .map(s => ({ id: s.id, date: s.date, elo: s.elo, title: s.title, genre: s.genre || "untagged", wins: s.wins, losses: s.losses, audioFile: s.audioFile || null, totalComparisons: s.totalComparisons }))
      .sort((a, b) => a.date.localeCompare(b.date));

    // All genres with colors for the legend — stable hash-based colors
    const allChartGenres = [...new Set(dateEloPoints.map(p => p.genre))].sort();
    const colorPalette = ["#818cf8","#f59e0b","#22c55e","#ef4444","#06b6d4","#ec4899","#8b5cf6","#f97316","#14b8a6","#64748b","#a3e635","#fb7185"];
    const genreColorMap = {};
    const hashStr = (s) => { let h = 0; for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; } return Math.abs(h); };
    allChartGenres.forEach(g => genreColorMap[g] = colorPalette[hashStr(g) % colorPalette.length]);

    return { genreCounts, avgEloByGenre, dateEloPoints, allChartGenres, genreColorMap };
  }, [songs, comparisons, standings]);

  // Draw the date-vs-elo chart on canvas
  useEffect(() => {
    if (!stats || !chartRef.current || stats.dateEloPoints.length === 0) return;
    const canvas = chartRef.current;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    const W = rect.width;
    const H = rect.height;

    const pad = { top: 20, right: 20, bottom: 50, left: 50 };
    const plotW = W - pad.left - pad.right;
    const plotH = H - pad.top - pad.bottom;

    const allPts = stats.dateEloPoints;
    const pts = chartGenre ? allPts.filter(p => p.genre === chartGenre) : allPts;
    if (allPts.length === 0) { ctx.fillStyle = "#14142a"; ctx.fillRect(0,0,W,H); ctx.fillStyle = "#6b6b80"; ctx.font = "13px sans-serif"; ctx.textAlign = "center"; ctx.fillText("No data yet", W/2, H/2); return; }
    if (pts.length === 0) { ctx.fillStyle = "#14142a"; ctx.fillRect(0,0,W,H); ctx.fillStyle = "#6b6b80"; ctx.font = "13px sans-serif"; ctx.textAlign = "center"; ctx.fillText("No songs in this genre", W/2, H/2); return; }
    // Use ALL points for consistent axis ranges
    const allDates = allPts.map(p => new Date(p.date).getTime());
    const rawMinDate = Math.min(...allDates);
    const rawMaxDate = Math.max(...allDates);
    const ONE_MONTH = 30 * 24 * 60 * 60 * 1000;
    const fullMinDate = rawMinDate - ONE_MONTH;
    const fullMaxDate = rawMaxDate + ONE_MONTH;
    const fullRange = fullMaxDate - fullMinDate || 1;

    // Y-axis range based on first and last ranked songs' Elo
    const sortedByElo = [...standings].sort((a, b) => a.elo - b.elo);
    const lowestSongElo = sortedByElo.length > 0 ? sortedByElo[0].elo : 400;
    const highestSongElo = sortedByElo.length > 0 ? sortedByElo[sortedByElo.length - 1].elo : 600;
    const eloPadding = Math.max(20, Math.round((highestSongElo - lowestSongElo) * 0.08));
    const globalMinElo = lowestSongElo - eloPadding;
    const globalMaxElo = highestSongElo + eloPadding;

    // Store view params for wheel handler
    chartViewRef.current = { fullMinDate, fullMaxDate, pad, plotW };

    // Apply zoom: visible window is 1/zoom of total range
    const visibleRange = fullRange / chartZoom;
    const maxPan = fullRange - visibleRange;
    const panOffset = maxPan * chartPan;
    const minDate = fullMinDate + panOffset;
    const maxDate = minDate + visibleRange;

    const visiblePts = pts.filter(p => {
      const t = new Date(p.date).getTime();
      return t >= minDate && t <= maxDate;
    });

    // Use global Elo range for consistent y-axis
    const minElo = globalMinElo;
    const maxElo = globalMaxElo;
    const dateRange = maxDate - minDate || 1;
    const eloRange = maxElo - minElo || 1;

    // Background
    ctx.fillStyle = "#14142a";
    ctx.fillRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = "#1e1e35";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = pad.top + (plotH / 4) * i;
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
      const eloLabel = Math.round(maxElo - (eloRange / 4) * i);
      ctx.fillStyle = "#6b6b80";
      ctx.font = "10px -apple-system, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(eloLabel, pad.left - 8, y + 4);
    }

    // X axis labels — years only at zoom=1, months when zoomed, dates when very zoomed
    ctx.fillStyle = "#6b6b80";
    ctx.font = "10px -apple-system, sans-serif";
    ctx.textAlign = "center";
    const startYear = new Date(minDate).getFullYear();
    const endYear = new Date(maxDate).getFullYear();

    if (chartZoom <= 2) {
      // Show years
      for (let y = startYear; y <= endYear; y++) {
        const t = new Date(y, 0, 1).getTime();
        if (t < minDate || t > maxDate) continue;
        const x = pad.left + ((t - minDate) / dateRange) * plotW;
        if (x >= pad.left && x <= W - pad.right) {
          ctx.fillText(y.toString(), x, H - pad.bottom + 20);
          ctx.strokeStyle = "#1e1e3580";
          ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, pad.top + plotH); ctx.stroke();
        }
      }
    } else if (chartZoom <= 6) {
      // Show months
      for (let y = startYear; y <= endYear; y++) {
        for (let m = 0; m < 12; m++) {
          const t = new Date(y, m, 1).getTime();
          if (t < minDate || t > maxDate) continue;
          const x = pad.left + ((t - minDate) / dateRange) * plotW;
          if (x >= pad.left && x <= W - pad.right) {
            const label = new Date(y, m, 1).toLocaleDateString("en", { month: "short", year: "numeric" });
            ctx.fillText(label, x, H - pad.bottom + 20);
          }
        }
      }
    } else {
      // Show individual dates
      const labelCount = Math.min(8, visiblePts.length);
      for (let i = 0; i < labelCount; i++) {
        const t = minDate + (dateRange / Math.max(labelCount - 1, 1)) * i;
        const x = pad.left + (plotW / Math.max(labelCount - 1, 1)) * i;
        const d = new Date(t);
        ctx.fillText(d.toLocaleDateString("en", { month: "short", day: "numeric", year: "numeric" }), x, H - pad.bottom + 20);
      }
    }

    // Genre color palette — use pre-computed map so legend colors match
    const genreColor = stats.genreColorMap;

    // Draw points (only visible ones) and store positions for hover
    const drawnPoints = [];
    ctx.save();
    ctx.beginPath();
    ctx.rect(pad.left, pad.top, plotW, plotH);
    ctx.clip();
    visiblePts.forEach(p => {
      const t = new Date(p.date).getTime();
      const x = pad.left + ((t - minDate) / dateRange) * plotW;
      const y = pad.top + ((maxElo - p.elo) / eloRange) * plotH;
      drawnPoints.push({ x, y, point: p });
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      const color = genreColor[p.genre] || "#818cf8";
      if (p.totalComparisons === 0) {
        // Unranked: hollow circle
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.6;
        ctx.stroke();
      } else {
        // Ranked: filled circle
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.7;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    });
    ctx.restore();
    chartPointsRef.current = drawnPoints;

    // Best fit line (linear regression)
    fitLineRef.current = null;
    if (showFitLine && visiblePts.length >= 2) {
      const xs = visiblePts.map(p => new Date(p.date).getTime());
      const ys = visiblePts.map(p => p.elo);
      const n = xs.length;
      const sumX = xs.reduce((a,b) => a+b, 0);
      const sumY = ys.reduce((a,b) => a+b, 0);
      const sumXY = xs.reduce((a, x, i) => a + x * ys[i], 0);
      const sumX2 = xs.reduce((a, x) => a + x * x, 0);
      const denom = n * sumX2 - sumX * sumX;
      if (Math.abs(denom) > 0) {
        const slope = (n * sumXY - sumX * sumY) / denom;
        const intercept = (sumY - slope * sumX) / n;
        // Use actual first and last data point dates, not chart edges
        const sortedByDate = [...visiblePts].sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());
        const t1 = new Date(sortedByDate[0].date).getTime();
        const t2 = new Date(sortedByDate[sortedByDate.length - 1].date).getTime();
        const elo1 = slope * t1 + intercept;
        const elo2 = slope * t2 + intercept;
        // Clamp elo values to actual song range
        const clampedElo1 = Math.max(globalMinElo, Math.min(globalMaxElo, elo1));
        const clampedElo2 = Math.max(globalMinElo, Math.min(globalMaxElo, elo2));
        const x1 = pad.left + ((t1 - minDate) / dateRange) * plotW;
        const x2 = pad.left + ((t2 - minDate) / dateRange) * plotW;
        const y1 = pad.top + ((maxElo - clampedElo1) / eloRange) * plotH;
        const y2 = pad.top + ((maxElo - clampedElo2) / eloRange) * plotH;
        // Store for tooltip
        fitLineRef.current = {
          x1, y1, x2, y2,
          elo1: Math.round(clampedElo1), elo2: Math.round(clampedElo2),
          date1: new Date(t1), date2: new Date(t2),
          change: Math.round(clampedElo2 - clampedElo1),
        };
        ctx.save();
        ctx.beginPath();
        ctx.rect(pad.left, pad.top, plotW, plotH);
        ctx.clip();
        ctx.strokeStyle = "#ef444488";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
    }

    // Highlight selected songs
    if (selectedSongs && selectedSongs.length > 0) {
      const selSet = new Set(selectedSongs);
      ctx.save();
      ctx.beginPath();
      ctx.rect(pad.left, pad.top, plotW, plotH);
      ctx.clip();
      drawnPoints.forEach(dp => {
        if (selSet.has(dp.point.id)) {
          ctx.beginPath();
          ctx.arc(dp.x, dp.y, 7, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(99,102,241,0.2)";
          ctx.fill();
        }
      });
      ctx.restore();
    }

  }, [stats, standings, chartZoom, chartPan, showFitLine, chartGenre, selectedSongs]);

  if (!stats) return (
    <div style={{textAlign:"center",padding:80}}>
      <p style={{color:"#6b7280",fontSize:18}}>No comparisons yet</p>
      <p style={{color:"#6b6b80",fontSize:14,marginTop:4}}>Complete some comparisons first</p>
    </div>
  );

  const cardStyle = {background:"#14142a",border:"1px solid #1e1e35",borderRadius:12,padding:16};
  const headStyle = {color:"#6b7280",fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:12};
  const maxGenreCount = Math.max(...Object.values(stats.genreCounts));

  const subTabs = [
    { id: "improvement", label: "Improvement", icon: "📈" },
    { id: "breakdown", label: "Breakdown", icon: "📊" },
    { id: "listening", label: "Listening", icon: "🎧" },
  ];

  return (
    <div style={{display:"flex",gap:16}}>
      {/* Sidebar tabs */}
      <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:110,flexShrink:0}}>
        {subTabs.map(t => (
          <button key={t.id} onClick={() => setStatsSubTab(t.id)}
            style={{
              display:"flex",alignItems:"center",gap:8,padding:"10px 14px",borderRadius:10,border:"none",
              background: statsSubTab === t.id ? "#1e1e35" : "transparent",
              color: statsSubTab === t.id ? "#e2e8f0" : "#6b6b80",
              fontSize:13,fontWeight: statsSubTab === t.id ? 600 : 400,
              cursor:"pointer",textAlign:"left",transition:"all 0.15s",
            }}
            onMouseEnter={e => { if (statsSubTab !== t.id) e.currentTarget.style.background = "#14142a"; }}
            onMouseLeave={e => { if (statsSubTab !== t.id) e.currentTarget.style.background = "transparent"; }}>
            <span style={{fontSize:14}}>{t.icon}</span> {t.label}
          </button>
        ))}
      </div>

      {/* Content */}
      <div style={{flex:1,minWidth:0}}>
        {/* Summary cards — always visible */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:10,marginBottom:20}}>
          {[
            { label: "total songs", value: songs.length },
            { label: "comparisons", value: comparisons.length },
            { label: "progress", value: Math.round(songs.reduce((sum, s) => sum + Math.min(ranking.compCount[s.id] || 0, 3), 0) / Math.max(songs.length * 3, 1) * 100) + "%" },
            { label: "genres", value: Object.keys(stats.genreCounts).length },
          ].map(s => (
            <div key={s.label} style={{background:"#14142a",border:"1px solid #1e1e35",borderRadius:10,padding:"12px 14px",textAlign:"center"}}>
              <div style={{color:"#818cf8",fontSize:20,fontWeight:700}}>{s.value}</div>
              <div style={{color:"#6b6b80",fontSize:9,textTransform:"uppercase",letterSpacing:"0.08em",marginTop:3}}>{s.label}</div>
            </div>
          ))}
        </div>

        {/* ===== IMPROVEMENT TAB ===== */}
        <div style={{display: statsSubTab === "improvement" ? "block" : "none"}}>
            {/* Date vs Elo chart */}
            {stats.dateEloPoints.length > 0 && (
        <div style={{...cardStyle,marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{...headStyle,marginBottom:0}}>rating by creation date</div>
              {chartGenre && <span style={{background:"#4338ca22",color:"#818cf8",padding:"2px 10px",borderRadius:12,fontSize:10}}>{chartGenre}</span>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              {chartZoom > 1 && <button onClick={()=>{setChartZoom(1);setChartPan(0)}} style={{background:"none",border:"1px solid #2a2a45",borderRadius:4,padding:"2px 8px",color:"#6b6b80",fontSize:10,cursor:"pointer"}}
                onMouseEnter={e=>e.target.style.color="#818cf8"} onMouseLeave={e=>e.target.style.color="#6b6b80"}>reset</button>}
              <button onClick={()=>setShowFitLine(v=>!v)} style={{background:showFitLine?"#818cf820":"none",border:"1px solid "+(showFitLine?"#818cf8":"#2a2a45"),borderRadius:8,padding:"6px 14px",color:showFitLine?"#818cf8":"#6b6b80",fontSize:12,cursor:"pointer",fontWeight:showFitLine?600:400}}
                onMouseEnter={e=>{if(!showFitLine)e.target.style.color="#818cf8"}} onMouseLeave={e=>{if(!showFitLine)e.target.style.color="#6b6b80"}}>best fit</button>
            </div>
          </div>
          <div style={{position:"relative",overscrollBehavior:"contain"}}>
            <canvas ref={chartRef} style={{width:"100%",height:280,borderRadius:8,cursor:"crosshair",touchAction:"none"}}
              onMouseDown={e => {
                const rect = chartRef.current.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const start = { x: mx, y: my };
                dragStartRef.current = start;
                setDragStart(start);
                setDragEnd(start);
                isDraggingRef.current = true;
                setIsDragging(true);
                setSelectedSongs(null);
              }}
              onMouseMove={e => {
                const rect = chartRef.current.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                if (isDraggingRef.current) {
                  setDragEnd({ x: mx, y: my });
                  setChartTooltip(null);
                  return;
                }
                // Check if hovering near the best fit line
                const fl = fitLineRef.current;
                if (fl && showFitLine) {
                  const dx = fl.x2 - fl.x1, dy = fl.y2 - fl.y1;
                  const len = Math.sqrt(dx*dx + dy*dy);
                  if (len > 0) {
                    const t = Math.max(0, Math.min(1, ((mx - fl.x1)*dx + (my - fl.y1)*dy) / (len*len)));
                    const px = fl.x1 + t*dx, py = fl.y1 + t*dy;
                    const dist = Math.sqrt((mx-px)**2 + (my-py)**2);
                    if (dist < 12) {
                      setChartTooltip({ x: mx, y: my, fitLine: fl });
                      return;
                    }
                  }
                }
                let closest = null;
                let closestDist = 20;
                for (const dp of chartPointsRef.current) {
                  const dist = Math.sqrt((dp.x - mx) ** 2 + (dp.y - my) ** 2);
                  if (dist < closestDist) { closestDist = dist; closest = dp; }
                }
                setChartTooltip(closest ? { x: closest.x, y: closest.y, point: closest.point } : null);
              }}
              onMouseUp={e => {
                if (!isDraggingRef.current || !dragStartRef.current) { isDraggingRef.current = false; setIsDragging(false); return; }
                isDraggingRef.current = false;
                setIsDragging(false);
                const rect = chartRef.current.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const ds = dragStartRef.current;
                const x1 = Math.min(ds.x, mx), x2 = Math.max(ds.x, mx);
                const y1 = Math.min(ds.y, my), y2 = Math.max(ds.y, my);
                // If drag was tiny, treat as click
                if (x2 - x1 < 8 && y2 - y1 < 8) {
                  setDragStart(null); setDragEnd(null);
                  let closest = null, closestDist = 20;
                  for (const dp of chartPointsRef.current) {
                    const dist = Math.sqrt((dp.x - mx) ** 2 + (dp.y - my) ** 2);
                    if (dist < closestDist) { closestDist = dist; closest = dp; }
                  }
                  if (closest && closest.point.audioFile) chartAudio.toggle(closest.point.audioFile);
                  return;
                }
                // Find songs inside the selection box
                const selected = chartPointsRef.current.filter(dp => dp.x >= x1 && dp.x <= x2 && dp.y >= y1 && dp.y <= y2).map(dp => dp.point);
                const uniqueIds = [...new Set(selected.map(s => s.id))];
                if (uniqueIds.length > 0) {
                  setSelectedSongs(uniqueIds);
                } else {
                  setSelectedSongs(null);
                }
                setDragStart(null); setDragEnd(null);
              }}
              onMouseLeave={() => { setChartTooltip(null); if (isDraggingRef.current) { isDraggingRef.current = false; setIsDragging(false); setDragStart(null); setDragEnd(null); } }}
            />
            {chartTooltip && (
              <div style={{
                position:"absolute",
                left: Math.min(chartTooltip.x, (chartRef.current?.getBoundingClientRect().width || 300) - 200),
                top: Math.max(0, chartTooltip.y - 80),
                background:"#0d0d1aee",border:"1px solid #2a2a45",borderRadius:8,padding:"8px 12px",
                pointerEvents:"none",zIndex:10,minWidth:140,backdropFilter:"blur(8px)"
              }}>
                {chartTooltip.fitLine ? (
                  <div>
                    <div style={{color:"#ef4444",fontSize:12,fontWeight:600,marginBottom:6}}>Best Fit Trend</div>
                    <div style={{display:"flex",justifyContent:"space-between",gap:16,fontSize:11,marginBottom:4}}>
                      <div>
                        <div style={{color:"#6b7280"}}>start</div>
                        <div style={{color:"#e2e8f0",fontWeight:600}}>{chartTooltip.fitLine.elo1}</div>
                        <div style={{color:"#6b6b80",fontSize:10}}>{chartTooltip.fitLine.date1.toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"})}</div>
                      </div>
                      <div style={{color:"#6b6b80",alignSelf:"center"}}>→</div>
                      <div>
                        <div style={{color:"#6b7280"}}>end</div>
                        <div style={{color:"#e2e8f0",fontWeight:600}}>{chartTooltip.fitLine.elo2}</div>
                        <div style={{color:"#6b6b80",fontSize:10}}>{chartTooltip.fitLine.date2.toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"})}</div>
                      </div>
                    </div>
                    <div style={{borderTop:"1px solid #1e1e35",paddingTop:4,marginTop:2,textAlign:"center"}}>
                      <span style={{color:chartTooltip.fitLine.change>=0?"#22c55e":"#ef4444",fontSize:12,fontWeight:700}}>
                        {chartTooltip.fitLine.change>=0?"+":""}{chartTooltip.fitLine.change}
                      </span>
                      <span style={{color:"#6b7280",fontSize:10,marginLeft:4}}>avg level change</span>
                    </div>
                  </div>
                ) : (
                  <div>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                      {chartTooltip.point.audioFile && <span style={{color:chartAudio.playingSrc===chartTooltip.point.audioFile&&chartAudio.isPlaying?"#818cf8":"#6b7280",fontSize:11}}>
                        {chartAudio.playingSrc===chartTooltip.point.audioFile&&chartAudio.isPlaying?"⏸ ":"▶ "}
                      </span>}
                      <span style={{color:"#e2e8f0",fontSize:13,fontWeight:600}}>{chartTooltip.point.title}</span>
                    </div>
                    <div style={{display:"flex",gap:12,fontSize:11}}>
                      <span style={{color:"#818cf8"}}>Elo {chartTooltip.point.elo}</span>
                      <span style={{color:"#6b7280"}}>{chartTooltip.point.wins}W {chartTooltip.point.losses}L</span>
                    </div>
                    {chartTooltip.point.genre && <div style={{color:"#6b7280",fontSize:10,marginTop:2}}>{chartTooltip.point.genre}</div>}
                    <div style={{color:"#6b6b80",fontSize:10,marginTop:2}}>{new Date(chartTooltip.point.date).toLocaleDateString("en", { month:"long", day:"numeric", year:"numeric" })}</div>
                  </div>
                )}
              </div>
            )}
            {/* Drag selection rectangle */}
            {isDragging && dragStart && dragEnd && (
              <div style={{
                position:"absolute",
                left: Math.min(dragStart.x, dragEnd.x),
                top: Math.min(dragStart.y, dragEnd.y),
                width: Math.abs(dragEnd.x - dragStart.x),
                height: Math.abs(dragEnd.y - dragStart.y),
                border:"2px dashed #818cf8",
                background:"rgba(99,102,241,0.08)",
                borderRadius:4,
                pointerEvents:"none",zIndex:5
              }} />
            )}
          </div>
          {/* Selected songs panel */}
          {selectedSongs && selectedSongs.length > 0 && (
            <div style={{background:"#0d0d1a",border:"1px solid #4338ca40",borderRadius:10,padding:"12px 16px",marginTop:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{color:"#818cf8",fontSize:12,fontWeight:600}}>{selectedSongs.length} song{selectedSongs.length !== 1 ? "s" : ""} selected</span>
                <button onClick={() => setSelectedSongs(null)} style={{background:"none",border:"none",color:"#6b7280",fontSize:11,cursor:"pointer"}}>✕ clear</button>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10,maxHeight:60,overflow:"auto"}}>
                {selectedSongs.slice(0, 20).map(id => {
                  const s = songs.find(x => x.id === id);
                  return s ? <span key={id} style={{background:"#14142a",border:"1px solid #2a2a45",borderRadius:6,padding:"2px 8px",fontSize:10,color:"#a0a0b0"}}>{s.title}</span> : null;
                })}
                {selectedSongs.length > 20 && <span style={{color:"#6b7280",fontSize:10}}>+{selectedSongs.length - 20} more</span>}
              </div>
              {selectedSongs.length >= 8 ? (
                <div style={{display:"flex",gap:8}}>
                  <button onClick={() => { onStartFocusedSession(selectedSongs); setSelectedSongs(null); }}
                    style={{flex:1,padding:"10px",borderRadius:10,background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                    Start session
                  </button>
                  <button onClick={() => {
                    const playable = selectedSongs.map(id => songs.find(s => s.id === id)).filter(s => s && s.audioFile).sort(() => Math.random() - 0.5);
                    if (playable.length === 0) return;
                    setPlayerQueue(playable);
                    setPlayerQueueIdx(0);
                    chartAudio.play(playable[0].audioFile);
                    switchTab("player");
                    setSelectedSongs(null);
                  }}
                    style={{padding:"10px 16px",borderRadius:10,background:"#4338ca10",border:"1px solid #4338ca50",color:"#818cf8",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                    ⤮ Play
                  </button>
                </div>
              ) : (
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  <div style={{color:"#6b7280",fontSize:11,textAlign:"center"}}>Need at least 8 songs to start a session (select {8 - selectedSongs.length} more)</div>
                  <button onClick={() => {
                    const playable = selectedSongs.map(id => songs.find(s => s.id === id)).filter(s => s && s.audioFile).sort(() => Math.random() - 0.5);
                    if (playable.length === 0) return;
                    setPlayerQueue(playable);
                    setPlayerQueueIdx(0);
                    chartAudio.play(playable[0].audioFile);
                    switchTab("player");
                    setSelectedSongs(null);
                  }}
                    style={{width:"100%",padding:"10px",borderRadius:10,background:"#4338ca10",border:"1px solid #4338ca50",color:"#818cf8",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                    ⤮ Shuffle play {selectedSongs.length} song{selectedSongs.length !== 1 ? "s" : ""}
                  </button>
                </div>
              )}
            </div>
          )}
          {/* Genre legend — clickable to filter */}
          {stats.allChartGenres.length > 1 && (
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:8,justifyContent:"center"}}>
              {stats.allChartGenres.map(g => (
                <button key={g} onClick={()=>setChartGenre(prev => prev === g ? "" : g)}
                  style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"1px solid "+(chartGenre===g?"#818cf8":"#1e1e35"),borderRadius:6,padding:"3px 8px",cursor:"pointer",opacity:chartGenre&&chartGenre!==g?0.4:1,transition:"opacity 0.15s"}}>
                  <span style={{width:8,height:8,borderRadius:2,background:stats.genreColorMap[g],display:"inline-block",flexShrink:0}} />
                  <span style={{color:chartGenre===g?"#e2e8f0":"#6b7280",fontSize:10}}>{g}</span>
                </button>
              ))}
            </div>
          )}
          {chartZoom > 1 && <div style={{color:"#5a5a70",fontSize:10,textAlign:"center",marginTop:4}}>scroll to zoom · shift+scroll to pan</div>}
        </div>
      )}
          </div>

        {/* ===== BREAKDOWN TAB ===== */}
        <div style={{display: statsSubTab === "breakdown" ? "block" : "none"}}>
      <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
      <div style={{...cardStyle,flex:"1 1 240px",minWidth:200}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{...headStyle,marginBottom:0}}>genres by rating</div>
        </div>
        {Object.entries(stats.genreCounts).sort((a,b) => {
          const avgA = stats.avgEloByGenre.find(x => x.genre === a[0]);
          const avgB = stats.avgEloByGenre.find(x => x.genre === b[0]);
          return (avgB ? avgB.avgElo : 0) - (avgA ? avgA.avgElo : 0);
        }).map(([g, count]) => {
          const avg = stats.avgEloByGenre.find(x => x.genre === g);
          return (
            <div key={g} style={{marginBottom:6}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:1}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{width:7,height:7,borderRadius:2,background:stats.genreColorMap[g]||"#818cf8",display:"inline-block",flexShrink:0}} />
                  <span style={{color:"#e2e8f0",fontSize:11}}>{g}</span>
                </div>
                <div style={{display:"flex",gap:10}}>
                  <span style={{color:"#6b6b80",fontSize:10}}>{count}</span>
                  {avg && <span style={{color:"#818cf8",fontSize:10,fontWeight:600}}>avg {avg.avgElo}</span>}
                </div>
              </div>
              <div style={{height:3,background:"#1e1e35",borderRadius:2,overflow:"hidden",width:"50%"}}>
                <div style={{width:(count/maxGenreCount*100)+"%",height:"100%",background:"linear-gradient(90deg,#4338ca,#818cf8)",borderRadius:2}} />
              </div>
            </div>
          );
        })}
      </div>

      {/* Elo Distribution Histogram */}
      {ranking.standings.length > 0 && (() => {
        const bucketSize = 50;
        const buckets = {};
        for (let i = 0; i <= 1000; i += bucketSize) buckets[i] = 0;
        ranking.standings.forEach(s => {
          const b = Math.min(Math.floor(s.elo / bucketSize) * bucketSize, 1000 - bucketSize);
          buckets[b] = (buckets[b] || 0) + 1;
        });
        const maxCount = Math.max(...Object.values(buckets), 1);
        const tierRanges = [
          { label: "S", min: 800, color: "#22c55e" },
          { label: "A", min: 650, color: "#818cf8" },
          { label: "B", min: 500, color: "#3b82f6" },
          { label: "C", min: 350, color: "#f59e0b" },
          { label: "D", min: 200, color: "#f97316" },
          { label: "E", min: 0, color: "#ef4444" },
        ];
        const getTierColor = (elo) => {
          for (const t of tierRanges) { if (elo >= t.min) return t.color; }
          return "#ef4444";
        };
        return (
          <div style={{...cardStyle,flex:"1 1 240px",minWidth:200}}>
            <div style={{...headStyle}}>rating distribution</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:2,height:120,position:"relative"}} onMouseLeave={() => setHoveredBucket(null)}>
              {Object.entries(buckets).sort((a,b) => Number(a[0]) - Number(b[0])).map(([elo, count]) => {
                const h = count > 0 ? Math.max(4, Math.round((count / maxCount) * 110)) : 0;
                const e = Number(elo);
                const isHovered = hoveredBucket === elo;
                return (
                  <div key={elo} style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"flex-end",alignItems:"center",height:"100%",position:"relative",cursor:count > 0 ? "pointer" : "default"}}
                    onMouseEnter={() => count > 0 && setHoveredBucket(elo)}>
                    {isHovered && count > 0 && (
                      <div style={{position:"absolute",top:-22,background:"#2a2a45",color:"#e2e8f0",fontSize:10,fontWeight:600,padding:"2px 6px",borderRadius:4,whiteSpace:"nowrap",zIndex:10,pointerEvents:"none"}}>
                        {count} song{count !== 1 ? "s" : ""} · {e}–{e + bucketSize}
                      </div>
                    )}
                    <div style={{width:"100%",background:count > 0 ? getTierColor(e + bucketSize/2) : "transparent",borderRadius:"3px 3px 0 0",height:h,opacity:isHovered ? 1 : 0.7,transition:"height 0.3s, opacity 0.15s"}} />
                  </div>
                );
              })}
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
              <span style={{color:"#6b6b80",fontSize:9}}>0</span>
              <span style={{color:"#6b6b80",fontSize:9}}>500</span>
              <span style={{color:"#6b6b80",fontSize:9}}>1000</span>
            </div>
            <div style={{display:"flex",gap:6,justifyContent:"center",marginTop:10,flexWrap:"wrap"}}>
              {tierRanges.map(t => {
                const count = ranking.standings.filter(s => {
                  const idx = tierRanges.indexOf(t);
                  const upper = idx > 0 ? tierRanges[idx - 1].min : 1001;
                  return s.elo >= t.min && s.elo < upper;
                }).length;
                return (
                  <div key={t.label} style={{display:"flex",alignItems:"center",gap:3}}>
