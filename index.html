  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♪</text></svg>">

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, createContext, useContext, useMemo } = React;

// ========== Global Audio Context (single persistent audio element) ==========
const AudioContext = createContext();

function AudioProvider({ children }) {
  const audioRef = useRef(null);
  const [playingSrc, setPlayingSrc] = useState(null);
  const [currentTime, setCurrentTime] = useState(0);
  const [duration, setDuration] = useState(0);
  const [isPlaying, setIsPlaying] = useState(false);
  const isPlayingRef = useRef(false);
  const [volume, setVolumeState] = useState(1);
  const listenersRef = useRef(new Set());
  const snapshotsRef = useRef({});

  const notify = useCallback(() => {
    listenersRef.current.forEach(fn => fn());
  }, []);

  const getSrcKey = useCallback((elSrc) => {
    if (!elSrc) return null;
    try { return new URL(elSrc).pathname; } catch { return elSrc; }
  }, []);

  const getSnapshot = useCallback((src) => snapshotsRef.current[src] || null, []);

  const playAttemptRef = useRef(0);

  const play = useCallback((src) => {
    const el = audioRef.current;
    if (!el) return;
    const currentKey = getSrcKey(el.src);
    if (currentKey && currentKey !== src && el.duration) {
      snapshotsRef.current[currentKey] = { time: el.currentTime, duration: el.duration };
    }
    const attemptId = ++playAttemptRef.current;
    if (currentKey !== src) {
      el.src = src;
    }
    el.play().then(() => {
      if (playAttemptRef.current !== attemptId) return;
      setIsPlaying(true); isPlayingRef.current = true; setPlayingSrc(src); notify();
    }).catch(() => {});
  }, [notify, getSrcKey]);

  const pause = useCallback(() => {
    const el = audioRef.current;
    if (!el) return;
    el.pause();
    setIsPlaying(false); isPlayingRef.current = false;
    notify();
  }, [notify]);

  const toggle = useCallback((src) => {
    const el = audioRef.current;
    if (!el) return;
    const currentKey = getSrcKey(el.src);
    const isSameSrc = currentKey === src;
    if (isSameSrc && isPlayingRef.current) { pause(); }
    else { play(src); }
  }, [play, pause, getSrcKey]);

  const seek = useCallback((time) => {
    const el = audioRef.current;
    if (!el || !el.duration) return;
    el.currentTime = Math.max(0, Math.min(el.duration, time));
    setCurrentTime(el.currentTime);
  }, []);

  const skip = useCallback((secs) => {
    const el = audioRef.current;
    if (!el || !el.duration) return;
    el.currentTime = Math.max(0, Math.min(el.duration, el.currentTime + secs));
  }, []);

  const stop = useCallback(() => {
    const el = audioRef.current;
    if (!el) return;
    playAttemptRef.current++; // cancel any pending play
    el.pause();
    setIsPlaying(false); isPlayingRef.current = false;
    setPlayingSrc(null);
    setCurrentTime(0);
    setDuration(0);
    notify();
  }, [notify]);

  const subscribe = useCallback((fn) => {
    listenersRef.current.add(fn);
    return () => listenersRef.current.delete(fn);
  }, []);

  const setVolume = useCallback((v) => {
    const clamped = Math.max(0, Math.min(1, v));
    setVolumeState(clamped);
    if (audioRef.current) audioRef.current.volume = clamped;
  }, []);

  const onEndedRef = useRef(null);

  const setOnEnded = useCallback((fn) => { onEndedRef.current = fn; }, []);

  const audioEl = React.createElement("audio", {
    ref: audioRef,
    preload: "auto",
    onTimeUpdate: () => { setCurrentTime(audioRef.current?.currentTime || 0); },
    onLoadedMetadata: () => { setDuration(audioRef.current?.duration || 0); },
    onEnded: () => { setIsPlaying(false); isPlayingRef.current = false; notify(); if (onEndedRef.current) onEndedRef.current(); },
    style: { display: "none" },
  });

  const value = { play, pause, toggle, seek, skip, stop, subscribe, playingSrc, currentTime, duration, isPlaying, setOnEnded, getSnapshot, volume, setVolume };
  return React.createElement(AudioContext.Provider, { value }, audioEl, children);
}

function useGlobalAudio() { return useContext(AudioContext); }

// ========== API ==========
const api = {
  get: async (url) => { const r = await fetch(url); return r.json(); },
  post: async (url, body) => {
    if (body instanceof FormData) {
      const r = await fetch(url, { method: "POST", body });
      return r.json();
    }
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    return r.json();
  },
  put: async (url, body) => {
    if (body instanceof FormData) {
      const r = await fetch(url, { method: "PUT", body });
      return r.json();
    }
    const r = await fetch(url, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    return r.json();
  },
  del: async (url) => { const r = await fetch(url, { method: "DELETE" }); return r.json(); },
  patch: async (url, body) => {
    const r = await fetch(url, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    return r.json();
  },
};

// ========== Audio Player (lightweight controller for global audio) ==========
function AudioPlayer({ src, compact }) {
  const progRef = useRef(null);
  const draggingRef = useRef(false);
  const { toggle, skip, seek, playingSrc, currentTime, duration, isPlaying, subscribe } = useGlobalAudio();
  const [, forceUpdate] = useState(0);

  // Subscribe to global audio state changes so this player re-renders
  useEffect(() => {
    return subscribe(() => forceUpdate(n => n + 1));
  }, [subscribe]);

  const isMine = playingSrc === src;
  const playing = isMine && isPlaying;
  const ct = isMine ? currentTime : 0;
  const dur = isMine ? duration : 0;

  const handleToggle = (e) => {
    if (e) { e.stopPropagation(); e.preventDefault(); }
    toggle(src);
  };

  const handleSkip = (e, secs) => {
    e.stopPropagation();
    if (!isMine) return;
    skip(secs);
  };

  const seekTo = (e) => {
    if (!progRef.current || !isMine || !dur) return;
    const rect = progRef.current.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    seek(pct * dur);
  };

  const onPointerDown = (e) => {
    e.stopPropagation();
    e.preventDefault();
    if (!isMine && !playing) { toggle(src); return; }
    draggingRef.current = true;
    seekTo(e);
    const onMove = (ev) => { if (draggingRef.current) seekTo(ev); };
    const onUp = () => { draggingRef.current = false; window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  };

  const fmt = (s) => {
    if (!s || isNaN(s)) return "0:00";
    return Math.floor(s/60) + ":" + Math.floor(s%60).toString().padStart(2,"0");
  };
  const pct = dur ? (ct / dur * 100) : 0;
  const btnStyle = {background:"none",border:"none",cursor:"pointer",color:"#6b7280",fontSize:13,padding:"0 2px",display:"flex",alignItems:"center",transition:"color 0.15s"};

  return (
    <div onClick={e=>e.stopPropagation()} style={{display:"flex",alignItems:"center",gap:8,background:"#1a1a2e",borderRadius:10,padding:compact?"6px 10px":"8px 14px"}}>
      <button onClick={(e)=>handleSkip(e,-10)} style={btnStyle}
        onMouseEnter={e=>e.target.style.color="#818cf8"} onMouseLeave={e=>e.target.style.color="#6b7280"}>⟲</button>
      <button onClick={handleToggle} style={{background:"none",border:"none",cursor:"pointer",color:playing?"#f59e0b":"#818cf8",fontSize:compact?18:22,padding:0,display:"flex",alignItems:"center"}}>
        {playing?"⏸":"▶"}</button>
      <button onClick={(e)=>handleSkip(e,10)} style={btnStyle}
        onMouseEnter={e=>e.target.style.color="#818cf8"} onMouseLeave={e=>e.target.style.color="#6b7280"}>⟳</button>
      <span style={{color:"#6b7280",fontSize:12,minWidth:36}}>{fmt(ct)}</span>
      <div ref={progRef} onPointerDown={onPointerDown}
        style={{flex:1,height:16,display:"flex",alignItems:"center",cursor:"pointer",position:"relative",minWidth:60,touchAction:"none"}}>
        <div style={{position:"absolute",left:0,right:0,height:6,background:"#2a2a3e",borderRadius:3}}>
          <div style={{width:pct+"%",height:"100%",background:playing?"linear-gradient(90deg,#f59e0b,#fbbf24)":"linear-gradient(90deg,#818cf8,#a78bfa)",borderRadius:3}} />
        </div>
        <div style={{position:"absolute",left:"calc("+pct+"% - 7px)",width:14,height:14,borderRadius:"50%",background:playing?"#f59e0b":"#818cf8",boxShadow:playing?"0 0 6px rgba(245,158,11,0.5)":"0 0 6px rgba(129,140,248,0.5)",transition:draggingRef.current?"none":"left 0.1s linear"}} />
      </div>
      <span style={{color:"#6b7280",fontSize:12,minWidth:36}}>{fmt(dur)}</span>
    </div>
  );
}

// ========== Modal ==========
function Modal({ open, onClose, children }) {
  if (!open) return null;
  return (
    <div style={{position:"fixed",inset:0,zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.7)",backdropFilter:"blur(8px)"}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:"linear-gradient(160deg,#1a1a30,#141425)",border:"1px solid #2a2a45",borderRadius:20,padding:32,width:"90%",maxWidth:500,boxShadow:"0 24px 64px rgba(0,0,0,0.5)",animation:"modalIn 0.3s ease-out",maxHeight:"90vh",overflowY:"auto"}}>
        {children}
      </div>
    </div>
  );
}

// ========== Song Row (compact but everything visible) ==========
function SongRow({ song, onDelete, onEdit, rank, showElo, showWinLoss: showWL, selectable, selected, onToggleSelect, listenTime, playlists, onAddToPlaylist, onAddToQueue, onPlayNext, compact }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const [playlistSub, setPlaylistSub] = useState(false);
  const menuRef = useRef(null);
  const fmtTime = (secs) => { if (!secs || secs < 60) return null; const m = Math.floor(secs / 60); return m + "m"; };

  // Close menu on outside click
  useEffect(() => {
    if (!menuOpen) return;
    const handler = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) { setMenuOpen(false); setPlaylistSub(false); } };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [menuOpen]);

  const menuItemStyle = {display:"flex",alignItems:"center",gap:8,padding:"8px 14px",color:"#c8c8d8",fontSize:12,cursor:"pointer",background:"none",border:"none",width:"100%",textAlign:"left",whiteSpace:"nowrap"};
  const manualPlaylists = (playlists || []).filter(pl => !pl.smart);

  return (
    <div style={{background:"#14142a",border:"1px solid #1e1e35",borderRadius:compact?6:8,padding:compact?"4px 10px":"10px 14px",display:"flex",flexDirection:"column",gap:compact?2:6}}>
      <div style={{display:"flex",alignItems:"center",gap:compact?6:8}}>
        {selectable && (
          <input type="checkbox" checked={!!selected} onChange={()=>onToggleSelect(song.id)}
            style={{accentColor:"#818cf8",cursor:"pointer",flexShrink:0,width:compact?14:16,height:compact?14:16}} />
        )}
        {rank != null && <span style={{fontSize:compact?11:13,color:rank<=3?"#f59e0b":"#6b6b80",fontWeight:700,minWidth:compact?22:28,textAlign:"right"}}>{rank}</span>}
        <span style={{flex:1,color:"#e2e8f0",fontSize:compact?12:14,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{song.title}</span>
        {listenTime && fmtTime(listenTime) && <span style={{color:"#22c55e80",fontSize:9,flexShrink:0}}>♪{fmtTime(listenTime)}</span>}
        {song.genre && <span style={{color:"#818cf8",fontSize:compact?9:10,textTransform:"uppercase",letterSpacing:"0.05em",flexShrink:0,background:"#4338ca15",padding:compact?"1px 6px":"2px 8px",borderRadius:8}}>{song.genre}</span>}
        {!compact && <span style={{color:"#5a5a70",fontSize:11,flexShrink:0}}>{song.date}</span>}
        {showElo && song.elo != null && <span style={{color:"#818cf8",fontSize:11,fontWeight:600,flexShrink:0}}>{song.elo}</span>}
        {showElo && showWL !== false && song.elo != null && <span style={{color:"#5a5a70",fontSize:10,flexShrink:0}}>{song.wins}W {song.losses}L</span>}
        {(onEdit || onDelete) && !selectable && (
          <div ref={menuRef} style={{position:"relative",flexShrink:0}}>
            <button onClick={e=>{e.stopPropagation();setMenuOpen(!menuOpen);setPlaylistSub(false)}}
              style={{background:"none",border:"none",color:menuOpen?"#818cf8":"#6b6b80",cursor:"pointer",fontSize:16,padding:"2px 6px",lineHeight:1,letterSpacing:2}}
              onMouseEnter={e=>e.target.style.color="#818cf8"} onMouseLeave={e=>{if(!menuOpen)e.target.style.color="#6b6b80"}}>
              ⋯
            </button>
            {menuOpen && (
              <div style={{position:"absolute",right:0,top:"100%",marginTop:4,background:"#1a1a2e",border:"1px solid #2a2a45",borderRadius:10,overflow:"visible",zIndex:50,minWidth:170,boxShadow:"0 8px 24px rgba(0,0,0,0.5)",animation:"fadeUp 0.15s ease-out"}}>
                {onEdit && (
                  <button onClick={e=>{e.stopPropagation();setMenuOpen(false);onEdit(song)}} style={{...menuItemStyle,borderRadius:"10px 10px 0 0"}}
                    onMouseEnter={e=>e.currentTarget.style.background="#2a2a45"} onMouseLeave={e=>e.currentTarget.style.background="none"}>
                    <span style={{fontSize:13}}>✏️</span> Edit
                  </button>
                )}
                {onAddToQueue && song.audioFile && (
                  <button onClick={e=>{e.stopPropagation();setMenuOpen(false);onAddToQueue(song)}} style={menuItemStyle}
                    onMouseEnter={e=>e.currentTarget.style.background="#2a2a45"} onMouseLeave={e=>e.currentTarget.style.background="none"}>
                    <span style={{fontSize:13}}>📋</span> Add to queue
                  </button>
                )}
                {onPlayNext && song.audioFile && (
                  <button onClick={e=>{e.stopPropagation();setMenuOpen(false);onPlayNext(song)}} style={menuItemStyle}
                    onMouseEnter={e=>e.currentTarget.style.background="#2a2a45"} onMouseLeave={e=>e.currentTarget.style.background="none"}>
                    <span style={{fontSize:13}}>⏭️</span> Play next
                  </button>
                )}
                {onAddToPlaylist && manualPlaylists.length > 0 && (
                  <div style={{position:"relative"}}>
                    <div style={{height:1,background:"#2a2a45",margin:"2px 0"}} />
                    <button onClick={e=>{e.stopPropagation();setPlaylistSub(!playlistSub)}} style={{...menuItemStyle,justifyContent:"space-between"}}
                      onMouseEnter={e=>e.currentTarget.style.background="#2a2a45"} onMouseLeave={e=>e.currentTarget.style.background="none"}>
                      <span style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:13}}>🎵</span> Add to playlist</span>
                      <span style={{color:"#6b6b80",fontSize:10,transform:playlistSub?"rotate(180deg)":"none",transition:"transform 0.15s"}}>▸</span>
                    </button>
                    {playlistSub && (
                      <div style={{position:"absolute",right:"100%",top:0,marginRight:4,background:"#1a1a2e",border:"1px solid #2a2a45",borderRadius:10,overflow:"hidden",minWidth:150,boxShadow:"0 8px 24px rgba(0,0,0,0.5)",animation:"fadeUp 0.1s ease-out"}}>
                        {manualPlaylists.map(pl => (
                          <button key={pl.id} onClick={e=>{e.stopPropagation();setMenuOpen(false);setPlaylistSub(false);onAddToPlaylist(song.id, pl.id)}} style={menuItemStyle}
                            onMouseEnter={e=>e.currentTarget.style.background="#2a2a45"} onMouseLeave={e=>e.currentTarget.style.background="none"}>
                            {pl.name}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                )}
                {onDelete && (
                  <>
                    <div style={{height:1,background:"#2a2a45",margin:"2px 0"}} />
                    <button onClick={e=>{e.stopPropagation();setMenuOpen(false);onDelete(song.id)}} style={{...menuItemStyle,color:"#ef4444",borderRadius:"0 0 10px 10px"}}
                      onMouseEnter={e=>e.currentTarget.style.background="#2a2a45"} onMouseLeave={e=>e.currentTarget.style.background="none"}>
                      <span style={{fontSize:13}}>🗑️</span> Delete
                    </button>
                  </>
                )}
              </div>
            )}
          </div>
        )}
      </div>
      {!compact && song.audioFile && <AudioPlayer src={song.audioFile} compact />}
    </div>
  );
}

// ========== Virtualized List (uses window scroll, no inner scrollbar) ==========
function VirtualList({ items, rowHeight, renderRow, overScan, gap }) {
  const containerRef = useRef(null);
  const os = overScan || 4;
  const g = gap || 6;
  const [visibleRange, setVisibleRange] = useState({ start: 0, end: 20 });

  useEffect(() => {
    const update = () => {
      const el = containerRef.current;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const viewTop = -rect.top;
      const viewBottom = viewTop + window.innerHeight;
      const itemStep = rowHeight + g;
      const start = Math.max(0, Math.floor(viewTop / itemStep) - os);
      const end = Math.min(items.length, Math.ceil(viewBottom / itemStep) + os);
      setVisibleRange({ start, end });
    };
    update();
    window.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update, { passive: true });
    return () => { window.removeEventListener("scroll", update); window.removeEventListener("resize", update); };
  }, [items.length, rowHeight, os, g]);

  const totalHeight = items.length * (rowHeight + g) - (items.length > 0 ? g : 0);
  const visibleItems = items.slice(visibleRange.start, visibleRange.end);
  const offsetY = visibleRange.start * (rowHeight + g);

  return (
    <div ref={containerRef} style={{position:"relative",height:totalHeight}}>
      <div style={{position:"absolute",top:offsetY,left:0,right:0,display:"flex",flexDirection:"column",gap:g}}>
        {visibleItems.map((item, i) => renderRow(item, visibleRange.start + i))}
      </div>
    </div>
  );
}

// ========== Song Edit Form ==========
function SongEditForm({ song, genres, onSave, onCancel }) {
  const [title, setTitle] = useState(song?.title || "");
  const [date, setDate] = useState(song?.date || new Date().toISOString().split("T")[0]);
  const [genre, setGenre] = useState(song?.genre || "");
  const [audioFile, setAudioFile] = useState(null);
  const [audioName, setAudioName] = useState(song?.audioName || "");
  const [submitting, setSubmitting] = useState(false);

  const inputStyle = {width:"100%",boxSizing:"border-box",background:"#12121f",border:"1px solid #2a2a45",borderRadius:10,padding:"12px 16px",color:"#e2e8f0",fontSize:15,outline:"none",transition:"border-color 0.2s"};
  const labelStyle = {color:"#6b7280",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6,display:"block"};

  const handleSubmit = async () => {
    if (!title.trim()||submitting) return;
    setSubmitting(true);
    const fd = new FormData();
    fd.append("title",title.trim());
    fd.append("date",date);
    fd.append("genre",genre);
    if (audioFile) fd.append("audio",audioFile);
    try { await onSave(fd, song?.id); } finally { setSubmitting(false); }
  };

  return (
    <div>
      <h2 style={{margin:"0 0 24px",color:"#e2e8f0",fontSize:28,fontWeight:400}}>{song?"Edit Song":"Add Song"}</h2>
      <div style={{display:"flex",flexDirection:"column",gap:18}}>
        <div>
          <label style={labelStyle}>Title</label>
          <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Song name" style={inputStyle}
            onFocus={e=>e.target.style.borderColor="#4338ca"} onBlur={e=>e.target.style.borderColor="#2a2a45"} />
        </div>
        <div style={{display:"flex",gap:14}}>
          <div style={{flex:1}}>
            <label style={labelStyle}>Date</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={inputStyle}/>
          </div>
          <div style={{flex:1}}>
            <label style={labelStyle}>Genre</label>
            <select value={genre} onChange={e=>setGenre(e.target.value)} style={{...inputStyle,cursor:"pointer",appearance:"none"}}>
              <option value="">No genre</option>
              {genres.map(g=><option key={g} value={g}>{g}</option>)}
            </select>
          </div>
        </div>
        <div>
          <label style={labelStyle}>Audio File</label>
          <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,padding:16,background:"#12121f",border:"2px dashed #2a2a45",borderRadius:12,cursor:"pointer",color:(audioFile||song?.audioFile)?"#818cf8":"#6b7280",fontSize:14,transition:"all 0.2s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor="#4338ca"} onMouseLeave={e=>e.currentTarget.style.borderColor="#2a2a45"}>
            <input type="file" accept="audio/mpeg,audio/wav,audio/ogg,audio/flac,audio/aac,audio/mp4,audio/webm,audio/x-m4a" onChange={e=>{const f=e.target.files?.[0];if(f){if(f.type==="audio/midi"||f.type==="audio/x-midi"||f.name.toLowerCase().endsWith(".mid")||f.name.toLowerCase().endsWith(".midi")){showToast("⚠️ MIDI files are not supported");return}setAudioFile(f);setAudioName(f.name)}}} style={{display:"none"}} />
            {audioFile?"♪ "+audioName:song?.audioName?"♪ "+song.audioName+" (keep)":"↑ Upload audio"}
          </label>
        </div>
        <div style={{display:"flex",gap:12,marginTop:8}}>
          <button onClick={onCancel} style={{flex:1,padding:14,borderRadius:12,background:"none",border:"1px solid #2a2a45",color:"#6b7280",fontSize:15,cursor:"pointer",}}
            onMouseEnter={e=>{e.target.style.borderColor="#6b7280";e.target.style.color="#e2e8f0"}} onMouseLeave={e=>{e.target.style.borderColor="#2a2a45";e.target.style.color="#6b7280"}}>cancel</button>
          <button onClick={handleSubmit} disabled={!title.trim()||submitting} style={{flex:2,padding:14,borderRadius:12,background:title.trim()?"linear-gradient(135deg,#4338ca,#6366f1)":"#2a2a40",border:"none",color:title.trim()?"#fff":"#555",fontSize:15,cursor:title.trim()?"pointer":"default",fontWeight:600,boxShadow:title.trim()?"0 4px 20px rgba(99,102,241,0.3)":"none",opacity:submitting?0.6:1}}>
            {submitting?"saving...":song?"save changes":"add song"}</button>
        </div>
      </div>
    </div>
  );
}


// ========== Scroll To Top Button ==========
function ScrollToTop() {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const onScroll = () => setVisible(window.scrollY > 400);
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  if (!visible) return null;
  return (
    <button onClick={() => {
      const start = window.scrollY;
      const duration = Math.min(200, start / 5);
      const startTime = performance.now();
      const step = (now) => {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        window.scrollTo(0, start * (1 - ease));
        if (progress < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }}
      style={{position:"fixed",bottom:24,right:24,width:40,height:40,borderRadius:"50%",background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",color:"#fff",fontSize:18,cursor:"pointer",boxShadow:"0 4px 16px rgba(99,102,241,0.3)",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",animation:"fadeUp 0.2s ease-out"}}>
      ↑
    </button>
  );
}

function LibraryTab({ songs, genres, onRefresh, filterGenre, setFilterGenre, selectMode, setSelectMode, selectedIds, setSelectedIds, batchGenre, setBatchGenre, stickyTop, listenTimes, setPlayerQueue, setPlayerQueueIdx, switchTab, playlists, showToast, rowDensity }) {
  const [search, setSearch] = useState("");
  const [sortBy, setSortBy] = useState("date-desc");
  const [editingSong, setEditingSong] = useState(null);
  const [modalOpen, setModalOpen] = useState(false);
  const [batchSaving, setBatchSaving] = useState(false);
  const { play } = useGlobalAudio();

  const handleSave = async (fd, id) => {
    if (id) await api.put("/api/songs/"+id, fd);
    else await api.post("/api/songs", fd);
    setModalOpen(false); setEditingSong(null); onRefresh();
  };
  const handleDelete = async (id) => { await api.del("/api/songs/"+id); onRefresh(); };
  const openEdit = (s) => { setEditingSong(s); setModalOpen(true); };

  const toggleSelect = (id) => {
    setSelectedIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const applyBatchGenre = async () => {
    if (selectedIds.size === 0) return;
    setBatchSaving(true);
    await api.patch("/api/songs/batch-genre", { ids: [...selectedIds], genre: batchGenre });
    setSelectedIds(new Set());
    setSelectMode(false);
    setBatchGenre("");
    await onRefresh();
    setBatchSaving(false);
  };

  const exitSelectMode = () => {
    setSelectMode(false);
    setSelectedIds(new Set());
    setBatchGenre("");
  };

  const hasNoGenreSongs = songs.some(s => !s.genre);
  const usedGenres = ["All", ...(hasNoGenreSongs ? ["No Genre"] : []), ...new Set(songs.map(s=>s.genre).filter(Boolean))];
  const filtered = songs
    .filter(s => {
      if (search && !s.title.toLowerCase().includes(search.toLowerCase())) return false;
      if (filterGenre === "No Genre" && s.genre) return false;
      if (filterGenre !== "All" && filterGenre !== "No Genre" && s.genre !== filterGenre) return false;
      return true;
    })
    .sort((a,b) => {
      switch(sortBy){
        case "date-desc": return (b.date||"").localeCompare(a.date||"");
        case "date-asc": return (a.date||"").localeCompare(b.date||"");
        case "title": return (a.title||"").localeCompare(b.title||"");
        case "listened": return (listenTimes[b.id]||0) - (listenTimes[a.id]||0);
        default: return 0;
      }
    });

  return (
    <div style={{display:"flex",gap:16,alignItems:"flex-start"}}>
      {/* Sidebar — always visible on the left */}
      <div style={{position:"sticky",top:(stickyTop||0)+8,width:170,flexShrink:0,display:"flex",flexDirection:"column",gap:10,paddingTop:8,zIndex:10}}>
        <div style={{position:"relative"}}>
          <span style={{position:"absolute",left:10,top:10,color:"#6b6b80",fontSize:12,pointerEvents:"none",zIndex:1}}>⌕</span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="search..."
            style={{width:"100%",background:"#14142a",border:"1px solid #2a2a45",borderRadius:10,padding:"9px 10px 9px 28px",color:"#e2e8f0",fontSize:12,outline:"none",transition:"border-color 0.2s, box-shadow 0.2s"}}
            onFocus={e=>{e.target.style.borderColor="#4338ca";e.target.style.boxShadow="0 0 0 3px rgba(67,56,202,0.15)"}}
            onBlur={e=>{e.target.style.borderColor="#2a2a45";e.target.style.boxShadow="none"}} />
        </div>
        <div style={{color:"#8a8aa0",fontSize:10,textTransform:"uppercase",letterSpacing:"0.06em",marginTop:4}}>Genre</div>
        <select value={filterGenre} onChange={e=>setFilterGenre(e.target.value)} style={{background:"#14142a",border:"1px solid #2a2a45",borderRadius:10,padding:"9px 10px",color:"#e2e8f0",fontSize:12,cursor:"pointer",appearance:"none",width:"100%"}}>
          {usedGenres.map(g=><option key={g} value={g}>{g==="All"?"Any":g==="No Genre"?"No genre":g}</option>)}
        </select>
        <div style={{color:"#8a8aa0",fontSize:10,textTransform:"uppercase",letterSpacing:"0.06em",marginTop:4}}>Sorting</div>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{background:"#14142a",border:"1px solid #2a2a45",borderRadius:10,padding:"9px 10px",color:"#e2e8f0",fontSize:12,cursor:"pointer",appearance:"none",width:"100%"}}>
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="title">A → Z</option>
          <option value="listened">Most listened</option>
        </select>
        <button onClick={selectMode ? exitSelectMode : ()=>setSelectMode(true)}
          style={{background:selectMode?"#4338ca20":"#4338ca10",border:"1px solid "+(selectMode?"#4338ca":"#4338ca50"),borderRadius:10,padding:"9px 10px",color:selectMode?"#818cf8":"#818cf8",fontSize:11,cursor:"pointer",width:"100%",textAlign:"left",marginTop:10,fontWeight:500}}>
          {selectMode ? "✕ cancel select" : "☐ bulk tag"}
        </button>
      </div>

      {/* Song list — takes remaining space */}
      <div style={{flex:1,minWidth:0}}>
        {/* Action bar above songs */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,gap:8}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flex:1}}>
            {selectMode && (
              <div style={{display:"flex",alignItems:"center",gap:6,background:"#12121f",border:"1px solid #1e1e35",borderRadius:8,padding:"6px 10px",animation:"fadeUp 0.2s ease-out"}}>
                <button onClick={()=>setSelectedIds(new Set(filtered.map(s=>s.id)))} style={{background:"none",border:"1px solid #2a2a45",borderRadius:6,padding:"4px 8px",color:"#6b7280",fontSize:9,cursor:"pointer"}}
                  onMouseEnter={e=>e.target.style.color="#818cf8"} onMouseLeave={e=>e.target.style.color="#6b7280"}>all</button>
                <button onClick={()=>setSelectedIds(new Set())} style={{background:"none",border:"1px solid #2a2a45",borderRadius:6,padding:"4px 8px",color:"#6b7280",fontSize:9,cursor:"pointer"}}
                  onMouseEnter={e=>e.target.style.color="#818cf8"} onMouseLeave={e=>e.target.style.color="#6b7280"}>none</button>
                <span style={{color:"#6b6b80",fontSize:10}}>{selectedIds.size} selected</span>
                <select value={batchGenre} onChange={e=>setBatchGenre(e.target.value)}
                  style={{background:"#0d0d1a",border:"1px solid #2a2a45",borderRadius:6,padding:"5px 8px",color:"#e2e8f0",fontSize:10,cursor:"pointer",appearance:"none"}}>
                  <option value="">no genre</option>
                  {genres.map(g=><option key={g} value={g}>{g}</option>)}
                </select>
                <button onClick={applyBatchGenre} disabled={selectedIds.size===0 || batchSaving}
                  style={{background:selectedIds.size>0?"linear-gradient(135deg,#4338ca,#6366f1)":"#2a2a40",border:"none",borderRadius:6,padding:"5px 12px",color:selectedIds.size>0?"#fff":"#555",fontSize:10,cursor:selectedIds.size>0?"pointer":"default",fontWeight:600}}>
                  {batchSaving ? "..." : "apply"}
                </button>
              </div>
            )}
          </div>
          <div style={{display:"flex",gap:6,flexShrink:0}}>
            <button onClick={() => {
              const playable = filtered.filter(s => s.audioFile);
              if (playable.length === 0) return;
              const shuffled = [...playable].sort(() => Math.random() - 0.5);
              setPlayerQueue(shuffled);
              setPlayerQueueIdx(0);
              play(shuffled[0].audioFile);
              switchTab("player");
            }}
              style={{background:"none",border:"1px solid #2a2a45",borderRadius:8,padding:"6px 12px",color:"#8a8aa0",fontSize:11,cursor:"pointer"}}
              onMouseEnter={e=>e.target.style.borderColor="#4338ca"} onMouseLeave={e=>e.target.style.borderColor="#2a2a45"}>
              shuffle
            </button>
            <button onClick={() => {
              const playable = filtered.filter(s => s.audioFile);
              if (playable.length === 0) return;
              setPlayerQueue([...playable]);
              setPlayerQueueIdx(0);
              play(playable[0].audioFile);
              switchTab("player");
            }}
              style={{background:"none",border:"1px solid #2a2a45",borderRadius:8,padding:"6px 12px",color:"#8a8aa0",fontSize:11,cursor:"pointer"}}
              onMouseEnter={e=>e.target.style.borderColor="#4338ca"} onMouseLeave={e=>e.target.style.borderColor="#2a2a45"}>
              ▶ play
            </button>
          </div>

        {filtered.length === 0 ? (

            <div style={{fontSize:64,marginBottom:16,animation:"float 3s ease-in-out infinite"}}>♪</div>
            <p style={{color:"#6b7280",fontSize:18}}>{songs.length===0?"Your library is empty":"No songs match your filters"}</p>
            {songs.length===0 && <p style={{color:"#6b6b80",fontSize:14,marginTop:4}}>Drop some files in the Upload tab</p>}
          </div>
        ) : (
          <VirtualList
            items={filtered}
            rowHeight={rowDensity === "compact" ? 32 : 86}
            gap={rowDensity === "compact" ? 4 : 6}
            overScan={6}
            renderRow={(s) => (
              <SongRow key={s.id} song={s}
                onDelete={selectMode ? undefined : handleDelete}
                onEdit={selectMode ? undefined : openEdit}
                selectable={selectMode}
                selected={selectedIds.has(s.id)}
                onToggleSelect={toggleSelect}
                listenTime={listenTimes[s.id]}
                compact={rowDensity === "compact"}
                playlists={playlists}
                onAddToPlaylist={async (songId, plId) => {
                  const pl = playlists.find(p => p.id === plId);
                  if (!pl) return;
                  const ids = [...(pl.songIds || [])];
                  if (ids.includes(songId)) { showToast("Already in " + pl.name); return; }
                  ids.push(songId);
                  await api.put("/api/playlists/" + plId, { ...pl, songIds: ids });
                  onRefresh();
                  showToast("Added to " + pl.name);
                }}
                onAddToQueue={(song) => {
                  setPlayerQueue(prev => [...(prev || []), song]);
                  showToast("Added to queue");
                }}
                onPlayNext={(song) => {
                  setPlayerQueue(prev => {
                    if (!prev || prev.length === 0) return [song];
                    return [...prev.slice(0, 1), song, ...prev.slice(1)];
                  });
                  showToast("Playing next");
                }}
              />
            )}
          />
        )}
      </div>

      <Modal open={modalOpen} onClose={()=>{setModalOpen(false);setEditingSong(null)}}>
        <SongEditForm song={editingSong} genres={genres} onSave={handleSave} onCancel={()=>{setModalOpen(false);setEditingSong(null)}} />
      </Modal>
      <ScrollToTop />
    </div>
  );
}

// ========== TAB: Upload (Drag & Drop Bulk) ==========
function UploadTab({ onRefresh, genres, songs, uploadFiles, setUploadFiles, uploading, uploadDone, setUploadDone, uploadProgress, startUpload }) {
  const [dragging, setDragging] = useState(false);
  const [dupes, setDupes] = useState([]);
  const inputRef = useRef(null);

  const existingNames = new Set(songs.map(s => (s.audioName || "").toLowerCase()));

  const BLOCKED_TYPES = ["audio/midi", "audio/x-midi"];
  const BLOCKED_EXTS = [".mid", ".midi"];

  const handleFiles = (fileList) => {
    const allAudio = Array.from(fileList).filter(f => f.type.startsWith("audio/"));
    const midiFiles = allAudio.filter(f => BLOCKED_TYPES.includes(f.type) || BLOCKED_EXTS.some(ext => f.name.toLowerCase().endsWith(ext)));
    const audioFiles = allAudio.filter(f => !BLOCKED_TYPES.includes(f.type) && !BLOCKED_EXTS.some(ext => f.name.toLowerCase().endsWith(ext)));

    if (midiFiles.length > 0) {
      showToast("⚠️ " + midiFiles.length + " MIDI file" + (midiFiles.length > 1 ? "s" : "") + " skipped — MIDI is not supported");
    }
    if (!audioFiles.length) return;

    const newDupes = [];
    const newFiles = [];
    for (const f of audioFiles) {
      if (existingNames.has(f.name.toLowerCase())) {
        newDupes.push(f.name);
      } else {
        newFiles.push(f);
      }
    }

    if (newFiles.length) {
      setUploadFiles(prev => {
        const existing = new Set(prev.map(f=>f.name));
        return [...prev, ...newFiles.filter(f=>!existing.has(f.name))];
      });
    }
    if (newDupes.length) {
      setDupes(newDupes);
    }
    setUploadDone(false);
  };

  const handleDrop = (e) => { e.preventDefault(); setDragging(false); handleFiles(e.dataTransfer.files); };
  const handleDragOver = (e) => { e.preventDefault(); setDragging(true); };
  const handleDragLeave = () => setDragging(false);
  const removeFile = (name) => setUploadFiles(prev=>prev.filter(f=>f.name!==name));

  const uploadPct = uploadProgress.total > 0 ? uploadProgress.done / uploadProgress.total : 0;

  return (
    <div>
      <div
        onDrop={handleDrop} onDragOver={handleDragOver} onDragLeave={handleDragLeave}
        onClick={()=>inputRef.current?.click()}
        style={{
          border: dragging ? "2px solid #818cf8" : "2px dashed #2a2a45",
          borderRadius:20, padding:"60px 40px", textAlign:"center",
          cursor:"pointer", transition:"all 0.3s",
          background: dragging ? "#4338ca11" : "#12121f44",
          marginBottom:24,
        }}
        onMouseEnter={e=>e.currentTarget.style.borderColor="#4338ca55"}
        onMouseLeave={e=>{if(!dragging)e.currentTarget.style.borderColor="#2a2a45"}}
      >
        <input ref={inputRef} type="file" accept="audio/mpeg,audio/wav,audio/ogg,audio/flac,audio/aac,audio/mp4,audio/webm,audio/x-m4a" multiple onChange={e=>handleFiles(e.target.files)} style={{display:"none"}} />
        <div style={{fontSize:48,marginBottom:16,opacity:0.6}}>{ dragging ? "⬇" : "♪" }</div>
        <p style={{color:"#818cf8",fontSize:18,marginBottom:8}}>
          {dragging ? "Drop your songs here" : "Drag & drop audio files here"}
        </p>
        <p style={{color:"#6b6b80",fontSize:13}}>or click to browse · mp3, wav, flac, m4a, ogg, etc.</p>
      </div>

      {/* Duplicate warning */}
      {dupes.length > 0 && (
        <div style={{background:"#2d1f00",border:"1px solid #f59e0b44",borderRadius:12,padding:"14px 18px",marginBottom:16,animation:"fadeUp 0.3s ease-out"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
            <span style={{color:"#f59e0b",fontSize:14,fontWeight:600}}>⚠ {dupes.length} duplicate{dupes.length!==1?"s":""} skipped</span>
            <button onClick={()=>setDupes([])} style={{background:"none",border:"none",color:"#f59e0b88",cursor:"pointer",fontSize:14,padding:0}}
              onMouseEnter={e=>e.target.style.color="#f59e0b"} onMouseLeave={e=>e.target.style.color="#f59e0b88"}>✕</button>
          </div>
          <div style={{color:"#f59e0baa",fontSize:12,maxHeight:100,overflowY:"auto"}}>
            {dupes.map(d=><div key={d} style={{padding:"2px 0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{d}</div>)}
          </div>
          <div style={{color:"#f59e0b66",fontSize:11,marginTop:6}}>These files already exist in your library</div>
        </div>
      )}

      {uploadFiles.length > 0 && !uploading && (
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <span style={{color:"#6b7280",fontSize:14}}>{uploadFiles.length} file{uploadFiles.length!==1?"s":""} ready</span>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setUploadFiles([])} style={{background:"none",border:"1px solid #2a2a45",borderRadius:10,padding:"8px 16px",color:"#6b7280",fontSize:13,cursor:"pointer",}}
                onMouseEnter={e=>e.target.style.color="#ef4444"} onMouseLeave={e=>e.target.style.color="#6b7280"}>clear all</button>
              <button onClick={()=>startUpload(uploadFiles)} style={{background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",borderRadius:10,padding:"8px 24px",color:"#fff",fontSize:13,cursor:"pointer",fontWeight:600}}>
                upload all</button>
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:400,overflowY:"auto",paddingRight:4}}>
            {uploadFiles.map((f,i) => (
              <div key={f.name} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"#16162a",border:"1px solid #2a2a40",borderRadius:10,padding:"10px 16px",animation:"slideIn 0.2s ease-out "+(i*0.03)+"s both"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{color:"#e2e8f0",fontSize:14,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{f.name.replace(/\.[^/.]+$/,"").replace(/[-_]/g," ")}</div>
                  <div style={{color:"#6b6b80",fontSize:11,marginTop:2}}>
                    {new Date(f.lastModified).toLocaleDateString()} · {(f.size/1024/1024).toFixed(1)} MB
                  </div>
                </div>
                <button onClick={()=>removeFile(f.name)} style={{background:"none",border:"none",color:"#6b6b80",cursor:"pointer",fontSize:16,padding:"4px 8px",marginLeft:8}}
                  onMouseEnter={e=>e.target.style.color="#ef4444"} onMouseLeave={e=>e.target.style.color="#6b6b80"}>✕</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Upload in progress shown in this tab too */}
      {uploading && (
        <div style={{background:"#16162a",border:"1px solid #2a2a45",borderRadius:14,padding:20,textAlign:"center"}}>
          <div style={{marginBottom:12}}>
            <span style={{color:"#818cf8",fontSize:15}}>Uploading {uploadProgress.done} / {uploadProgress.total} songs</span>
          </div>
          <div style={{height:8,background:"#1a1a2e",borderRadius:4,overflow:"hidden",marginBottom:8}}>
            <div style={{width:(uploadPct*100)+"%",height:"100%",background:"linear-gradient(90deg,#4338ca,#818cf8)",borderRadius:4,transition:"width 0.3s ease"}} />
          </div>
          <span style={{color:"#6b7280",fontSize:12}}>{Math.round(uploadPct*100)}% · You can switch tabs, upload will continue</span>
        </div>
      )}

      {uploadDone && uploadFiles.length === 0 && !uploading && (
        <div style={{textAlign:"center",padding:40,animation:"fadeUp 0.4s ease-out"}}>
          <div style={{fontSize:40,marginBottom:12}}>✓</div>
          <p style={{color:"#818cf8",fontSize:16,}}>Songs uploaded successfully!</p>
          <p style={{color:"#6b6b80",fontSize:13,marginTop:4}}>Check the Library tab to see them</p>
        </div>
      )}
    </div>
  );
}

// ========== Ranking Engine ==========
// Two-phase system:
// Phase 1 "Placement": every song gets ~3 comparisons against tier markers to land in a rough position
// Phase 2 "Refinement": closest-Elo pairs to fine-tune ordering (only available after phase 1 complete)

function useRanking(songs, comparisons) {
  return React.useMemo(() => {
    if (songs.length < 2) return { standings: [], compMap: {}, compCount: {}, unrankedCount: 0, rankedCount: 0, phase: 1, placementPct: 0, eloSnapshots: [] };

    const compMap = {};
    const compPairCount = {};
    comparisons.forEach(c => {
      const key = [c.songA, c.songB].sort().join("|");
      compMap[key] = c.winner;
      compPairCount[key] = (compPairCount[key] || 0) + 1;
    });

    const elo = {}, wins = {}, losses = {};
    const eloMin = {}, eloMax = {};
    songs.forEach(s => { elo[s.id] = 500; wins[s.id] = 0; losses[s.id] = 0; eloMin[s.id] = 500; eloMax[s.id] = 500; });

    // Track elo at the time of each comparison for propagation
    const eloSnapshots = [];

    // Base K-factors by comparison source
    // Bracket is the most deliberate — highest impact per comparison
    // Classic (1v1) is also very deliberate
    // Tier sort generates many bulk comparisons — lower weight so they don't dominate
    const SOURCE_K = { tier: 24, quick: 32, classic: 48, bracket: 56 };

    // Dampening function: gently reduces Elo changes for songs at extremes
    const getDampedK = (currentElo, source) => {
      const baseK = SOURCE_K[source] || 40;
      const distFromCenter = Math.abs(currentElo - 500) / 500; // 0 at center, 1 at extremes
      const dampening = 1 - (distFromCenter * 0.4); // 1.0 at center, 0.6 at extremes
      return baseK * dampening;
    };

    comparisons.forEach((c, ci) => {
      const ra = elo[c.songA] || 500, rb = elo[c.songB] || 500;
      eloSnapshots.push({ songA: c.songA, songB: c.songB, winner: c.winner, eloA: ra, eloB: rb, index: ci });
      const ea = 1 / (1 + Math.pow(10, (rb - ra) / 400));
      const eb = 1 / (1 + Math.pow(10, (ra - rb) / 400));
      const src = c.source || "classic";
      const kA = getDampedK(ra, src);
      const kB = getDampedK(rb, src);
      if (c.winner === c.songA) {
        elo[c.songA] = Math.max(0, Math.min(1000, ra + kA * (1 - ea)));
        elo[c.songB] = Math.max(0, Math.min(1000, rb + kB * (0 - eb)));
        wins[c.songA] = (wins[c.songA]||0) + 1; losses[c.songB] = (losses[c.songB]||0) + 1;
      } else {
        elo[c.songB] = Math.max(0, Math.min(1000, rb + kB * (1 - eb)));
        elo[c.songA] = Math.max(0, Math.min(1000, ra + kA * (0 - ea)));
        wins[c.songB] = (wins[c.songB]||0) + 1; losses[c.songA] = (losses[c.songA]||0) + 1;
      }
      // Track min/max
      if (elo[c.songA] < eloMin[c.songA]) eloMin[c.songA] = elo[c.songA];
      if (elo[c.songA] > eloMax[c.songA]) eloMax[c.songA] = elo[c.songA];
      if (elo[c.songB] < eloMin[c.songB]) eloMin[c.songB] = elo[c.songB];
      if (elo[c.songB] > eloMax[c.songB]) eloMax[c.songB] = elo[c.songB];
    });

    // Store final elo for propagation reference
    const finalElo = { ...elo };

    const compCount = {};
    songs.forEach(s => compCount[s.id] = 0);
    comparisons.forEach(c => { compCount[c.songA]=(compCount[c.songA]||0)+1; compCount[c.songB]=(compCount[c.songB]||0)+1; });

    const lastCompared = {};
    comparisons.forEach(c => {
      const t = c.timestamp || 0;
      if (!lastCompared[c.songA] || t > lastCompared[c.songA]) lastCompared[c.songA] = t;
      if (!lastCompared[c.songB] || t > lastCompared[c.songB]) lastCompared[c.songB] = t;
    });

    const PLACEMENT_MIN = 3;
    const placedCount = songs.filter(s => compCount[s.id] >= PLACEMENT_MIN).length;
    const unrankedCount = songs.filter(s => compCount[s.id] < PLACEMENT_MIN).length;
    const phase = placedCount >= songs.length ? 2 : 1;
    const placementPct = songs.length > 0 ? placedCount / songs.length : 0;

    const standings = songs
      .map(s => ({
        ...s,
        elo: Math.round(s.baseElo != null ? s.baseElo : (elo[s.id] || 500)),
        eloRaw: Math.round(elo[s.id] || 500),
        eloMin: Math.round(eloMin[s.id] || 500),
        eloMax: Math.round(eloMax[s.id] || 500),
        wins: wins[s.id] || 0,
        losses: losses[s.id] || 0,
        lastComparedAt: lastCompared[s.id] || 0,
        totalComparisons: compCount[s.id] || 0,
      }))
      .sort((a, b) => b.elo - a.elo);

    return { standings, compMap, compPairCount, compCount, unrankedCount, rankedCount: songs.length - unrankedCount, phase, placementPct, eloSnapshots, finalElo };
  }, [songs, comparisons]);
}

// Phase 1: binary-search style placement
// Each comparison narrows where a song belongs: win → test higher, lose → test lower
function getPlacementPair(standings, compMap, compCount, genre, compPairCount) {
  const pool = genre ? standings.filter(s => s.genre === genre) : standings;
  if (pool.length < 2) return null;

  // Initial placement always needs 3 comparisons
  // After all songs have 3, new songs added later get more (5-7) for accuracy
  const allHaveBase = pool.every(s => (compCount[s.id] || 0) >= 3);
  const unrankedCount = pool.filter(s => (compCount[s.id] || 0) === 0).length;

  const getThreshold = (songId) => {
    if (!allHaveBase) return 3; // first pass: always 3
    const comps = compCount[songId] || 0;
    if (comps >= 3) return 3; // already placed songs keep threshold 3
    // New songs added after initial placement get more
    return unrankedCount > 5 ? 4 : unrankedCount > 1 ? 5 : 7;
  };

  const needsPlacement = [...pool].filter(s => compCount[s.id] < getThreshold(s.id));
  if (needsPlacement.length === 0) return null;

  // Pick target: fewest comparisons, spread across songs (round-robin)
  needsPlacement.sort((a, b) => compCount[a.id] - compCount[b.id]);
  const minCount = compCount[needsPlacement[0].id];
  const sameCount = needsPlacement.filter(s => compCount[s.id] === minCount);
  const target = sameCount[Math.floor(Math.random() * sameCount.length)];

  // Binary search opponent: based on target's current Elo position in the pool
  const byElo = [...pool].sort((a, b) => a.elo - b.elo);
  const targetIdx = byElo.findIndex(s => s.id === target.id);
  const targetComps = compCount[target.id] || 0;

  // Determine search range based on previous results
  // Comparison 0: test against median
  // Comparison 1: test against quartile based on result
  // Comparison 2+: test against nearby songs to fine-tune
  let candidates = [];

  if (targetComps === 0) {
    // First comparison: median opponent
    const medIdx = Math.floor(byElo.length / 2);
    candidates = [byElo[medIdx]];
  } else if (targetComps === 1) {
    // Second comparison: if above median go to 75th, if below go to 25th
    const medianElo = byElo[Math.floor(byElo.length / 2)]?.elo || 500;
    if (target.elo >= medianElo) {
      candidates = [byElo[Math.floor(byElo.length * 0.75)]];
    } else {
      candidates = [byElo[Math.floor(byElo.length * 0.25)]];
    }
  } else {
    // Further comparisons: test against close neighbors (±10% of pool)
    const range = Math.max(2, Math.floor(byElo.length * 0.1));
    const lo = Math.max(0, targetIdx - range);
    const hi = Math.min(byElo.length - 1, targetIdx + range);
    for (let i = lo; i <= hi; i++) {
      if (byElo[i].id !== target.id) candidates.push(byElo[i]);
    }
    // Sort by closest Elo for tightest test
    candidates.sort((a, b) => Math.abs(a.elo - target.elo) - Math.abs(b.elo - target.elo));
  }

  // Pick first candidate not yet compared to target
  for (const c of candidates) {
    if (c.id === target.id) continue;
    const key = [target.id, c.id].sort().join("|");
    if (compMap[key]) continue;
    return [target, c];
  }

  // Fallback: any uncompared song, prefer those with more comparisons (more stable position)
  const fallbacks = [...pool]
    .filter(s => s.id !== target.id)
    .sort((a, b) => (compCount[b.id] || 0) - (compCount[a.id] || 0));
  for (const other of fallbacks) {
    const key = [target.id, other.id].sort().join("|");
    if (!compMap[key]) return [target, other];
  }
  return null;
}

// Phase 2: prioritize testing high-Elo songs, cap over-compared songs
function getRefinementPair(standings, compMap, genre, compCount) {
  const pool = genre ? standings.filter(s => s.genre === genre) : standings;
  if (pool.length < 2) return null;
  const sorted = [...pool].sort((a, b) => b.elo - a.elo);

  // Average comparisons per song
  const totalComps = sorted.reduce((s, x) => s + (compCount[x.id] || 0), 0);
  const avgComps = totalComps / sorted.length || 1;
  const compCap = avgComps * 2.5;

  // --- Smart targeting: find adjacent pairs that haven't faced each other ---
  // These are the most informative comparisons (resolving ambiguity in the ranking)
  const adjacentUncompared = [];
  for (let i = 0; i < sorted.length - 1; i++) {
    const key = [sorted[i].id, sorted[i+1].id].sort().join("|");
    if (!compMap[key]) {
      const eloDiff = Math.abs(sorted[i].elo - sorted[i+1].elo);
      adjacentUncompared.push({ a: sorted[i], b: sorted[i+1], diff: eloDiff, idx: i });
    }
  }

  // 50% chance to pick an adjacent uncompared pair (highest priority for ranking accuracy)
  if (adjacentUncompared.length > 0 && Math.random() < 0.5) {
    // Prefer pairs with small Elo difference (most uncertain)
    adjacentUncompared.sort((a, b) => a.diff - b.diff);
    const pick = adjacentUncompared[Math.floor(Math.random() * Math.min(5, adjacentUncompared.length))];
    return [pick.a, pick.b];
  }

  // --- Anti-outlier: detect songs at extremes with few diverse opponents ---
  const extremeThreshold = Math.max(1, Math.floor(sorted.length * 0.15));
  if (Math.random() < 0.2 && sorted.length >= 8) {
    const extremes = [...sorted.slice(0, extremeThreshold), ...sorted.slice(-extremeThreshold)];
    const midStart = Math.floor(sorted.length * 0.3);
    const midEnd = Math.floor(sorted.length * 0.7);
    const mids = sorted.slice(midStart, midEnd);
    if (extremes.length > 0 && mids.length > 0) {
      const ext = extremes[Math.floor(Math.random() * extremes.length)];
      const unfaced = mids.filter(m => m.id !== ext.id && !compMap[[ext.id, m.id].sort().join("|")]);
      if (unfaced.length > 0) {
        return [ext, unfaced[Math.floor(Math.random() * unfaced.length)]];
      }
    }
  }

  // --- Standard weighted pairing ---
  const candidates = sorted.map((s, i) => {
    const comps = compCount[s.id] || 0;
    const rankWeight = Math.max(0.1, 1 - (i / sorted.length) * 0.7);
    const capPenalty = comps > compCap ? 0.15 : 1;
    return { song: s, weight: rankWeight * capPenalty, index: i };
  });

  const totalWeight = candidates.reduce((s, c) => s + c.weight, 0);
  let roll = Math.random() * totalWeight;
  let songA = candidates[0];
  for (const c of candidates) {
    roll -= c.weight;
    if (roll <= 0) { songA = c; break; }
  }

  // Pick song B: close-Elo opponents (60%) or upward challenges (40%)
  const goUp = Math.random() < 0.4 && songA.index > 0;
  let bestPair = null, bestScore = -Infinity;

  if (goUp) {
    for (let i = songA.index - 1; i >= 0; i--) {
      const key = [songA.song.id, sorted[i].id].sort().join("|");
      if (compMap[key]) continue;
      const bComps = compCount[sorted[i].id] || 0;
      if (bComps > compCap) continue;
      const dist = songA.song.elo - sorted[i].elo;
      const score = 100 - Math.abs(dist) * 0.3 + (1 - i / sorted.length) * 30;
      if (score > bestScore) { bestScore = score; bestPair = [songA.song, sorted[i]]; }
      if (songA.index - i > 15) break;
    }
  }

  if (!bestPair) {
    const searchStart = Math.max(0, songA.index - 10);
    const searchEnd = Math.min(sorted.length, songA.index + 15);
    for (let i = searchStart; i < searchEnd; i++) {
      if (i === songA.index) continue;
      const key = [songA.song.id, sorted[i].id].sort().join("|");
      if (compMap[key]) continue;
      const bComps = compCount[sorted[i].id] || 0;
      if (bComps > compCap) continue;
      const dist = Math.abs(songA.song.elo - sorted[i].elo);
      const score = 100 - dist;
      if (score > bestScore) { bestScore = score; bestPair = [songA.song, sorted[i]]; }
    }
  }

  // Fallback: any uncompared pair
  if (!bestPair) {
    for (let i = 0; i < sorted.length; i++) {
      for (let j = i + 1; j < sorted.length; j++) {
        const key = [sorted[i].id, sorted[j].id].sort().join("|");
        if (!compMap[key]) return [sorted[i], sorted[j]];
      }
    }
  }

  return bestPair && bestPair[0].id !== bestPair[1].id ? bestPair : null;
}

// ========== TAB: Compare ==========
const REFINE_TARGET = 3; // fallback

function BattleTab({ songs, comparisons, onRefresh, showToast, savedPair, setSavedPair, hasSeenIntro, setHasSeenIntro, hasSeenPhase2, setHasSeenPhase2, focusedSessionSongs, setFocusedSessionSongs, stopAudio, sessionLength, bracketSize: bracketSizeProp }) {
  const refineTarget = sessionLength === "short" ? 2 : sessionLength === "long" ? 5 : REFINE_TARGET;
  const bracketSize = bracketSizeProp || 8;
  const [picking, setPicking] = useState(false);
  const [undoing, setUndoing] = useState(false);
  const ranking = useRanking(songs, comparisons);
  const { standings, compMap, compCount, compPairCount } = ranking;

  // Guided session state: null = landing, "tier" | "quick" | "refine" | "summary"
  const [sessionPhase, setSessionPhase] = useState(null);
  const [refineCompCount, setRefineCompCount] = useState(0);
  const refineCompRef = useRef(0);
  const [refineSubPhase, setRefineSubPhase] = useState("classic"); // "classic" → "bracket" cycles
  const [refineRound, setRefineRound] = useState(0); // which round we're on (0-indexed)
  const totalRounds = sessionLength === "short" ? 1 : sessionLength === "long" ? 3 : 2;
  const classicsPerRound = 3;

  // Session tracking (Elo snapshots for summary)
  const [sessionStartElos, setSessionStartElos] = useState({});
  const [sessionStartComps, setSessionStartComps] = useState({});
  const [sessionSummaryData, setSessionSummaryData] = useState(null);
  const sessionTotalRef = useRef(0);
  const [sessionCompTotal, setSessionCompTotal] = useState(0);
  const sessionHadUnranked = useRef(false);

  // Focused session (subset of songs from chart selection)
  const [focusedSongIds, setFocusedSongIds] = useState(null);
  const focusedRefineTarget = useRef(refineTarget);

  // Derived
  const PLACEMENT_MIN = 3;
  const unrankedCount = songs.filter(s => (compCount[s.id] || 0) < PLACEMENT_MIN).length;
  const allPlaced = songs.length >= 2 && unrankedCount === 0;

  // Phase 2 popup (all songs placed for the first time)
  const [showPhase2, setShowPhase2] = useState(false);
  const prevAllPlaced = useRef(allPlaced);
  useEffect(() => {
    const justCompleted = allPlaced && !prevAllPlaced.current;
    if ((justCompleted || (allPlaced && !hasSeenPhase2 && comparisons.length > 0)) && !hasSeenPhase2) {
      setShowPhase2(true);
      setHasSeenPhase2(true);
    }
    prevAllPlaced.current = allPlaced;
  }, [allPlaced, hasSeenPhase2, comparisons.length]);

  // Snapshot Elo state for session summary
  const snapshotSession = useCallback(() => {
    const snap = {};
    const compSnap = {};
    // Use ranking-derived Elo for accurate session deltas
    standings.forEach(s => { snap[s.id] = s.elo; });
    songs.forEach(s => { if (!(s.id in snap)) snap[s.id] = 500; compSnap[s.id] = 0; });
    comparisons.forEach(c => { compSnap[c.songA] = (compSnap[c.songA]||0)+1; compSnap[c.songB] = (compSnap[c.songB]||0)+1; });
    setSessionStartElos(snap);
    setSessionStartComps(compSnap);
    sessionTotalRef.current = 0;
    refineCompRef.current = 0;
    setRefineCompCount(0);
    setSessionCompTotal(0);
    setRefineSubPhase("classic");
    setRefineRound(0);
  }, [songs, comparisons, standings]);

  // Auto-start focused session when focusedSessionSongs is set from StatsTab
  useEffect(() => {
    if (focusedSessionSongs && focusedSessionSongs.length >= 8) {
      setFocusedSongIds(focusedSessionSongs);
      focusedRefineTarget.current = Math.min(15, refineTarget + Math.floor((focusedSessionSongs.length - 8) / 4));
      snapshotSession();
      setSessionSummaryData(null);
      sessionHadUnranked.current = false;
      setSessionPhase("refine");
      setRefineSubPhase("classic");
      setRefineRound(0);
      setFocusedSessionSongs(null);
    }
  }, [focusedSessionSongs]);

  // Build session summary
  const buildSessionSummary = useCallback(() => {
    const touched = [];
    standings.forEach(s => {
      const startElo = sessionStartElos[s.id] ?? 500;
      const delta = s.elo - startElo;
      const startComps = sessionStartComps[s.id] || 0;
      const nowComps = compCount[s.id] || 0;
      const sessionComps = nowComps - startComps;
      if (sessionComps > 0) {
        touched.push({ id: s.id, title: s.title, genre: s.genre, elo: s.elo, delta, startElo, sessionComps, totalComps: nowComps, isNewlyPlaced: startComps < 3 && nowComps >= 3 });
      }
    });

    // Sort by final Elo for placement list
    const placed = touched.filter(m => m.isNewlyPlaced).sort((a, b) => b.elo - a.elo);
    const allTouched = [...touched].sort((a, b) => b.elo - a.elo);

    // Highest and lowest rated songs in the session
    const highest = allTouched.length > 0 ? allTouched[0] : null;
    const lowest = allTouched.length > 0 ? allTouched[allTouched.length - 1] : null;

    // Genre breakdown
    const genreMap = {};
    allTouched.forEach(s => {
      const g = s.genre || "Uncategorized";
      if (!genreMap[g]) genreMap[g] = { count: 0, totalElo: 0 };
      genreMap[g].count++;
      genreMap[g].totalElo += s.elo;
    });
    const genres = Object.entries(genreMap).map(([name, data]) => ({
      name, count: data.count, avgElo: Math.round(data.totalElo / data.count)
    })).sort((a, b) => b.avgElo - a.avgElo);

    // Elo spread
    const elos = allTouched.map(s => s.elo);
    const spread = elos.length >= 2 ? Math.max(...elos) - Math.min(...elos) : 0;

    return {
      placed,
      allTouched,
      highest,
      lowest,
      genres,
      spread,
      totalComps: sessionTotalRef.current,
      songsAffected: allTouched.length,
      newlyPlacedCount: placed.length,
    };
  }, [standings, sessionStartElos, sessionStartComps, compCount, comparisons]);

  // Start a guided session
  const startSession = () => {
    snapshotSession();
    setSessionSummaryData(null);
    setFocusedSongIds(null);
    focusedRefineTarget.current = refineTarget;
    sessionHadUnranked.current = unrankedCount > 0;
    if (unrankedCount > 0) {
      setSessionPhase("tier");
    } else {
      setSessionPhase("refine");
    }
  };

  // Phase transitions
  const advanceFromTier = () => {
    // After tier sort batch, check if there are still unranked songs for quick rate
    const stillUnranked = songs.filter(s => (compCount[s.id] || 0) < PLACEMENT_MIN).length;
    if (stillUnranked > 0) {
      setSessionPhase("quick");
    } else {
      setSessionPhase("refine");
    }
  };

  const advanceFromQuick = () => {
    setSessionPhase("refine");
  };

  const triggerSummary = () => {
    stopAudio();
    setSessionSummaryData(buildSessionSummary());
    setSessionPhase("summary");
  };

  // Submit comparison helper (used by all modes)
  const submitComparison = async (winnerId, loserId, source = "classic") => {
    if (winnerId === loserId) return false;
    const key = [winnerId, loserId].sort().join("|");
    if (compMap[key]) return false;
    await api.post("/api/comparisons", { songA: winnerId, songB: loserId, winner: winnerId, source });
    sessionTotalRef.current++;
    setSessionCompTotal(prev => prev + 1);

    // Track refine-phase classic comparisons for auto-trigger
    if (sessionPhase === "refine" && refineSubPhase === "classic") {
      refineCompRef.current++;
      setRefineCompCount(refineCompRef.current);
    }
    return true;
  };

  // Auto-switch to bracket when classic refine target is hit
  useEffect(() => {
    if (sessionPhase !== "refine" || refineSubPhase !== "classic") return;
    const targetForThisRound = classicsPerRound * (refineRound + 1);
    if (refineCompCount >= targetForThisRound) {
      stopAudio();
      setRefineSubPhase("bracket");
    }
  }, [refineCompCount, sessionPhase, refineSubPhase, refineRound]);

  const undoLast = async () => {
    if (!comparisons.length || undoing) return;
    setUndoing(true);
    stopAudio();
    await api.del("/api/comparisons/last");
    setSavedPair(null);
    if (sessionTotalRef.current > 0) {
      sessionTotalRef.current--;
      setSessionCompTotal(prev => Math.max(0, prev - 1));
    }
    if (sessionPhase === "refine" && refineCompRef.current > 0) {
      refineCompRef.current--;
      setRefineCompCount(refineCompRef.current);
    }
    await onRefresh();
    setUndoing(false);
    showToast("Undone");
  };

  // ========== RENDERING ==========
  if (songs.length < 2) return (
    <div style={{textAlign:"center",padding:80}}>
      <p style={{color:"#8a8aa0",fontSize:18}}>Need at least 2 songs to start comparing</p>
    </div>
  );

  // Session phase indicator bar
  // Session progress: phase-based (each phase = a chunk of progress)
  const getSessionProgress = () => {
    if (!sessionPhase || sessionPhase === "summary") return 100;
    const hasPlacement = sessionHadUnranked.current;
    // Estimate: each round = classicsPerRound + (bracketSize-1) comparisons
    const compsPerRound = classicsPerRound + (bracketSize - 1);
    const refineTotal = totalRounds * compsPerRound;
    const estimatedTotal = hasPlacement ? refineTotal + 20 : refineTotal;
    return Math.min(99, Math.round(sessionCompTotal / estimatedTotal * 99));
  };
  const sessionPct = getSessionProgress();

  const ProgressBar = () => {
    if (!sessionPhase || sessionPhase === "summary") return null;
    return (
      <div style={{marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <span style={{color:"#818cf8",fontSize:12,fontWeight:700}}>{sessionPct}%</span>
          <button onClick={() => { stopAudio(); setSessionPhase(null); }}
            style={{background:"#ef444420",border:"1px solid #ef444440",borderRadius:8,color:"#ef4444",fontSize:11,fontWeight:600,cursor:"pointer",padding:"5px 12px"}}>✕ end session</button>
        </div>
        <div style={{height:5,background:"#1a1a2e",borderRadius:3,overflow:"hidden"}}>
          <div style={{width:sessionPct+"%",height:"100%",background:"linear-gradient(90deg,#4338ca,#818cf8)",borderRadius:3,transition:"width 0.4s ease"}} />
        </div>
      </div>
    );
  };

  // ========== SESSION SUMMARY ==========
  const renderSessionSummary = () => {
    if (!sessionSummaryData) return null;
    const d = sessionSummaryData;
    const cardBg = {background:"#14142a",border:"1px solid #1e1e35",borderRadius:12,padding:16,marginBottom:12};
    const totalSongs = songs.length;
    const totalPlaced = songs.filter(s => (compCount[s.id] || 0) >= PLACEMENT_MIN).length;

    return (
      <div>
        <div style={{textAlign:"center",marginBottom:24}}>
          <span style={{fontSize:36}}>📊</span>
          <h2 style={{margin:"8px 0 4px",color:"#e2e8f0",fontSize:22,fontWeight:700}}>Session Complete</h2>
          <p style={{color:"#6b6b80",fontSize:13,margin:0}}>{d.totalComps} comparisons · {d.songsAffected} songs ranked</p>
        </div>

        {/* Stats grid */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:16}}>
          {[
            { label: "placed", value: totalPlaced + "/" + totalSongs, color: "#818cf8" },
            { label: "comparisons", value: d.totalComps, color: "#22c55e" },
            { label: "elo spread", value: d.spread, color: "#f59e0b" },
          ].map(s => (
            <div key={s.label} style={{background:"#0d0d1a",border:"1px solid #1e1e35",borderRadius:10,padding:"10px",textAlign:"center"}}>
              <div style={{color:s.color,fontSize:18,fontWeight:700}}>{s.value}</div>
              <div style={{color:"#6b6b80",fontSize:9,textTransform:"uppercase",letterSpacing:"0.06em",marginTop:2}}>{s.label}</div>
            </div>
          ))}
        </div>

        {/* Highest and lowest */}
        {(d.highest || d.lowest) && (
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            {d.highest && (
              <div style={{...cardBg,marginBottom:0,textAlign:"center",padding:14}}>
                <div style={{color:"#22c55e",fontSize:9,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6,fontWeight:700}}>🔥 highest rated</div>
                <div style={{color:"#e2e8f0",fontSize:14,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{d.highest.title}</div>
                <div style={{color:"#22c55e",fontSize:16,fontWeight:700,marginTop:4}}>{d.highest.elo}</div>
              </div>
            )}
            {d.lowest && d.lowest.id !== d.highest?.id && (
              <div style={{...cardBg,marginBottom:0,textAlign:"center",padding:14}}>
                <div style={{color:"#ef4444",fontSize:9,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6,fontWeight:700}}>💀 lowest rated</div>
                <div style={{color:"#e2e8f0",fontSize:14,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{d.lowest.title}</div>
                <div style={{color:"#ef4444",fontSize:16,fontWeight:700,marginTop:4}}>{d.lowest.elo}</div>
              </div>
            )}
          </div>
        )}

        {/* Songs placed this session */}
        {d.placed.length > 0 && (
          <div style={cardBg}>
            <div style={{color:"#818cf8",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Songs placed this session</div>
            {d.placed.map((s, i) => (
              <div key={s.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:i < d.placed.length - 1 ? "1px solid #1e1e3520" : "none"}}>
                <span style={{color:"#6b6b80",fontSize:11,minWidth:20,textAlign:"right"}}>{i+1}.</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{color:"#e2e8f0",fontSize:13,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.title}</div>
                  {s.genre && <span style={{color:"#6b6b80",fontSize:10}}>{s.genre}</span>}
                </div>
                <span style={{color:"#818cf8",fontSize:13,fontWeight:600,flexShrink:0}}>{s.elo}</span>
              </div>
            ))}
          </div>
        )}

        {/* Genre breakdown */}
        {d.genres.length > 1 && (
          <div style={cardBg}>
            <div style={{color:"#f59e0b",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>By genre</div>
            {d.genres.map(g => (
              <div key={g.name} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #1e1e3520"}}>
                <span style={{color:"#e2e8f0",fontSize:12}}>{g.name}</span>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{color:"#6b6b80",fontSize:11}}>{g.count} song{g.count !== 1 ? "s" : ""}</span>
                  <span style={{color:"#f59e0b",fontSize:12,fontWeight:600,minWidth:36,textAlign:"right"}}>{g.avgElo}</span>
                </div>
              </div>
            ))}
          </div>
        )}

        {d.songsAffected === 0 && (
          <div style={{...cardBg,textAlign:"center",padding:24}}>
            <span style={{fontSize:24}}>🎯</span>
            <p style={{color:"#a0a0b0",fontSize:14,margin:"8px 0 0"}}>No new rankings this session.</p>
          </div>
        )}

        <div style={{display:"flex",gap:10,marginTop:8}}>
          <button onClick={startSession}
            style={{flex:1,padding:"14px",borderRadius:12,background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",color:"#fff",fontSize:15,fontWeight:600,cursor:"pointer"}}>
            New session
          </button>
          <button onClick={() => { setSessionPhase(null); }}
            style={{padding:"14px 20px",borderRadius:12,background:"none",border:"1px solid #2a2a45",color:"#6b6b80",fontSize:14,cursor:"pointer"}}>
            Done
          </button>
        </div>
      </div>
    );
  };

  // ========== MAIN RETURN ==========
  return (
    <div>
      {/* Phase 2 Popup */}
      {showPhase2 && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={()=>setShowPhase2(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#14142a",border:"1px solid #2a2a45",borderRadius:20,padding:"36px 32px",maxWidth:440,width:"100%",animation:"fadeUp 0.3s ease-out",boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}>
            <div style={{textAlign:"center",marginBottom:24}}>
              <span style={{fontSize:40}}>🏆</span>
              <h2 style={{margin:"12px 0 0",color:"#e2e8f0",fontSize:22,fontWeight:600}}>All Songs Placed</h2>
            </div>
            <p style={{color:"#a0a0b0",fontSize:14,lineHeight:1.7,textAlign:"center"}}>Every song has initial rankings. Future sessions will focus on refining.</p>
            <button onClick={()=>setShowPhase2(false)}
              style={{width:"100%",padding:"12px",borderRadius:12,background:"linear-gradient(135deg,#22c55e,#16a34a)",border:"none",color:"#fff",fontSize:15,fontWeight:600,cursor:"pointer",marginTop:16}}>
              Continue
            </button>
          </div>
        </div>
      )}

      {/* ========== LANDING (no active session) ========== */}
      {!sessionPhase && (
        <div style={{animation:"fadeUp 0.2s ease-out"}}>
          {/* Session launcher */}
          <div style={{background:"linear-gradient(135deg,#14142a,#1a1535)",border:"1px solid #2a2a45",borderRadius:16,padding:"32px 24px",textAlign:"center",marginBottom:20}}>
            <span style={{fontSize:36}}>🎯</span>
            <h2 style={{margin:"12px 0 6px",color:"#e2e8f0",fontSize:20,fontWeight:700}}>Ranking Session</h2>
            <p style={{color:"#6b6b80",fontSize:13,margin:"0 0 20px",lineHeight:1.6}}>
              {unrankedCount > 0
                ? unrankedCount + " unranked song" + (unrankedCount !== 1 ? "s" : "")
                : "A few quick comparisons to sharpen your rankings"
              }
            </p>

            <button onClick={startSession}
              style={{padding:"14px 48px",borderRadius:14,background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer",boxShadow:"0 4px 20px rgba(99,102,241,0.3)"}}>
              Start Session
            </button>
          </div>

          {/* Quick stats */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:20}}>
            {[
              { label: "songs", value: songs.length, color: "#818cf8" },
              { label: "compared", value: comparisons.length, color: "#22c55e" },
              { label: "unranked", value: unrankedCount, color: unrankedCount > 0 ? "#f59e0b" : "#22c55e" },
            ].map(s => (
              <div key={s.label} style={{background:"#14142a",border:"1px solid #1e1e35",borderRadius:10,padding:"12px",textAlign:"center"}}>
                <div style={{color:s.color,fontSize:20,fontWeight:700}}>{s.value}</div>
                <div style={{color:"#6b6b80",fontSize:10,textTransform:"uppercase",letterSpacing:"0.06em",marginTop:2}}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ========== GUIDED SESSION PHASES ========== */}
      {sessionPhase && sessionPhase !== "summary" && <ProgressBar />}

      {/* Tier Sort phase */}
      {sessionPhase === "tier" && (
        <TierMode songs={songs} standings={standings} compMap={compMap} compCount={compCount}
          submitComparison={submitComparison} onRefresh={onRefresh} showToast={showToast}
          onSessionAdvance={advanceFromTier} sessionMode={true} />
      )}

      {/* Quick Rate phase */}
      {sessionPhase === "quick" && (
        <QuickMode songs={songs} standings={standings} compMap={compMap} compCount={compCount}
          submitComparison={submitComparison} onRefresh={onRefresh} showToast={showToast} stopAudio={stopAudio}
          onSessionAdvance={advanceFromQuick} sessionMode={true} />
      )}

      {/* Refine phase */}
      {sessionPhase === "refine" && (() => {
        const focusSet = focusedSongIds ? new Set(focusedSongIds) : null;
        const refineSongs = focusSet ? songs.filter(s => focusSet.has(s.id)) : songs;
        const refineStandings = focusSet ? standings.filter(s => focusSet.has(s.id)) : standings;
        return (
          <div>
            {focusedSongIds && <div style={{background:"#4338ca10",border:"1px solid #4338ca30",borderRadius:8,padding:"6px 12px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{color:"#818cf8",fontSize:11}}>🎯 Focused session: {focusedSongIds.length} songs</span>
              <button onClick={() => { setFocusedSongIds(null); focusedRefineTarget.current = refineTarget; }} style={{background:"none",border:"none",color:"#6b7280",fontSize:10,cursor:"pointer"}}>✕ unfocus</button>
            </div>}
            {refineSubPhase === "classic" && <ClassicMode songs={refineSongs} standings={refineStandings} compMap={compMap} compCount={compCount} ranking={ranking}
              submitComparison={submitComparison} onRefresh={onRefresh} showToast={showToast} picking={picking} setPicking={setPicking}
              savedPair={savedPair} setSavedPair={setSavedPair} stopAudio={stopAudio} undoLast={undoLast} undoing={undoing} comparisons={comparisons} />}
            {refineSubPhase === "bracket" && <BracketMode songs={refineSongs} standings={refineStandings} compMap={compMap}
              submitComparison={submitComparison} onRefresh={onRefresh} showToast={showToast} stopAudio={stopAudio} bracketSize={bracketSize}
              onBracketComplete={() => {
                if (refineRound + 1 >= totalRounds) { triggerSummary(); }
                else { setRefineRound(r => r + 1); setRefineSubPhase("classic"); }
              }} />}
          </div>
        );
      })()}

      {/* Summary phase */}
      {sessionPhase === "summary" && renderSessionSummary()}

    </div>
  );
}

// Classic A vs B Mode
function ClassicMode({ songs, standings, compMap, compCount, ranking, submitComparison, onRefresh, showToast, picking, setPicking, savedPair, setSavedPair, stopAudio, undoLast, undoing, comparisons }) {
  const computedPair = useMemo(() => {
    const hasUnranked = songs.some(s => (compCount[s.id] || 0) < 3);
    if (hasUnranked) return getPlacementPair(standings, compMap, compCount, null, ranking.compPairCount);
    return getRefinementPair(standings, compMap, null, compCount);
  }, [standings, compMap, compCount, songs]);

  const isSavedPairValid = savedPair && savedPair[0] && savedPair[1] &&
    songs.find(s => s.id === savedPair[0].id) && songs.find(s => s.id === savedPair[1].id) &&
    !compMap[[savedPair[0].id, savedPair[1].id].sort().join("|")];
  const currentPair = (() => {
    const pair = isSavedPairValid ? savedPair : computedPair;
    if (pair && pair[0] && pair[1] && pair[0].id === pair[1].id) return null;
    return pair;
  })();

  useEffect(() => {
    if (currentPair && (!savedPair || currentPair[0]?.id !== savedPair[0]?.id || currentPair[1]?.id !== savedPair[1]?.id)) {
      setSavedPair(currentPair);
    }
  }, [currentPair]);

  const pick = async (winnerId, loserId) => {
    if (picking) return;
    setPicking(true);
    stopAudio();
    await submitComparison(winnerId, loserId);
    setSavedPair(null);
    await onRefresh();
    setPicking(false);
  };

  const renderCard = (song, onPick) => (
    <div>
      <div style={{background:"#14142a",border:"1px solid #2a2a45",borderRadius:16,padding:20}}>
