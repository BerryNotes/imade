                    <span style={{width:7,height:7,borderRadius:2,background:t.color,opacity:0.7}} />
                    <span style={{color:"#9a9ab0",fontSize:9}}>{t.label}: {count}</span>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}
      </div>
          </div>

        {/* ===== LISTENING TAB ===== */}
        <div style={{display: statsSubTab === "listening" ? "block" : "none"}}>
      {(() => {
        const entries = Object.entries(listenTimes || {}).filter(([id, t]) => t > 0 && songs.find(s => s.id === id));
        const totalListenSec = entries.reduce((sum, [, t]) => sum + t, 0);
        const topListened = entries
          .map(([id, t]) => ({ song: songs.find(s => s.id === id), time: t }))
          .filter(x => x.song)
          .sort((a, b) => b.time - a.time);
        const maxTime = topListened[0]?.time || 1;
        const fmtDur = (s) => {
          if (s < 60) return Math.round(s) + "s";
          if (s < 3600) return Math.floor(s/60) + "m " + Math.round(s%60) + "s";
          return Math.floor(s/3600) + "h " + Math.floor((s%3600)/60) + "m";
        };
        const genreTime = {};
        topListened.forEach(({ song, time }) => {
          const g = song.genre || "untagged";
          genreTime[g] = (genreTime[g] || 0) + time;
        });
        const genreTimeSorted = Object.entries(genreTime).sort((a,b) => b[1] - a[1]);
        const maxGenreTime = genreTimeSorted[0]?.[1] || 1;

        if (entries.length === 0) return (
          <div style={{...cardStyle,textAlign:"center",padding:40}}>
            <span style={{fontSize:32}}>🎧</span>
            <p style={{color:"#6b6b80",fontSize:14,marginTop:12}}>No listening data yet</p>
            <p style={{color:"#5a5a70",fontSize:12}}>Play songs in the app to start tracking</p>
          </div>
        );

        return (
          <div>
            <div style={{...cardStyle,marginBottom:16}}>
              <div style={headStyle}>overview</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                {[
                  { label: "total time", value: fmtDur(totalListenSec), color: "#22c55e" },
                  { label: "songs played", value: topListened.length, color: "#818cf8" },
                  { label: "coverage", value: (songs.length > 0 ? Math.round(topListened.length / songs.length * 100) : 0) + "%", color: "#f59e0b" },
                ].map(s => (
                  <div key={s.label} style={{background:"#0d0d1a",borderRadius:8,padding:"10px",textAlign:"center"}}>
                    <div style={{color:s.color,fontSize:18,fontWeight:700}}>{s.value}</div>
                    <div style={{color:"#6b6b80",fontSize:9,textTransform:"uppercase",marginTop:2}}>{s.label}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
              <div style={{...cardStyle,flex:"1 1 280px",minWidth:220}}>
                <div style={headStyle}>most listened</div>
                {topListened.slice(0, 10).map(({ song, time }, i) => (
                  <div key={song.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                    <span style={{color:i < 3 ? "#f59e0b" : "#5a5a70",fontSize:11,fontWeight:700,minWidth:20,textAlign:"right"}}>{i + 1}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <span style={{color:"#e2e8f0",fontSize:12,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{song.title}</span>
                        <span style={{color:"#22c55e",fontSize:10,flexShrink:0}}>{fmtDur(time)}</span>
                      </div>
                      <div style={{height:3,background:"#1e1e35",borderRadius:2,overflow:"hidden",marginTop:3}}>
                        <div style={{width:(time/maxTime*100)+"%",height:"100%",background:"linear-gradient(90deg,#22c55e,#4ade80)",borderRadius:2}} />
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {genreTimeSorted.length > 1 && (
                <div style={{...cardStyle,flex:"1 1 220px",minWidth:180}}>
                  <div style={headStyle}>time by genre</div>
                  {genreTimeSorted.slice(0, 10).map(([g, time]) => (
                    <div key={g} style={{marginBottom:6}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                        <span style={{color:"#e2e8f0",fontSize:11}}>{g}</span>
                        <span style={{color:"#6b6b80",fontSize:10}}>{fmtDur(time)}</span>
                      </div>
                      <div style={{height:3,background:"#1e1e35",borderRadius:2,overflow:"hidden",width:"80%"}}>
                        <div style={{width:(time/maxGenreTime*100)+"%",height:"100%",background:stats.genreColorMap[g]||"#818cf8",borderRadius:2,opacity:0.7}} />
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      })()}
          </div>
      </div>
    </div>
  );
}

// ========== TAB: Genres ==========
function SettingsTab({ genres, songs, comparisons, playlists, onRefresh, showToast, showVariance, setShowVariance,
  sessionLength, setSessionLength, bracketSize, setBracketSize, showWinLoss, setShowWinLoss,
  theme, setTheme, rowDensity, setRowDensity, listenTimes, setListenTimes, listenTimesRef }) {
  const [newGenre, setNewGenre] = useState("");
  const [editingGenre, setEditingGenre] = useState(null);
  const [editName, setEditName] = useState("");
  const [settingsTab, setSettingsTab] = useState("general");
  const [showDelModal, setShowDelModal] = useState(false);
  const [delSongs, setDelSongs] = useState(false);
  const [delComps, setDelComps] = useState(false);
  const [delPlaylists, setDelPlaylists] = useState(false);
  const [delGenres, setDelGenres] = useState(false);
  const [delListenHistory, setDelListenHistory] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const [showExportPlaylists, setShowExportPlaylists] = useState(false);
  const ranking = useRanking(songs, comparisons);

  const addGenre = async () => {
    if (!newGenre.trim()) return;
    await api.post("/api/genres", { name: newGenre.trim() });
    setNewGenre("");
    onRefresh();
  };
  const deleteGenre = async (name) => {
    const affected = songs.filter(s => s.genre === name).map(s => s.id);
    if (affected.length > 0) {
      await api.patch("/api/songs/batch-genre", { ids: affected, genre: "" });
    }
    await api.del("/api/genres/" + encodeURIComponent(name));
    onRefresh();
  };
  const startEdit = (g) => { setEditingGenre(g); setEditName(g); };
  const saveEdit = async () => {
    if (!editName.trim() || editName.trim() === editingGenre) { setEditingGenre(null); return; }
    const affected = songs.filter(s => s.genre === editingGenre).map(s => s.id);
    if (affected.length > 0) {
      await api.patch("/api/songs/batch-genre", { ids: affected, genre: editName.trim() });
    }
    await api.put("/api/genres/" + encodeURIComponent(editingGenre), { name: editName.trim() });
    setEditingGenre(null);
    onRefresh();
  };

  const exportRankingsText = () => {
    const { standings } = ranking;
    const text = standings.map((s, i) => (i+1) + ". " + s.title + " (" + s.elo + ")").join("\n");
    navigator.clipboard.writeText(text);
    showToast("Rankings copied to clipboard");
  };

  const exportRankingsCSV = () => {
    const { standings } = ranking;
    const header = "Rank,Title,Genre,Elo,Wins,Losses\n";
    const rows = standings.map((s, i) => {
      const title = '"' + (s.title || "").replace(/"/g, '""') + '"';
      const genre = '"' + (s.genre || "") + '"';
      return (i+1) + "," + title + "," + genre + "," + s.elo + "," + s.wins + "," + s.losses;
    }).join("\n");
    const blob = new Blob([header + rows], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "rankings.csv"; a.click();
    URL.revokeObjectURL(url);
    showToast("Rankings CSV downloaded");
  };

  const exportBackup = async () => {
    const data = {
      songs: await api.get("/api/songs"),
      comparisons: await api.get("/api/comparisons"),
      genres: await api.get("/api/genres"),
      playlists: await api.get("/api/playlists"),
      exportedAt: new Date().toISOString(),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "imade-backup-" + new Date().toISOString().slice(0,10) + ".json"; a.click();
    URL.revokeObjectURL(url);
    showToast("Backup downloaded");
  };

  const serverBackup = async () => {
    const r = await api.post("/api/backup");
    if (r.name) showToast("Server backup: " + r.name);
  };

  const sec = { background:"#14142a",border:"1px solid #2a2a45",borderRadius:14,padding:"20px 22px",marginBottom:16 };
  const secT = { color:"#e2e8f0",fontSize:14,fontWeight:600,marginBottom:14,display:"flex",alignItems:"center",gap:8 };

  const Toggle = ({ value, onChange, label, desc }) => (
    <label style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",padding:"8px 0"}}>
      <div>
        <div style={{color:"#e2e8f0",fontSize:13}}>{label}</div>
        {desc && <div style={{color:"#6b6b80",fontSize:11,marginTop:2}}>{desc}</div>}
      </div>
      <div onClick={()=>onChange(!value)}
        style={{width:40,height:22,borderRadius:11,background:value?"#818cf8":"#2a2a45",cursor:"pointer",position:"relative",transition:"background 0.2s",flexShrink:0}}>
        <div style={{width:16,height:16,borderRadius:8,background:"#fff",position:"absolute",top:3,left:value?21:3,transition:"left 0.2s"}} />
      </div>
    </label>
  );

  const SegmentPicker = ({ value, options, onChange }) => (
    <div style={{display:"flex",background:"#0d0d1a",borderRadius:10,border:"1px solid #2a2a45",overflow:"hidden"}}>
      {options.map(opt => (
        <button key={opt.value} onClick={()=>onChange(opt.value)}
          style={{flex:1,padding:"8px 12px",border:"none",background:value===opt.value?"#4338ca":"transparent",color:value===opt.value?"#fff":"#6b6b80",fontSize:12,cursor:"pointer",fontWeight:value===opt.value?600:400,transition:"all 0.15s"}}>
          {opt.label}
        </button>
      ))}
    </div>
  );

  const tabs = [
    { id: "general", label: "General", icon: "⚙️" },
    { id: "genres", label: "Genres", icon: "🏷️" },
    { id: "data", label: "Data", icon: "💾" },
  ];

  return (
    <div style={{maxWidth:600,margin:"0 auto"}}>
      {/* Tab bar */}
      <div style={{display:"flex",gap:4,marginBottom:20,background:"#0d0d1a",borderRadius:12,padding:4}}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setSettingsTab(t.id)}
            style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"10px 14px",borderRadius:10,border:"none",
              background: settingsTab === t.id ? "#1e1e35" : "transparent",
              color: settingsTab === t.id ? "#e2e8f0" : "#6b6b80",
              fontSize:13,fontWeight: settingsTab === t.id ? 600 : 400,
              cursor:"pointer",transition:"all 0.15s"}}>
            <span style={{fontSize:13}}>{t.icon}</span> {t.label}
          </button>
        ))}
      </div>

      {/* ===== GENERAL TAB ===== */}
      {settingsTab === "general" && (
        <div>
          {/* Sessions */}
          <div style={sec}>
            <div style={secT}>🎯 Sessions</div>
            <div style={{marginBottom:16}}>
              <div style={{color:"#e2e8f0",fontSize:13,marginBottom:6}}>Session length</div>
              <div style={{color:"#6b6b80",fontSize:11,marginBottom:8}}>Controls classic comparisons per round ({sessionLength === "short" ? "2" : sessionLength === "medium" ? "3" : "5"} per round)</div>
              <SegmentPicker value={sessionLength} onChange={setSessionLength}
                options={[{value:"short",label:"Short"},{value:"medium",label:"Medium"},{value:"long",label:"Long"}]} />
            </div>
            <div>
              <div style={{color:"#e2e8f0",fontSize:13,marginBottom:6}}>Bracket size</div>
              <div style={{color:"#6b6b80",fontSize:11,marginBottom:8}}>Number of songs in each bracket tournament</div>
              <SegmentPicker value={bracketSize} onChange={setBracketSize}
                options={[{value:4,label:"4"},{value:8,label:"8"},{value:16,label:"16"}]} />
            </div>
          </div>

          {/* Display */}
          <div style={sec}>
            <div style={secT}>🎨 Display</div>
            <Toggle value={showVariance} onChange={setShowVariance} label="Show Elo variance" desc="Display ± range next to Elo scores in rankings" />
            <div style={{height:1,background:"#1e1e35",margin:"4px 0"}} />
            <Toggle value={showWinLoss} onChange={setShowWinLoss} label="Show win/loss record" desc="Display W/L next to songs in rankings" />
            <div style={{height:1,background:"#1e1e35",margin:"4px 0"}} />
            <div style={{padding:"8px 0"}}>
              <div style={{color:"#e2e8f0",fontSize:13,marginBottom:6}}>Row density</div>
              <div style={{color:"#6b6b80",fontSize:11,marginBottom:8}}>Song row size in library and rankings</div>
              <SegmentPicker value={rowDensity} onChange={setRowDensity}
                options={[{value:"compact",label:"Compact"},{value:"comfortable",label:"Comfortable"}]} />
            </div>
          </div>
        </div>
      )}

      {/* ===== GENRES TAB ===== */}
      {settingsTab === "genres" && (
        <div style={sec}>
          <div style={secT}>🏷️ Genres</div>
          <p style={{color:"#6b6b80",fontSize:12,marginBottom:12,marginTop:-8}}>Organize your songs into categories. Click a genre name to rename it.</p>
          <div style={{display:"flex",gap:8,marginBottom:16}}>
            <input value={newGenre} onChange={e=>setNewGenre(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter")addGenre()}}
              placeholder="New genre..."
              style={{flex:1,background:"#0d0d1a",border:"1px solid #2a2a45",borderRadius:10,padding:"10px 14px",color:"#e2e8f0",fontSize:13,outline:"none",transition:"border-color 0.2s"}}
              onFocus={e=>e.target.style.borderColor="#4338ca"} onBlur={e=>e.target.style.borderColor="#2a2a45"} />
            <button onClick={addGenre} style={{background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",borderRadius:10,padding:"10px 18px",color:"#fff",fontSize:13,cursor:"pointer",fontWeight:600,whiteSpace:"nowrap"}}>+ add</button>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,maxHeight:300,overflowY:"auto",padding:"2px 0"}}>
            {genres.map(g => (
              <div key={g} style={{display:"flex",alignItems:"center",gap:6,background:"#0d0d1a",border:"1px solid #2a2a45",borderRadius:10,padding:"6px 12px"}}>
                {editingGenre === g ? (
                  <input value={editName} onChange={e=>setEditName(e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter")saveEdit();if(e.key==="Escape")setEditingGenre(null)}}
                    onBlur={saveEdit} autoFocus
                    style={{background:"transparent",border:"none",borderBottom:"1px solid #4338ca",padding:"0 2px",color:"#e2e8f0",fontSize:13,outline:"none",width:Math.max(50, editName.length * 8)}} />
                ) : (
                  <span style={{color:"#e2e8f0",fontSize:13,cursor:"pointer"}} onClick={()=>startEdit(g)}>{g}</span>
                )}
                {editingGenre !== g && (
                  <button onClick={()=>deleteGenre(g)} style={{background:"none",border:"none",color:"#6b6b80",cursor:"pointer",fontSize:12,padding:0,lineHeight:1}}
                    onMouseEnter={e=>e.target.style.color="#ef4444"} onMouseLeave={e=>e.target.style.color="#6b6b80"}>✕</button>
                )}
              </div>
            ))}
            {genres.length === 0 && <span style={{color:"#6b6b80",fontSize:13}}>No genres yet</span>}
          </div>
        </div>
      )}

      {/* ===== DATA TAB ===== */}
      {settingsTab === "data" && (
        <div>
          {/* Export */}
          <div style={sec}>
            <div style={secT}>📤 Export</div>
            <p style={{color:"#6b6b80",fontSize:12,marginBottom:12,marginTop:-8}}>Download your rankings or playlists to use in other apps.</p>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{color:"#8a8aa0",fontSize:12,minWidth:80}}>Rankings</span>
                <button onClick={exportRankingsText} style={{background:"none",border:"1px solid #2a2a45",borderRadius:8,padding:"7px 14px",color:"#8a8aa0",fontSize:12,cursor:"pointer"}}
                  onMouseEnter={e=>e.target.style.color="#818cf8"} onMouseLeave={e=>e.target.style.color="#8a8aa0"}>copy as text</button>
                <button onClick={exportRankingsCSV} style={{background:"none",border:"1px solid #2a2a45",borderRadius:8,padding:"7px 14px",color:"#8a8aa0",fontSize:12,cursor:"pointer"}}
                  onMouseEnter={e=>e.target.style.color="#818cf8"} onMouseLeave={e=>e.target.style.color="#8a8aa0"}>download CSV</button>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{color:"#8a8aa0",fontSize:12,minWidth:80}}>Playlists</span>
                {playlists.length > 0 ? (
                  <div>
                    <button onClick={() => setShowExportPlaylists(!showExportPlaylists)}
                      style={{background:"none",border:"1px solid #2a2a45",borderRadius:8,padding:"7px 14px",color:"#8a8aa0",fontSize:12,cursor:"pointer"}}
                      onMouseEnter={e=>e.target.style.color="#818cf8"} onMouseLeave={e=>e.target.style.color="#8a8aa0"}>
                      {showExportPlaylists ? "hide" : "export as .m3u"} ({playlists.length})
                    </button>
                    {showExportPlaylists && (
                      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:8}}>
                        {playlists.map(pl => (
                          <button key={pl.id} onClick={() => {
                            const plSongs = pl.songIds ? pl.songIds.map(id => songs.find(s=>s.id===id)).filter(Boolean) : [];
                            if (!plSongs.length) return;
                            const m3u = "#EXTM3U\n" + plSongs.filter(s=>s.audioFile).map(s => "#EXTINF:-1," + s.title + "\n" + s.audioFile).join("\n");
                            const blob = new Blob([m3u], { type: "audio/x-mpegurl" });
                            const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = pl.name + ".m3u"; a.click(); URL.revokeObjectURL(url);
                            showToast(pl.name + ".m3u downloaded");
                          }} style={{background:"none",border:"1px solid #2a2a45",borderRadius:8,padding:"7px 14px",color:"#8a8aa0",fontSize:12,cursor:"pointer"}}
                            onMouseEnter={e=>e.target.style.color="#818cf8"} onMouseLeave={e=>e.target.style.color="#8a8aa0"}>{pl.name}</button>
                        ))}
                      </div>
                    )}
                  </div>
                ) : <span style={{color:"#6b6b80",fontSize:12}}>No playlists</span>}
              </div>
            </div>
          </div>

          {/* Backup */}
          <div style={sec}>
            <div style={secT}>💾 Backup</div>
            <p style={{color:"#6b6b80",fontSize:12,marginBottom:12,marginTop:-8}}>Save a snapshot of everything — songs, rankings, playlists, and genres.</p>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button onClick={exportBackup} style={{background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",borderRadius:10,padding:"10px 18px",color:"#fff",fontSize:13,cursor:"pointer",fontWeight:600}}>download full backup</button>
              <button onClick={serverBackup} style={{background:"none",border:"1px solid #2a2a45",borderRadius:10,padding:"10px 18px",color:"#8a8aa0",fontSize:13,cursor:"pointer"}}
                onMouseEnter={e=>e.target.style.color="#22c55e"} onMouseLeave={e=>e.target.style.color="#8a8aa0"}>server backup</button>
            </div>
            <p style={{color:"#6b6b80",fontSize:11,marginTop:10}}>Full backup includes songs, comparisons, genres, and playlists as JSON.</p>
          </div>

          {/* Delete Data */}
          <div style={{...sec,borderColor:"#3a1a1a"}}>
            <div style={{...secT,color:"#ef4444"}}>🗑️ Delete Data</div>
            <p style={{color:"#6b6b80",fontSize:12,marginBottom:12,marginTop:-8}}>Permanently remove selected data from your account.</p>
          {(() => {
            const effectiveComps = delSongs || delComps;
            const effectivePlaylists = delSongs || delPlaylists;
            const nothingSelected = !delSongs && !delComps && !delPlaylists && !delGenres && !delListenHistory;

            const summaryParts = [];
            if (delSongs) summaryParts.push(songs.length + " songs");
            if (effectiveComps) summaryParts.push(comparisons.length + " comparisons");
            if (effectivePlaylists) summaryParts.push(playlists.length + " playlists");
            if (delGenres) summaryParts.push(genres.length + " genres");
            if (delListenHistory) summaryParts.push("listening history");

            const runDelete = async () => {
              setDeleting(true);
              try {
                if (effectiveComps) await api.del("/api/comparisons");
                if (effectivePlaylists) for (const pl of playlists) await api.del("/api/playlists/" + pl.id);
                if (delSongs) for (const s of songs) await api.del("/api/songs/" + s.id);
                if (delGenres) for (const g of genres) await api.del("/api/genres/" + encodeURIComponent(g));
                if (delListenHistory) { setListenTimes({}); listenTimesRef.current = {}; localStorage.setItem("imade_listenTimes", "{}"); }
                if (delSongs) localStorage.clear();
                await onRefresh();
                showToast("Deleted " + summaryParts.join(", "));
              } catch (e) { showToast("Error during deletion"); }
              setDeleting(false);
              setShowDelModal(false);
              setConfirmDel(false);
              setDelSongs(false); setDelComps(false); setDelPlaylists(false); setDelGenres(false); setDelListenHistory(false);
            };

            const openModal = () => {
              setShowDelModal(true);
              setConfirmDel(false);
              setDelSongs(false); setDelComps(false); setDelPlaylists(false); setDelGenres(false); setDelListenHistory(false);
            };

            const CheckRow = ({ checked, onChange, label, count, note, disabled }) => (
              <label style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid #1e1e35",cursor:disabled?"default":"pointer",opacity:disabled?0.5:1}}>
                <input type="checkbox" checked={checked} onChange={onChange} disabled={disabled}
                  style={{accentColor:"#ef4444",width:16,height:16,cursor:disabled?"default":"pointer"}} />
                <div style={{flex:1}}>
                  <span style={{color:"#e2e8f0",fontSize:13}}>{label}</span>
                  {note && <span style={{color:"#6b6b80",fontSize:11,marginLeft:6}}>{note}</span>}
                </div>
                <span style={{color:"#6b6b80",fontSize:12}}>{count}</span>
              </label>
            );

            return (
              <div>
                <button onClick={openModal} style={{background:"none",border:"1px solid #5a2a2a",borderRadius:10,padding:"10px 18px",color:"#8a8aa0",fontSize:13,cursor:"pointer"}}
                  onMouseEnter={e=>{e.target.style.color="#ef4444";e.target.style.borderColor="#ef4444"}}
                  onMouseLeave={e=>{e.target.style.color="#8a8aa0";e.target.style.borderColor="#5a2a2a"}}>delete data</button>

                {showDelModal && (
                  <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}
                    onClick={()=>{if(!deleting){setShowDelModal(false);setConfirmDel(false)}}}>
                    <div onClick={e=>e.stopPropagation()} style={{background:"#14142a",border:"1px solid #2a2a45",borderRadius:20,padding:"28px 28px 24px",maxWidth:440,width:"100%",animation:"fadeUp 0.3s ease-out",boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}>

                      {!confirmDel ? (
                        <div>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
                            <span style={{fontSize:22}}>🗑</span>
                            <h2 style={{margin:0,color:"#e2e8f0",fontSize:18,fontWeight:600}}>Delete Data</h2>
                          </div>
                          <p style={{color:"#8a8aa0",fontSize:12,marginBottom:16}}>Select what you want to delete. This cannot be undone.</p>

                          <div style={{marginBottom:16}}>
                            <CheckRow checked={delSongs} onChange={e=>setDelSongs(e.target.checked)}
                              label="Songs" count={songs.length} note="(also deletes comparisons & playlists)" />
                            <CheckRow checked={effectiveComps} onChange={e=>setDelComps(e.target.checked)}
                              label="Comparisons" count={comparisons.length} disabled={delSongs} />
                            <CheckRow checked={effectivePlaylists} onChange={e=>setDelPlaylists(e.target.checked)}
                              label="Playlists" count={playlists.length} disabled={delSongs} />
                            <CheckRow checked={delGenres} onChange={e=>setDelGenres(e.target.checked)}
                              label="Genres" count={genres.length} />
                            <CheckRow checked={delListenHistory} onChange={e=>setDelListenHistory(e.target.checked)}
                              label="Listening history" count={Object.keys(listenTimes).filter(id => listenTimes[id] > 0).length + " songs"} />
                          </div>

                          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                            <button onClick={()=>setShowDelModal(false)} style={{background:"none",border:"1px solid #2a2a45",borderRadius:10,padding:"10px 18px",color:"#8a8aa0",fontSize:13,cursor:"pointer"}}>cancel</button>
                            <button onClick={()=>setConfirmDel(true)} disabled={nothingSelected}
                              style={{background:nothingSelected?"#1a1a2e":"none",border:"1px solid "+(nothingSelected?"#2a2a45":"#ef4444"),borderRadius:10,padding:"10px 18px",color:nothingSelected?"#5a5a70":"#ef4444",fontSize:13,cursor:nothingSelected?"default":"pointer",fontWeight:600}}>
                              continue
                            </button>
                          </div>
                        </div>
                      ) : (
                        <div>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
                            <span style={{fontSize:22}}>⚠️</span>
                            <h2 style={{margin:0,color:"#ef4444",fontSize:18,fontWeight:600}}>Are you sure?</h2>
                          </div>
                          <p style={{color:"#8a8aa0",fontSize:13,marginBottom:12}}>You are about to permanently delete:</p>
                          <div style={{background:"#0d0d1a",border:"1px solid #1e1e35",borderRadius:10,padding:"12px 16px",marginBottom:20}}>
                            {summaryParts.map((s,i) => (
                              <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",color:"#e2e8f0",fontSize:13}}>
                                <span style={{color:"#ef4444"}}>✕</span> {s}
                              </div>
                            ))}
                          </div>
                          <p style={{color:"#ef4444",fontSize:12,marginBottom:16}}>This action cannot be undone.</p>
                          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                            <button onClick={()=>setConfirmDel(false)} style={{background:"none",border:"1px solid #2a2a45",borderRadius:10,padding:"10px 18px",color:"#8a8aa0",fontSize:13,cursor:"pointer"}}>go back</button>
                            <button onClick={runDelete} disabled={deleting}
                              style={{background:"#ef4444",border:"none",borderRadius:10,padding:"10px 18px",color:"#fff",fontSize:13,cursor:deleting?"default":"pointer",fontWeight:600,opacity:deleting?0.5:1}}>
                              {deleting ? "deleting..." : "permanently delete"}
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          })()}
          </div>
        </div>
      )}
    </div>
  );
}

// ========== TAB: Player ==========
function PlayerTab({ songs, genres, comparisons, onRefresh, showToast, queue, setQueue, queueIdx, setQueueIdx, shuffle, setShuffle, loop, setLoop, switchTab }) {
  const audio = useGlobalAudio();
  const { play, pause, stop, toggle, seek, skip, playingSrc, currentTime, duration, isPlaying, setOnEnded, getSnapshot, volume, setVolume } = audio;
  const [editingGenre, setEditingGenre] = useState(false);
  const genreBoxRef = useRef(null);
  const ranking = useRanking(songs, comparisons);

  // Click outside to close genre picker
  useEffect(() => {
    if (!editingGenre) return;
    const handleClickOutside = (e) => {
      if (genreBoxRef.current && !genreBoxRef.current.contains(e.target)) {
        setEditingGenre(false);
      }
    };
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, [editingGenre]);

  const playable = useMemo(() => songs.filter(s => s.audioFile), [songs]);

  useEffect(() => {
    if (playable.length === 0) {
      // All songs deleted — clear queue
      if (queue.length > 0) { setQueue([]); setQueueIdx(0); stop(); }
      return;
    }
    if (queue.length === 0) {
      const q = shuffle ? [...playable].sort(() => Math.random() - 0.5) : [...playable];
      setQueue(q);
    } else {
      // Remove stale songs from queue
      const songIds = new Set(songs.map(s => s.id));
      const validQueue = queue.filter(s => songIds.has(s.id));
      if (validQueue.length !== queue.length) {
        setQueue(validQueue);
        setQueueIdx(prev => Math.min(prev, Math.max(0, validQueue.length - 1)));
        if (validQueue.length === 0) stop();
      }
    }
  }, [playable]);

  const queueSong = queue[queueIdx] || null;
  const currentSong = queueSong ? (songs.find(s => s.id === queueSong.id) || queueSong) : null;
  const isCurrent = currentSong && playingSrc === currentSong.audioFile;

  const currentRank = useMemo(() => {
    if (!currentSong) return null;
    const idx = ranking.standings.findIndex(s => s.id === currentSong.id);
    return idx >= 0 ? idx + 1 : null;
  }, [ranking.standings, currentSong]);
  const isUnranked = currentSong && (ranking.compCount[currentSong.id] || 0) === 0;

  const snapshot = currentSong && !isCurrent ? getSnapshot(currentSong.audioFile) : null;
  const displayTime = isCurrent ? currentTime : (snapshot ? snapshot.time : 0);
  const displayDur = isCurrent ? duration : (snapshot ? snapshot.duration : 0);

  useEffect(() => {
    setOnEnded(() => {
      if (loop === "one" && currentSong) { play(currentSong.audioFile); return; }
      if (queueIdx < queue.length - 1) {
        const next = queueIdx + 1; setQueueIdx(next); play(queue[next].audioFile);
      } else if (loop === "all" && queue.length > 0) { setQueueIdx(0); play(queue[0].audioFile); }
    });
    return () => setOnEnded(null);
  }, [queueIdx, queue, loop, currentSong, play, setOnEnded]);

  const toggleShuffle = () => {
    const newShuffle = !shuffle; setShuffle(newShuffle);
    if (newShuffle) {
      const rest = queue.filter((s, i) => i !== queueIdx);
      const shuffled = rest.sort(() => Math.random() - 0.5);
      const q = currentSong ? [currentSong, ...shuffled] : shuffled;
      setQueue(q); setQueueIdx(0);
    } else {
      if (currentSong) { const idx = queue.findIndex(s => s.id === currentSong.id); if (idx !== -1) setQueueIdx(idx); }
    }
  };

  const cycleLoop = () => { setLoop(prev => prev === "none" ? "all" : prev === "all" ? "one" : "none"); };

  const skipNext = () => {
    if (queue.length === 0) return;
    const next = (queueIdx + 1) % queue.length;
    setQueueIdx(next); play(queue[next].audioFile);
  };

  const skipPrev = () => {
    if (queue.length === 0) return;
    if (currentTime > 3) { seek(0); return; }
    const prev = (queueIdx - 1 + queue.length) % queue.length;
    setQueueIdx(prev); play(queue[prev].audioFile);
  };

  const rateSong = async (delta) => {
    if (!currentSong) return;
    // Use the ranking-derived Elo (which accounts for comparisons), not raw song data
    const standing = ranking.standings.find(s => s.id === currentSong.id);
    const currentElo = standing ? standing.elo : (currentSong.baseElo != null ? currentSong.baseElo : 500);
    // Position-based dampening: liking top song or disliking bottom song has no effect at extremes
    const distFromCenter = Math.abs(currentElo - 500) / 500; // 0 at center, 1 at extremes
    // If liking and already high, or disliking and already low, dampen completely at extremes
    const isReinforcing = (delta > 0 && currentElo > 500) || (delta < 0 && currentElo < 500);
    const dampening = isReinforcing ? (1 - distFromCenter) : 1; // 1.0 at center, 0 at extremes for reinforcing
    const adjustedDelta = Math.round(delta * dampening);
    if (adjustedDelta === 0) {
      showToast(delta > 0 ? "Already at top" : "Already at bottom");
      return;
    }
    const newElo = Math.max(0, Math.min(1000, currentElo + adjustedDelta));
    const fd = new FormData();
    fd.append("baseElo", String(newElo));
    await api.put("/api/songs/" + currentSong.id, fd);
    await onRefresh();
    showToast((delta > 0 ? "👍" : "👎") + " " + (adjustedDelta > 0 ? "+" : "") + adjustedDelta);
  };

  const saveGenre = async (newGenre) => {
    if (!currentSong) return;
    if (newGenre === (currentSong.genre || "")) { setEditingGenre(false); return; }
    const fd = new FormData();
    fd.append("genre", newGenre);
    await api.put("/api/songs/" + currentSong.id, fd);
    await onRefresh(); setEditingGenre(false);
    showToast("Genre updated");
  };

  const fmtTime = (s) => { const m = Math.floor(s/60); return m + ":" + String(Math.floor(s%60)).padStart(2,"0"); };

  if (playable.length === 0) return (
    <div style={{textAlign:"center",padding:80}}>
      <p style={{color:"#8a8aa0",fontSize:18}}>No songs with audio files in your library</p>
    </div>
  );

  return (
    <div style={{maxWidth:500,margin:"0 auto",textAlign:"center"}}>
      {/* Song info */}
      <div style={{marginBottom:24}}>
        <div style={{fontSize:48,opacity:0.35,lineHeight:1,marginBottom:12}}>♪</div>
        <h2 style={{color:"#e2e8f0",fontSize:22,fontWeight:400,marginBottom:4}}>{currentSong?.title || "No song"}</h2>
        {currentSong && (
          <div style={{marginBottom:8}}>
            {isUnranked ? (
              <span onClick={()=>switchTab("battle")} style={{color:"#f59e0b",fontSize:11,cursor:"pointer",background:"#f59e0b15",padding:"3px 10px",borderRadius:8}}>not ranked yet — compare now</span>
            ) : currentRank ? (
              <span style={{color:currentRank<=3?"#f59e0b":"#6b6b80",fontSize:12,fontWeight:600}}>#{currentRank}</span>
            ) : null}
          </div>
        )}
        {editingGenre ? (
          <div ref={genreBoxRef} style={{maxHeight:80,overflowY:"auto",overflowX:"hidden",display:"flex",gap:4,justifyContent:"center",alignItems:"flex-start",flexWrap:"wrap",padding:"2px 0"}}>
            <button onClick={()=>saveGenre("")}
              style={{background:!currentSong?.genre?"#4338ca":"none",border:"1px solid #2a2a45",borderRadius:14,padding:"3px 10px",color:!currentSong?.genre?"#fff":"#6b7280",fontSize:10,cursor:"pointer",flexShrink:0}}>
              none
            </button>
            {genres.map(g=>(
              <button key={g} onClick={()=>saveGenre(g)}
                style={{background:currentSong?.genre===g?"#4338ca":"none",border:"1px solid "+(currentSong?.genre===g?"#4338ca":"#2a2a45"),borderRadius:14,padding:"3px 10px",color:currentSong?.genre===g?"#fff":"#818cf8",fontSize:10,cursor:"pointer",flexShrink:0}}>
                {g}
              </button>
            ))}
            <button onClick={()=>setEditingGenre(false)} style={{background:"none",border:"none",color:"#6b6b80",fontSize:10,cursor:"pointer",padding:"3px 6px",flexShrink:0}}>✕</button>
          </div>
        ) : (
          <span onClick={()=>setEditingGenre(true)} style={{color:"#818cf8",fontSize:12,textTransform:"uppercase",letterSpacing:"0.05em",cursor:"pointer",background:"#4338ca15",padding:"4px 12px",borderRadius:12}}>
            {currentSong?.genre || "no genre"} ✎
          </span>
        )}
      </div>

      {/* Progress bar */}
      <div style={{marginBottom:20,padding:"0 20px"}}>
        {(() => {
          const pct = displayDur > 0 ? (displayTime / displayDur * 100) : 0;
          const scrubRef = React.useRef(null);
          const [dragging, setDragging] = React.useState(false);
          const [hovered, setHovered] = React.useState(false);

          const seekTo = (e) => {
            const rect = scrubRef.current.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, ((e.clientX || e.pageX) - rect.left) / rect.width));
            const d = isCurrent ? duration : (snapshot ? snapshot.duration : 0);
            if (!isCurrent && currentSong) play(currentSong.audioFile);
            if (d > 0) seek(d * ratio);
          };

          React.useEffect(() => {
            if (!dragging) return;
            const onMove = (e) => { e.preventDefault(); seekTo(e.touches ? e.touches[0] : e); };
            const onUp = () => setDragging(false);
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
            document.addEventListener("touchmove", onMove);
            document.addEventListener("touchend", onUp);
            return () => { document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); document.removeEventListener("touchmove", onMove); document.removeEventListener("touchend", onUp); };
          }, [dragging]);

          return (
            <div ref={scrubRef}
              onMouseDown={(e) => { seekTo(e); setDragging(true); }}
              onTouchStart={(e) => { seekTo(e.touches[0]); setDragging(true); }}
              onMouseEnter={() => setHovered(true)}
              onMouseLeave={() => { if (!dragging) setHovered(false); }}
              style={{height:28,cursor:"pointer",position:"relative",display:"flex",alignItems:"center",touchAction:"none"}}>
              <div style={{position:"absolute",left:0,right:0,height: hovered||dragging ? 6 : 4,background:"#1a1a2e",borderRadius:3,transition:"height 0.15s"}} />
              <div style={{position:"absolute",left:0,width:pct+"%",height: hovered||dragging ? 6 : 4,background:"linear-gradient(90deg,#4338ca,#818cf8)",borderRadius:3,transition: dragging ? "none" : "height 0.15s, width 0.1s"}} />
              <div style={{
                position:"absolute",left:"calc("+pct+"% - 7px)",
                width:14,height:14,borderRadius:"50%",
                background:"#818cf8",boxShadow:"0 0 8px rgba(129,140,248,0.4)",
                opacity: hovered||dragging ? 1 : 0,
                transform: dragging ? "scale(1.2)" : "scale(1)",
                transition: dragging ? "none" : "opacity 0.15s, transform 0.15s",
                pointerEvents:"none",
              }} />
            </div>
          );
        })()}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:0}}>
          <span style={{color:"#6b6b80",fontSize:10}}>{fmtTime(displayTime)}</span>
          <span style={{color:"#6b6b80",fontSize:10}}>{fmtTime(displayDur)}</span>
        </div>
      </div>

      {/* Controls */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:16,marginBottom:24}}>
        <button onClick={toggleShuffle} style={{background:"none",border:"none",color:shuffle?"#818cf8":"#6b6b80",fontSize:13,cursor:"pointer",padding:4,fontWeight:600,letterSpacing:"-0.05em"}} title="Shuffle">⇄</button>
        <button onClick={skipPrev} style={{background:"none",border:"none",color:"#e2e8f0",fontSize:22,cursor:"pointer",padding:4,display:"flex",alignItems:"center"}} title="Previous"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><rect x="2" y="3" width="2.5" height="12" rx="0.5"/><polygon points="15,3 15,15 5,9"/></svg></button>
        <button onClick={()=>skip(-10)} style={{background:"none",border:"none",color:"#9a9ab0",fontSize:14,cursor:"pointer",padding:4}} title="-10s">-10</button>
        <button onClick={()=>{ if (currentSong) toggle(currentSong.audioFile); else if (queue.length) { play(queue[0].audioFile); } }}
          style={{background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",borderRadius:"50%",width:56,height:56,color:"#fff",fontSize:24,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 16px rgba(99,102,241,0.3)"}}>
          {isCurrent && isPlaying ? "⏸" : "▶"}
        </button>
        <button onClick={()=>skip(10)} style={{background:"none",border:"none",color:"#9a9ab0",fontSize:14,cursor:"pointer",padding:4}} title="+10s">+10</button>
        <button onClick={skipNext} style={{background:"none",border:"none",color:"#e2e8f0",fontSize:22,cursor:"pointer",padding:4,display:"flex",alignItems:"center"}} title="Next"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><polygon points="3,3 3,15 13,9"/><rect x="13.5" y="3" width="2.5" height="12" rx="0.5"/></svg></button>
        <button onClick={cycleLoop} style={{background:"none",border:"none",color:loop!=="none"?"#818cf8":"#6b6b80",fontSize:11,cursor:"pointer",padding:"4px 6px",fontWeight:700,position:"relative"}} title={"Loop: "+loop}>
          <span style={{letterSpacing:"-0.03em"}}>↻</span>{loop === "one" && <span style={{position:"absolute",fontSize:7,bottom:0,right:0,color:"#818cf8"}}>1</span>}
        </button>
      </div>

      {/* Volume */}
      {(() => {
        const volRef = React.useRef(null);
        const [volDrag, setVolDrag] = React.useState(false);
        const setVol = (e) => {
          const rect = volRef.current.getBoundingClientRect();
          setVolume(Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)));
        };
        React.useEffect(() => {
          if (!volDrag) return;
          const onMove = (e) => { e.preventDefault(); setVol(e); };
          const onUp = () => setVolDrag(false);
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
          return () => { document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); };
        }, [volDrag]);
        return (
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginBottom:20,padding:"0 40px"}}>
            <span style={{color:volume===0?"#ef4444":"#6b6b80",fontSize:12,cursor:"pointer",width:16,textAlign:"center"}} onClick={()=>setVolume(volume===0?1:0)}>{volume===0?"✕":"♪"}</span>
            <div ref={volRef} style={{flex:1,maxWidth:200,height:24,cursor:"pointer",position:"relative",display:"flex",alignItems:"center"}}
              onMouseDown={(e)=>{setVol(e);setVolDrag(true)}}>
              <div style={{position:"absolute",left:0,right:0,height:3,background:"#1a1a2e",borderRadius:2}} />
              <div style={{position:"absolute",left:0,width:(volume*100)+"%",height:3,background:"#4338ca",borderRadius:2}} />
              <div style={{position:"absolute",left:"calc("+(volume*100)+"% - 5px)",width:10,height:10,borderRadius:"50%",background:"#818cf8",boxShadow:"0 0 6px rgba(129,140,248,0.3)"}} />
            </div>
            <span style={{color:"#5a5a70",fontSize:9,minWidth:24,textAlign:"center"}}>{Math.round(volume*100)}</span>
          </div>
        );
      })()}

      {/* Like / Dislike */}
      <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:24}}>
        <button onClick={()=>rateSong(-5)} style={{background:"none",border:"1px solid #2a2a45",borderRadius:10,padding:"10px 20px",color:"#6b7280",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor="#ef4444";e.currentTarget.style.color="#ef4444"}} onMouseLeave={e=>{e.currentTarget.style.borderColor="#2a2a45";e.currentTarget.style.color="#6b7280"}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{transform:"scaleY(-1)"}}><path d="M7 10v12"/><path d="M15 5.88L14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"/></svg>
        </button>
        <button onClick={()=>rateSong(5)} style={{background:"none",border:"1px solid #2a2a45",borderRadius:10,padding:"10px 20px",color:"#6b7280",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor="#22c55e";e.currentTarget.style.color="#22c55e"}} onMouseLeave={e=>{e.currentTarget.style.borderColor="#2a2a45";e.currentTarget.style.color="#6b7280"}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 10v12"/><path d="M15 5.88L14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"/></svg>
        </button>
      </div>

      {/* Queue */}
      <div style={{textAlign:"left",borderTop:"1px solid #1e1e35",paddingTop:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{color:"#6b6b80",fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>Queue ({queue.length - queueIdx - 1} remaining)</div>
          {queue.length > queueIdx + 1 && (
            <button onClick={() => { stop(); setQueue(currentSong ? [currentSong] : []); setQueueIdx(0); }}
              style={{background:"none",border:"1px solid #2a2a45",borderRadius:6,padding:"3px 10px",color:"#6b6b80",fontSize:10,cursor:"pointer"}}
              onMouseEnter={e=>e.target.style.color="#ef4444"} onMouseLeave={e=>e.target.style.color="#6b6b80"}>clear</button>
          )}
        </div>
        <div style={{maxHeight:210,overflowY:"auto"}}>
        {queue.slice(queueIdx + 1).map((s, i) => {
          const fresh = songs.find(x => x.id === s.id) || s;
          return (
            <div key={s.id + i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid #0d0d1a",cursor:"pointer",color:"#9a9ab0",fontSize:13}}
              onClick={() => { const idx = queueIdx + 1 + i; setQueueIdx(idx); play(queue[idx].audioFile); }}>
              <span style={{color:"#5a5a70",fontSize:10,minWidth:16}}>{i + 1}</span>
              <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{fresh.title}</span>
              {fresh.genre && <span style={{color:"#818cf8",fontSize:9,textTransform:"uppercase"}}>{fresh.genre}</span>}
            </div>
          );
        })}
        {queue.length <= queueIdx + 1 && <div style={{color:"#5a5a70",fontSize:12,textAlign:"center",padding:16}}>Queue empty</div>}
        </div>
      </div>
    </div>
  );
}

// ========== TAB: Playlists ==========
function PlaylistsTab({ songs, playlists, genres, comparisons, onRefresh, showToast, setPlayerQueue, setPlayerQueueIdx }) {
  const [view, setView] = useState("list"); // "list" or "detail"
  const [activeId, setActiveId] = useState(null);
  const [creating, setCreating] = useState(false);
  const [newName, setNewName] = useState("");
  // Smart playlist creation
  const [smartOpen, setSmartOpen] = useState(false);
  const [smartGenre, setSmartGenre] = useState("");
  const [smartCount, setSmartCount] = useState(20);
  const [smartName, setSmartName] = useState("");
  // Add songs
  const [addSearch, setAddSearch] = useState("");
  // Drag state
  const [dragIdx, setDragIdx] = useState(null);
  const [dragOverIdx, setDragOverIdx] = useState(null);
  const plDragMouseY = useRef(0);
  const plScrollRef = useRef(null);
  const { play, toggle, playingSrc, isPlaying } = useGlobalAudio();
  const ranking = useRanking(songs, comparisons);

  const activePl = playlists.find(p => p.id === activeId);

  const createPlaylist = async () => {
    if (!newName.trim()) return;
    await api.post("/api/playlists", { name: newName.trim(), songIds: [] });
    setNewName("");
    setCreating(false);
    await onRefresh();
  };

  const createSmartPlaylist = async () => {
    if (smartCount < 1) { showToast("Enter a number"); return; }
    const name = smartName.trim() || ("Top " + smartCount + (smartGenre ? " " + smartGenre : ""));
    await api.post("/api/playlists", { name, songIds: [], smart: { count: smartCount, genre: smartGenre || "" } });
    setSmartOpen(false);
    setSmartName("");
    await onRefresh();
    showToast("Created: " + name);
  };

  // Compute live song IDs for smart playlists
  const getSmartSongIds = (pl, rank) => {
    if (!pl.smart) return pl.songIds;
    const pool = pl.smart.genre ? rank.standings.filter(s => s.genre === pl.smart.genre) : rank.standings;
    return pool.slice(0, pl.smart.count).map(s => s.id);
  };

  const deletePlaylist = async (id) => {
    if (!confirm("Delete this playlist?")) return;
    await api.del("/api/playlists/" + id);
    if (activeId === id) { setActiveId(null); setView("list"); }
    await onRefresh();
  };

  const addSong = async (songId) => {
    if (!activePl) return;
    if (activePl.songIds.includes(songId)) return;
    await api.put("/api/playlists/" + activePl.id, { songIds: [...activePl.songIds, songId] });
    await onRefresh();
  };

  const removeSong = async (songId) => {
    if (!activePl) return;
    await api.put("/api/playlists/" + activePl.id, { songIds: activePl.songIds.filter(id => id !== songId) });
    await onRefresh();
  };

  const startPlScroll = () => {
    if (plScrollRef.current) return;
    const trackMouse = (e) => { plDragMouseY.current = e.clientY; };
    document.addEventListener("dragover", trackMouse);
    plScrollRef.current = setInterval(() => {
      const y = plDragMouseY.current;
      const th = 120, sp = 20;
      if (y < th) window.scrollBy(0, -sp * (1 - y/th));
      else if (y > window.innerHeight - th) window.scrollBy(0, sp * (1 - (window.innerHeight - y)/th));
    }, 16);
    plScrollRef.current._trackMouse = trackMouse;
  };
  const stopPlScroll = () => {
    if (plScrollRef.current) {
      if (plScrollRef.current._trackMouse) document.removeEventListener("dragover", plScrollRef.current._trackMouse);
      clearInterval(plScrollRef.current);
      plScrollRef.current = null;
    }
  };

  const handleDragEnd = async (e) => {
    stopPlScroll();
    if (dragIdx === null || dragOverIdx === null || dragIdx === dragOverIdx || !activePl) {
      setDragIdx(null); setDragOverIdx(null); return;
    }
    const ids = [...activePl.songIds];
    const [moved] = ids.splice(dragIdx, 1);
    ids.splice(dragOverIdx, 0, moved);
    setDragIdx(null); setDragOverIdx(null);
    await api.put("/api/playlists/" + activePl.id, { songIds: ids });
    await onRefresh();
  };

  const playPlaylist = (plSongs, startIdx) => {
    const withAudio = plSongs.filter(s => s.audioFile);
    if (withAudio.length === 0) return;
    setPlayerQueue(withAudio);
    const idx = Math.max(0, startIdx || 0);
    setPlayerQueueIdx(idx);
    play(withAudio[idx].audioFile);
  };

  const allGenres = [...new Set(songs.map(s => s.genre).filter(Boolean))];

  if (view === "detail" && activePl) {
    const isSmart = !!activePl.smart;
    const effectiveIds = isSmart ? getSmartSongIds(activePl, ranking) : activePl.songIds;
    const plSongs = effectiveIds.map(id => songs.find(s => s.id === id)).filter(Boolean);
    const searchResults = !isSmart && addSearch ? songs.filter(s => s.title.toLowerCase().includes(addSearch.toLowerCase()) && !effectiveIds.includes(s.id)).slice(0, 8) : [];

    return (
      <div>
        <button onClick={()=>{setView("list");setAddSearch("")}} style={{background:"none",border:"none",color:"#818cf8",fontSize:12,cursor:"pointer",marginBottom:16}}>← back to playlists</button>
        <h2 style={{color:"#e2e8f0",fontSize:20,fontWeight:400,marginBottom:16}}>
          {activePl.name}
          <span style={{color:"#6b6b80",fontSize:12,marginLeft:8}}>({plSongs.length} songs)</span>
        </h2>

        {/* Add songs — only for static playlists */}
        {!isSmart && (
        <div style={{marginBottom:16,position:"relative"}}>
          <input value={addSearch} onChange={e=>setAddSearch(e.target.value)} placeholder="search to add songs..."
            style={{width:"100%",background:"#0d0d1a",border:"1px solid #1e1e35",borderRadius:8,padding:"8px 12px",color:"#e2e8f0",fontSize:13,outline:"none"}}
            onFocus={e=>e.target.style.borderColor="#4338ca"} onBlur={e=>setTimeout(()=>{e.target.style.borderColor="#1e1e35"},200)} />
          {searchResults.length > 0 && (
            <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#16162a",border:"1px solid #2a2a45",borderRadius:8,zIndex:10,maxHeight:240,overflowY:"auto",marginTop:4}}>
              {searchResults.map(s => (
                <div key={s.id} onMouseDown={()=>{addSong(s.id);setAddSearch("")}} style={{padding:"8px 12px",cursor:"pointer",color:"#e2e8f0",fontSize:13,borderBottom:"1px solid #1e1e35"}}
                  onMouseEnter={e=>e.currentTarget.style.background="#1e1e35"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  {s.title} {s.genre && <span style={{color:"#818cf8",fontSize:10}}>· {s.genre}</span>}
                </div>
              ))}
            </div>
          )}
        </div>
        )}

        {/* Play buttons */}
        {plSongs.length > 0 && (
          <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
            <button onClick={()=>playPlaylist(plSongs, 0)} style={{background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",borderRadius:10,padding:"8px 20px",color:"#fff",fontSize:13,cursor:"pointer",fontWeight:600}}>▶ Play</button>
            <button onClick={()=>{ const shuffled = [...plSongs].sort(()=>Math.random()-0.5); playPlaylist(shuffled, 0); }}
              style={{background:"none",border:"1px solid #2a2a45",borderRadius:10,padding:"8px 20px",color:"#818cf8",fontSize:13,cursor:"pointer"}}>Shuffle</button>
          </div>
        )}

        {/* Song list with drag-drop */}
        {plSongs.map((s, i) => {
          const isSongPlaying = playingSrc === s.audioFile && isPlaying;
          return (
          <div key={s.id}
            draggable={!isSmart}
            onDragStart={!isSmart ? ()=>{setDragIdx(i);startPlScroll()} : undefined}
            onDragOver={!isSmart ? e=>{e.preventDefault();setDragOverIdx(i);plDragMouseY.current=e.clientY} : undefined}
            onDragEnd={!isSmart ? handleDragEnd : undefined}
            style={{
              display:"flex",alignItems:"center",gap:8,padding:"8px 4px",borderBottom:"1px solid #1e1e35",
              cursor:isSmart?"default":"grab",
              background: !isSmart && dragOverIdx===i && dragIdx!==null && dragIdx!==i ? "#1e1e35" : "transparent",
              opacity: !isSmart && dragIdx===i ? 0.4 : 1,
              transition:"background 0.15s, opacity 0.15s",
              borderTop: !isSmart && dragOverIdx===i && dragIdx!==null && dragIdx > i ? "2px solid #818cf8" : "2px solid transparent",
              borderBottomColor: !isSmart && dragOverIdx===i && dragIdx!==null && dragIdx < i ? "#818cf8" : "#1e1e35",
            }}>
            {!isSmart && <span style={{color:"#5a5a70",fontSize:10,cursor:"grab",padding:"2px 4px",userSelect:"none"}}>⠿</span>}
            <span style={{color:"#5a5a70",fontSize:11,minWidth:20,textAlign:"right"}}>{i+1}</span>
            <button onClick={()=>{if(s.audioFile){if(isSongPlaying)toggle(s.audioFile);else{playPlaylist(plSongs,i)}}}}
              style={{background:"none",border:"none",color:isSongPlaying?"#818cf8":"#6b6b80",fontSize:12,cursor:"pointer",padding:"2px 4px",flexShrink:0}}>
              {isSongPlaying ? "⏸" : "▶"}
            </button>
            <span style={{flex:1,color:"#e2e8f0",fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.title}</span>
            {s.genre && <span style={{color:"#818cf8",fontSize:9,textTransform:"uppercase"}}>{s.genre}</span>}
            {!isSmart && <button onClick={()=>removeSong(s.id)} style={{background:"none",border:"none",color:"#2a2a40",cursor:"pointer",fontSize:12,padding:4}}
              onMouseEnter={e=>e.target.style.color="#ef4444"} onMouseLeave={e=>e.target.style.color="#2a2a40"}>✕</button>}
          </div>
          );
        })}
        {plSongs.length === 0 && <div style={{color:"#6b6b80",fontSize:14,textAlign:"center",padding:40}}>Empty playlist — search above to add songs</div>}
      </div>
    );
  }

  return (
    <div>
      <div style={{display:"flex",gap:10,marginBottom:20}}>
        <button onClick={()=>setCreating(true)} style={{background:"linear-gradient(135deg,#4338ca,#6366f1)",border:"none",borderRadius:10,padding:"10px 20px",color:"#fff",fontSize:13,cursor:"pointer",fontWeight:600}}>+ new playlist</button>
        <button onClick={()=>setSmartOpen(!smartOpen)} style={{background:"none",border:"1px solid #2a2a45",borderRadius:10,padding:"10px 20px",color:"#818cf8",fontSize:13,cursor:"pointer"}}>from rankings</button>
      </div>

      {creating && (
        <div style={{display:"flex",gap:10,marginBottom:16,animation:"fadeUp 0.2s ease-out"}}>
          <input value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")createPlaylist()}}
            placeholder="Playlist name..." autoFocus
            style={{flex:1,background:"#0d0d1a",border:"1px solid #4338ca",borderRadius:8,padding:"8px 12px",color:"#e2e8f0",fontSize:13,outline:"none"}} />
          <button onClick={createPlaylist} style={{background:"#4338ca",border:"none",borderRadius:8,padding:"8px 16px",color:"#fff",fontSize:12,cursor:"pointer"}}>create</button>
          <button onClick={()=>setCreating(false)} style={{background:"none",border:"1px solid #2a2a45",borderRadius:8,padding:"8px 12px",color:"#6b7280",fontSize:12,cursor:"pointer"}}>cancel</button>
        </div>
      )}

      {smartOpen && (
        <div style={{background:"#14142a",border:"1px solid #2a2a45",borderRadius:12,padding:16,marginBottom:16,animation:"fadeUp 0.2s ease-out"}}>
          <div style={{color:"#e2e8f0",fontSize:13,marginBottom:12}}>Create from rankings</div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{color:"#9a9ab0",fontSize:12}}>Top</span>
            <input type="number" value={smartCount === 0 ? "" : smartCount} onChange={e=>setSmartCount(e.target.value === "" ? 0 : Math.max(1, parseInt(e.target.value) || 0))} min="1"
              style={{width:60,background:"#0d0d1a",border:"1px solid #2a2a45",borderRadius:6,padding:"6px 8px",color:"#e2e8f0",fontSize:12,textAlign:"center",outline:"none"}} />
            <span style={{color:"#9a9ab0",fontSize:12}}>of</span>
            <select value={smartGenre} onChange={e=>setSmartGenre(e.target.value)}
              style={{background:"#0d0d1a",border:"1px solid #2a2a45",borderRadius:6,padding:"6px 10px",color:"#e2e8f0",fontSize:12,cursor:"pointer",appearance:"none"}}>
              <option value="">all genres</option>
              {allGenres.map(g=><option key={g} value={g}>{g}</option>)}
            </select>
            <input value={smartName} onChange={e=>setSmartName(e.target.value)} placeholder="name (optional)"
              style={{flex:1,minWidth:100,background:"#0d0d1a",border:"1px solid #2a2a45",borderRadius:6,padding:"6px 10px",color:"#e2e8f0",fontSize:12,outline:"none"}} />
            <button onClick={createSmartPlaylist} style={{background:"#4338ca",border:"none",borderRadius:6,padding:"6px 14px",color:"#fff",fontSize:12,cursor:"pointer",fontWeight:600}}>create</button>
          </div>
        </div>
      )}

      {/* Playlist list */}
      {playlists.length === 0 && !creating && (
        <div style={{textAlign:"center",padding:60}}>
          <div style={{fontSize:40,marginBottom:12}}>♪</div>
          <p style={{color:"#6b7280",fontSize:16}}>No playlists yet</p>
        </div>
      )}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {playlists.map(pl => {
          const isSm = !!pl.smart;
          const effectiveIds = isSm ? getSmartSongIds(pl, ranking) : pl.songIds;
          const plSongsForPlay = effectiveIds.map(id => songs.find(s => s.id === id)).filter(Boolean);
          
          return (
          <div key={pl.id} style={{background:"#14142a",border:"1px solid #1e1e35",borderRadius:10,padding:"14px 16px",display:"flex",alignItems:"center",gap:12}}
            onMouseEnter={e=>e.currentTarget.style.borderColor="#2a2a45"} onMouseLeave={e=>e.currentTarget.style.borderColor="#1e1e35"}>
            <button onClick={()=>playPlaylist(plSongsForPlay, 0)}
              style={{width:40,height:40,background:"linear-gradient(135deg,#4338ca,#6366f1)",borderRadius:8,border:"none",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0,cursor:"pointer",color:"#fff"}}>▶</button>
            <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>{setActiveId(pl.id);setView("detail")}}>
              <div style={{color:"#e2e8f0",fontSize:14}}>{pl.name}</div>
              <div style={{color:"#6b6b80",fontSize:11}}>{plSongsForPlay.length} songs</div>
            </div>
            <button onClick={()=>deletePlaylist(pl.id)} style={{background:"none",border:"none",color:"#2a2a40",cursor:"pointer",fontSize:12,padding:4}}
              onMouseEnter={e=>e.target.style.color="#ef4444"} onMouseLeave={e=>e.target.style.color="#2a2a40"}>✕</button>
          </div>
          );
        })}
      </div>
    </div>
  );
}

// ========== MAIN APP ==========
const BATCH_SIZE = 5;

function App() {
  const [tab, setTab] = useState("library");
  const [songs, setSongs] = useState([]);
  const [genres, setGenres] = useState([]);
  const [comparisons, setComparisons] = useState([]);
  const [playlists, setPlaylists] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [battlePair, setBattlePair] = useState(null); // persisted current pair
  const [toast, setToast] = useState(null);
  const [lastUpdateCompCount, setLastUpdateCompCount] = useState(() => {
    const stored = localStorage.getItem("imade_lastUpdateCompCount");
    return stored ? parseInt(stored, 10) : Infinity; // Infinity means "never updated, show as grey until first update"
  });

  // Persist lastUpdateCompCount
  useEffect(() => {
    if (lastUpdateCompCount !== Infinity) localStorage.setItem("imade_lastUpdateCompCount", String(lastUpdateCompCount));
  }, [lastUpdateCompCount]);
  // Reset if comparisons were deleted (count dropped below stored value)
  useEffect(() => {
    if (lastUpdateCompCount !== Infinity && comparisons.length < lastUpdateCompCount) {
      setLastUpdateCompCount(0);
    }
  }, [comparisons.length]);
  const [hasSeenIntro, setHasSeenIntro] = useState(() => localStorage.getItem("imade_seenIntro") === "1");
  const [hasSeenPhase2, setHasSeenPhase2] = useState(() => localStorage.getItem("imade_seenPhase2") === "1");
  const [showVariance, setShowVariance] = useState(() => localStorage.getItem("imade_showVariance") !== "0");
  // Settings
  const [sessionLength, setSessionLength] = useState(() => localStorage.getItem("imade_sessionLength") || "medium");
  const [bracketSize, setBracketSize] = useState(() => parseInt(localStorage.getItem("imade_bracketSize") || "8"));
  const [showWinLoss, setShowWinLoss] = useState(() => localStorage.getItem("imade_showWinLoss") !== "0");
  const [theme, setTheme] = useState(() => localStorage.getItem("imade_theme") || "dark");
  const [rowDensity, setRowDensity] = useState(() => localStorage.getItem("imade_rowDensity") || "comfortable");

  const persistSetting = (key, val, setter) => { setter(val); localStorage.setItem("imade_" + key, String(val)); };

  const persistIntro = (v) => { setHasSeenIntro(v); if (v) localStorage.setItem("imade_seenIntro", "1"); };
  const persistPhase2 = (v) => { setHasSeenPhase2(v); if (v) localStorage.setItem("imade_seenPhase2", "1"); };
  // Scroll position persistence
  const scrollPositions = useRef({});
  // Player persistent state
  const [playerQueue, setPlayerQueue] = useState([]);
  const [playerQueueIdx, setPlayerQueueIdx] = useState(0);
  const [playerShuffle, setPlayerShuffle] = useState(false);
  const [playerLoop, setPlayerLoop] = useState("none");
  // Library persistent state
  const [libFilterGenre, setLibFilterGenre] = useState("All");
  const [libSelectMode, setLibSelectMode] = useState(false);
  const [libSelectedIds, setLibSelectedIds] = useState(new Set());
  const [libBatchGenre, setLibBatchGenre] = useState("");

  // Focused session: song subset from chart selection
  const [focusedSessionSongs, setFocusedSessionSongs] = useState(null);

  // Header height tracking for nested sticky
  const headerRef = useRef(null);
  const [headerHeight, setHeaderHeight] = useState(120);

  // Listen time tracking (seconds per song, stored in localStorage)
  const [listenTimes, setListenTimes] = useState(() => {
    try { return JSON.parse(localStorage.getItem("imade_listenTimes") || "{}"); } catch { return {}; }
  });
  const listenTimesRef = useRef(listenTimes);
  const lastTimeUpdateRef = useRef({ src: null, time: 0 });

  // Upload state lifted to App so it persists across tab switches
  const [uploadFiles, setUploadFiles] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [uploadProgress, setUploadProgress] = useState({ done: 0, total: 0 });
  const [uploadDone, setUploadDone] = useState(false);
  const uploadAbortRef = useRef(false);

  const switchTab = useCallback((newTab) => {
    scrollPositions.current[tab] = window.scrollY;
    setTab(newTab);
    requestAnimationFrame(() => {
      window.scrollTo(0, scrollPositions.current[newTab] || 0);
    });
  }, [tab]);

  const showToast = useCallback((msg, ms) => { setToast(msg); setTimeout(() => setToast(null), ms || 2500); }, []);

  const refresh = async () => {
    const [s, g, c, p] = await Promise.all([
      api.get("/api/songs"),
      api.get("/api/genres"),
      api.get("/api/comparisons"),
      api.get("/api/playlists"),
    ]);
    setSongs(s); setGenres(g); setComparisons(c); setPlaylists(p);
  };

  useEffect(() => { refresh().then(()=>setLoaded(true)); }, []);

  // Track listen time per song
  const audio = useGlobalAudio();
  useEffect(() => {
    if (!audio.playingSrc) { lastTimeUpdateRef.current = { src: null, time: 0 }; return; }
    // Find song by audio file path
    const srcKey = audio.playingSrc;
    const song = songs.find(s => s.audioFile === srcKey);
    if (!song) return;

    const last = lastTimeUpdateRef.current;
    if (last.src === srcKey && audio.currentTime > last.time) {
      const delta = Math.min(audio.currentTime - last.time, 2); // cap at 2s to avoid jumps from seeking
      if (delta > 0.1) {
        listenTimesRef.current = { ...listenTimesRef.current, [song.id]: (listenTimesRef.current[song.id] || 0) + delta };
        setListenTimes(listenTimesRef.current);
      }
    }
    lastTimeUpdateRef.current = { src: srcKey, time: audio.currentTime };
  }, [audio.currentTime, audio.playingSrc, songs]);

  // Persist listen times every 10 seconds (only if non-empty)
  useEffect(() => {
    const interval = setInterval(() => {
      const data = listenTimesRef.current;
      if (data && Object.keys(data).length > 0) {
        localStorage.setItem("imade_listenTimes", JSON.stringify(data));
      }
    }, 10000);
    return () => clearInterval(interval);
  }, []);

  // One-time migration: convert old baseElo values (1500 system) to new 0-1000 system
  useEffect(() => {
    if (!loaded || songs.length === 0) return;
    const migrated = localStorage.getItem("imade_elo_migrated_v2");
    if (migrated) return;
    // Any song with baseElo > 1000 is definitely from old system
    // Songs with baseElo in ~1100-1900 range are old system values
    const oldScaleSongs = songs.filter(s => s.baseElo != null && s.baseElo > 1000);
    if (oldScaleSongs.length === 0) {
      // No old values found — also clear any baseElo entirely so computed elo takes over
      const hasAnyBase = songs.filter(s => s.baseElo != null);
      if (hasAnyBase.length > 0) {
        const clearAll = async () => {
          for (const s of hasAnyBase) {
            const fd = new FormData();
            fd.append("baseElo", "");
            await api.put("/api/songs/" + s.id, fd);
          }
          localStorage.setItem("imade_elo_migrated_v2", "1");
          await refresh();
        };
        clearAll();
      } else {
        localStorage.setItem("imade_elo_migrated_v2", "1");
      }
      return;
    }
    // Convert: subtract 1000 and clamp to 0-1000
    const migrate = async () => {
      for (const s of oldScaleSongs) {
        const newElo = Math.max(0, Math.min(1000, s.baseElo - 1000));
        const fd = new FormData();
        fd.append("baseElo", String(newElo));
        await api.put("/api/songs/" + s.id, fd);
      }
      localStorage.setItem("imade_elo_migrated_v2", "1");
      await refresh();
    };
    migrate();
  }, [loaded, songs.length]);

  // Measure sticky header height
  useEffect(() => {
    if (!headerRef.current) return;
    const measure = () => setHeaderHeight(headerRef.current.getBoundingClientRect().height);
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(headerRef.current);
    return () => ro.disconnect();
  }, [uploading]);

  // Batched upload function
  const startUpload = async (filesToUpload) => {
    if (!filesToUpload.length || uploading) return;
    setUploading(true);
    setUploadDone(false);
    uploadAbortRef.current = false;
    const total = filesToUpload.length;
    setUploadProgress({ done: 0, total });

    for (let i = 0; i < total; i += BATCH_SIZE) {
      if (uploadAbortRef.current) break;
      const batch = filesToUpload.slice(i, i + BATCH_SIZE);
      const fd = new FormData();
      const dates = {};
      for (const f of batch) {
        fd.append("audio", f);
        dates[f.name] = f.lastModified;
      }
      fd.append("dates", JSON.stringify(dates));
      try {
        await api.post("/api/songs/bulk", fd);
      } catch (e) { console.error("Batch upload error:", e); }
      setUploadProgress({ done: Math.min(i + BATCH_SIZE, total), total });
    }

    setUploadFiles([]);
    setUploading(false);
    setUploadDone(true);
    await refresh();
  };

  const cancelUpload = () => { uploadAbortRef.current = true; };

  if (!loaded) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",color:"#6b7280"}}>Loading...</div>;

  const tabs = [
    { id: "library", label: "Library", count: songs.length },
    { id: "player", label: "Player" },
    { id: "upload", label: "Upload" },
    { id: "playlists", label: "Playlists", count: playlists.length },
    { id: "battle", label: "Compare" },
    { id: "rankings", label: "Rankings" },
    { id: "stats", label: "Stats" },
    { id: "genres", label: "Settings" },
  ];

  const uploadPct = uploadProgress.total > 0 ? uploadProgress.done / uploadProgress.total : 0;

  return (
    <div style={{minHeight:"100vh"}}>
      {/* Global upload progress bar - visible from any tab */}
      {uploading && (
        <div style={{position:"fixed",top:0,left:0,right:0,zIndex:2000}}>
          <div style={{height:4,background:"#1a1a2e"}}>
            <div style={{width:(uploadPct*100)+"%",height:"100%",background:"linear-gradient(90deg,#4338ca,#818cf8)",transition:"width 0.3s ease"}} />
          </div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:12,padding:"8px 16px",background:"#1a1535ee",backdropFilter:"blur(8px)",borderBottom:"1px solid #2a2a45"}}>
            <span style={{color:"#818cf8",fontSize:13}}>Uploading {uploadProgress.done} / {uploadProgress.total} songs...</span>
            <span style={{color:"#6b7280",fontSize:13}}>{Math.round(uploadPct*100)}%</span>
            <button onClick={cancelUpload} style={{background:"none",border:"1px solid #2a2a45",borderRadius:6,padding:"3px 10px",color:"#6b7280",fontSize:11,cursor:"pointer"}}
              onMouseEnter={e=>e.target.style.color="#ef4444"} onMouseLeave={e=>e.target.style.color="#6b7280"}>cancel</button>
          </div>
        </div>
      )}

      {/* Header */}
      <div ref={headerRef} style={{position:"sticky",top:0,zIndex:20,background:"#13102a"}}>
      <div style={{padding: uploading ? "80px 24px 0" : "32px 24px 0",maxWidth:1200,margin:"0 auto",transition:"padding 0.3s"}}>
        <div style={{display:"flex",alignItems:"baseline",gap:12,marginBottom:0}}>
          <h1 style={{margin:0,fontSize:"clamp(28px,6vw,40px)",fontWeight:700,background:"linear-gradient(135deg,#e2e8f0,#818cf8)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",letterSpacing:"-0.02em",lineHeight:1.1}}>IMAde</h1>
        </div>

        {/* Tabs */}
        <div style={{display:"flex",gap:2,marginTop:16,borderBottom:"1px solid #1e1e35",overflowX:"auto"}}>
          {tabs.map(t => (
            <button key={t.id} onClick={()=>switchTab(t.id)} style={{
              background:"transparent",
              border:"none", borderBottom: tab===t.id ? "2px solid #818cf8" : "2px solid transparent",
              padding:"10px 18px", color: tab===t.id ? "#e2e8f0" : "#6b6b80",
              fontSize:13, cursor:"pointer", whiteSpace:"nowrap",
            }}
              onMouseEnter={e=>{if(tab!==t.id)e.target.style.color="#a0a0b0"}}
              onMouseLeave={e=>{if(tab!==t.id)e.target.style.color="#6b6b80"}}
            >
              {t.label}
              {t.count != null && <span style={{marginLeft:5,fontSize:10,color:tab===t.id?"#818cf8":"#5a5a70"}}>{t.count}</span>}
              {t.id === "upload" && uploading && <span style={{marginLeft:5,fontSize:8,color:"#818cf8",animation:"pulse 1.5s infinite"}}>●</span>}
            </button>
          ))}
        </div>
      </div>
      </div>

      {/* Toast */}
      {toast && <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#1e1e35",border:"1px solid #2a2a45",borderRadius:10,padding:"10px 20px",color:"#e2e8f0",fontSize:13,zIndex:100,animation:"fadeUp 0.2s ease-out",boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>{toast}</div>}

      {/* Content */}
      <div style={{maxWidth:1200,margin:"0 auto",padding:"20px 24px 40px"}}>
        {tab === "player" && <PlayerTab songs={songs} genres={genres} comparisons={comparisons} onRefresh={refresh} showToast={showToast} switchTab={switchTab}
          queue={playerQueue} setQueue={setPlayerQueue} queueIdx={playerQueueIdx} setQueueIdx={setPlayerQueueIdx}
          shuffle={playerShuffle} setShuffle={setPlayerShuffle} loop={playerLoop} setLoop={setPlayerLoop} />}
        {tab === "library" && <LibraryTab songs={songs} genres={genres} onRefresh={refresh}
          filterGenre={libFilterGenre} setFilterGenre={setLibFilterGenre}
          selectMode={libSelectMode} setSelectMode={setLibSelectMode}
          selectedIds={libSelectedIds} setSelectedIds={setLibSelectedIds}
          batchGenre={libBatchGenre} setBatchGenre={setLibBatchGenre}
          stickyTop={headerHeight} listenTimes={listenTimes}
          setPlayerQueue={setPlayerQueue} setPlayerQueueIdx={setPlayerQueueIdx} switchTab={switchTab}
          playlists={playlists} showToast={showToast} rowDensity={rowDensity} />}
        {tab === "upload" && <UploadTab
          onRefresh={refresh} genres={genres} songs={songs}
          uploadFiles={uploadFiles} setUploadFiles={setUploadFiles}
          uploading={uploading} uploadDone={uploadDone} setUploadDone={setUploadDone}
          uploadProgress={uploadProgress} startUpload={startUpload} />}
        {tab === "playlists" && <PlaylistsTab songs={songs} playlists={playlists} genres={genres} comparisons={comparisons} onRefresh={refresh} showToast={showToast}
          setPlayerQueue={setPlayerQueue} setPlayerQueueIdx={setPlayerQueueIdx} />}
        <div style={{display: tab === "battle" ? "block" : "none"}}>
          {loaded && <BattleTab songs={songs} comparisons={comparisons} onRefresh={refresh} showToast={showToast} savedPair={battlePair} setSavedPair={setBattlePair}
            hasSeenIntro={hasSeenIntro} setHasSeenIntro={persistIntro} hasSeenPhase2={hasSeenPhase2} setHasSeenPhase2={persistPhase2}
            focusedSessionSongs={focusedSessionSongs} setFocusedSessionSongs={setFocusedSessionSongs} stopAudio={audio.stop}
            sessionLength={sessionLength} bracketSize={bracketSize} />}
        </div>
        {tab === "rankings" && <RankingsTab songs={songs} comparisons={comparisons} onRefresh={refresh} showToast={showToast}
          lastUpdateCompCount={lastUpdateCompCount} setLastUpdateCompCount={setLastUpdateCompCount} switchTab={switchTab}
          showVariance={showVariance} showWinLoss={showWinLoss} rowDensity={rowDensity}
          setPlayerQueue={setPlayerQueue} setPlayerQueueIdx={setPlayerQueueIdx} />}
        {tab === "stats" && <StatsTab songs={songs} comparisons={comparisons} listenTimes={listenTimes}
          setPlayerQueue={setPlayerQueue} setPlayerQueueIdx={setPlayerQueueIdx} switchTab={switchTab}
          onStartFocusedSession={(songIds) => { setFocusedSessionSongs(songIds); switchTab("battle"); }} />}
        {tab === "genres" && <SettingsTab genres={genres} songs={songs} comparisons={comparisons} playlists={playlists} onRefresh={refresh} showToast={showToast}
          showVariance={showVariance} setShowVariance={(v) => { setShowVariance(v); localStorage.setItem("imade_showVariance", v ? "1" : "0"); }}
          sessionLength={sessionLength} setSessionLength={(v) => persistSetting("sessionLength", v, setSessionLength)}
          bracketSize={bracketSize} setBracketSize={(v) => { const n = Number(v); setBracketSize(n); localStorage.setItem("imade_bracketSize", String(n)); }}
          showWinLoss={showWinLoss} setShowWinLoss={(v) => { setShowWinLoss(v); localStorage.setItem("imade_showWinLoss", v ? "1" : "0"); }}
          theme={theme} setTheme={(v) => persistSetting("theme", v, setTheme)}
          rowDensity={rowDensity} setRowDensity={(v) => persistSetting("rowDensity", v, setRowDensity)}
          listenTimes={listenTimes} setListenTimes={setListenTimes} listenTimesRef={listenTimesRef}
          />}
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("React crash:", error, info.componentStack); }
  render() {
    if (this.state.error) return React.createElement("div", {style:{padding:40,textAlign:"center"}},
      React.createElement("h2", {style:{color:"#ef4444"}}, "Something crashed"),
      React.createElement("pre", {style:{color:"#e2e8f0",fontSize:12,textAlign:"left",background:"#14142a",padding:16,borderRadius:8,overflow:"auto",maxHeight:300,marginTop:16}}, String(this.state.error) + "\n" + (this.state.error?.stack || "")),
      React.createElement("button", {onClick:()=>this.setState({error:null}),style:{marginTop:16,padding:"10px 20px",borderRadius:8,background:"#4338ca",border:"none",color:"#fff",cursor:"pointer"}}, "Try to recover")
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(AudioProvider, null, React.createElement(ErrorBoundary, null, React.createElement(App))));
</script>
</body>
</html>
